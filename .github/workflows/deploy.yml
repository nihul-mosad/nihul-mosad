# פרסום לאתר — רק אחרי שכל הבדיקות עברו, ורק אחרי אישור ידני של המנהל.
#
# כדי שהקובץ הזה יפעל צריך שני שינויים בהגדרות של GitHub (לא נעשו — דורשים אישור):
#   1. Settings → Pages → Source: "GitHub Actions" (במקום "Deploy from a branch").
#   2. Settings → Environments → production → Required reviewers: המנהל.
# עד שזה נעשה, האתר ממשיך להתפרסם כמו היום, והקובץ הזה לא משפיע עליו.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: production            # כאן העבודה נעצרת ומחכה ללחיצה על "Approve"
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: אוספים רק את קובצי האתר (בלי קוד שרת, חוקים ובדיקות)
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest robots.txt _site/
          cp -r icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: pages
        uses: actions/deploy-pages@v4
