async function sumGenerate(){
  const s=studentById(SUMS.sid);if(!s)return;
  const leak=sumLeak(SUMS.packet,s);
  if(leak.length){SUMS.phase='error';SUMS.err='החבילה לא נשלחה: נמצא בה פרט מזהה ('+leak.join(', ')+'). פנו לתמיכה.';return sumPaint();}
  SUMS.phase='busy';SUMS.err='';SUMS.saved='';sumPaint();
  try{
    await loadFnSDK();
    const fn=firebase.app().functions(AC_FN_REGION).httpsCallable('studentSummary',{timeout:130000});
    const r=await fn({inst:S.inst,packet:SUMS.packet}),d=(r&&r.data)||{};
    const t=String(d.text||'').trim();if(!t)throw {code:'unavailable',message:'Claude החזיר תשובה ריקה'};
    if(!SUMS)return;
    SUMS.text=t.split(SUM_TOKEN).join(s.name||'');SUMS.edited=false;SUMS.phase='done';SUMS.model=d.model||'';
  }catch(e){if(!SUMS)return;SUMS.phase='error';SUMS.err=acApiErr(e);}
  sumPaint();
}

/* ---- PDF בלי ספריות: כל עמוד A4 מצויר על canvas ומוטמע כ-JPEG ---- */
async function sumPdf(s,text,opt){
  const F='"Noto Sans Hebrew","Noto Sans","Arial",sans-serif',W=1240,H=1754,M=105,X=W-M,BW=W-2*M;
  try{await Promise.all(['400 27px','700 27px'].map(f=>document.fonts.load(f+' "Noto Sans Hebrew"')));}catch(e){}
  const logo=S.config.logo?await new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src=S.config.logo;}):null;
  const pages=[];let ctx,y;
  const font=(w,z,c)=>{ctx.font=w+' '+z+'px '+F;ctx.fillStyle=c||'#1a2350';};
  const page=()=>{const cv=document.createElement('canvas');cv.width=W;cv.height=H;ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    ctx.direction='rtl';ctx.textAlign='right';ctx.textBaseline='alphabetic';pages.push(cv);font('400',20,'#6b7280');ctx.fillText('בס״ד',W-56,58);y=M;};
  const wrap=(t,max)=>{const out=[];String(t).split('\n').forEach(par=>{let line='';par.split(/\s+/).filter(Boolean).forEach(w=>{const tt=line?line+' '+w:w;if(ctx.measureText(tt).width>max&&line){out.push(line);line=w;}else line=tt;});out.push(line);});return out;};
  const need=h=>{if(y+h>H-130)page();};
  page();
  // כותרת
  if(logo){const sc=Math.min(150/logo.width,150/logo.height,1);ctx.drawImage(logo,M,70,logo.width*sc,logo.height*sc);}
  font('700',36,'#0c1556');ctx.fillText(S.config.name||'',X,128);
  font('400',26,'#546198');ctx.fillText('סיכום תלמיד להורים',X,170);
  const today=(opt&&opt.date)||iso(new Date());
  ctx.strokeStyle='#d9def3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(M,236);ctx.lineTo(X,236);ctx.stroke();
  font('700',42,'#0c1556');ctx.fillText(s.name||'',X,306);
  font('400',24,'#546198');ctx.fillText((s.cls?s.cls+'   ·   ':'')+Number(today.slice(8,10))+'.'+Number(today.slice(5,7))+'.'+today.slice(0,4)+(hebLabel(today)?'   ·   '+hebLabel(today):''),X,350);
  y=420;
  // גוף
  String(text).replace(/\r/g,'').split(/\n{1,}/).forEach(function(par){
    par=par.trim();if(!par)return;
    if(/^#{1,3}\s*/.test(par)){const h=par.replace(/^#{1,3}\s*/,'');need(110);y+=22;font('700',30,'#3d6bf7');ctx.fillText(h,X,y);y+=14;
      ctx.strokeStyle='#e6eaf7';ctx.beginPath();ctx.moveTo(X-Math.min(BW,ctx.measureText(h).width+40),y);ctx.lineTo(X,y);ctx.stroke();y+=44;return;}
    font('400',27,'#1a2350');wrap(par,BW).forEach(l=>{need(46);ctx.fillText(l,X,y);y+=46;});y+=16;
  });
  // חתימה
  need(150);y+=30;font('400',27,'#1a2350');ctx.fillText('בברכה,',X,y);y+=46;font('700',27,'#0c1556');ctx.fillText((opt&&opt.by)||S.me.teacher||S.me.user||'',X,y);y+=40;
  font('400',24,'#546198');ctx.fillText('מנהל'+(S.config.name?' · '+S.config.name:''),X,y);
  // כותרות תחתונות
  pages.forEach(function(cv,i){const c=cv.getContext('2d');c.direction='rtl';c.textAlign='center';c.font='400 20px '+F;c.fillStyle='#8a93b2';
    c.strokeStyle='#e6eaf7';c.lineWidth=2;c.beginPath();c.moveTo(M,H-92);c.lineTo(X,H-92);c.stroke();
    c.fillText('עמוד '+(i+1)+' מתוך '+pages.length+'   ·   '+(s.name||''),W/2,H-58);});
  const jpgs=pages.map(cv=>{const b=atob(cv.toDataURL('image/jpeg',0.9).split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;});
  return sumPdfBytes(jpgs,W,H);
}
function sumPdfBytes(jpgs,W,H){
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  const obj=(i,body)=>{offs[i]=len;push(i+' 0 obj\n'+body+'\nendobj\n');};
  push('%PDF-1.4\n%âãÏÓ\n');
  const n=jpgs.length,kids=jpgs.map((_,k)=>(3+3*k)+' 0 R').join(' ');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids ['+kids+'] /Count '+n+' >>');
  jpgs.forEach(function(b,k){const p=3+3*k,cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(p,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+(p+2)+' 0 R >> >> /Contents '+(p+1)+' 0 R >>');
    obj(p+1,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    offs[p+2]=len;push((p+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+W+' /Height '+H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+b.length+' >>\nstream\n');push(b);push('\nendstream\nendobj\n');});
  const total=2+3*n,xo=len;
  let x='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';for(let i=1;i<=total;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}

/* ---- שמירה לתיקייה "סיכומי תלמידים" ---- */
function sumIdb(op,val){return new Promise(function(res){try{const r=indexedDB.open('tt-sum',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>{try{const db=r.result,st=db.transaction('kv',op==='get'?'readonly':'readwrite').objectStore('kv'),k='dir:'+(S.inst||'');
    const q=op==='get'?st.get(k):op==='del'?st.delete(k):st.put(val,k);q.onsuccess=()=>res(op==='get'?(q.result||null):true);q.onerror=()=>res(null);}catch(e){res(null);}};
  r.onerror=()=>res(null);}catch(e){res(null);}});}
let SUM_DIRH=null;
async function sumGetDir(pick){
  let d=pick?null:(SUM_DIRH||await sumIdb('get'));
  if(d){let p='denied';try{p=await d.queryPermission({mode:'readwrite'});if(p!=='granted')p=await d.requestPermission({mode:'readwrite'});}catch(e){}if(p==='granted'){SUM_DIRH=d;return d;}}
  const root=await window.showDirectoryPicker({id:'tt-summaries',mode:'readwrite',startIn:'documents'});
  d=root.name===SUM_DIR?root:await root.getDirectoryHandle(SUM_DIR,{create:true});
  SUM_DIRH=d;await sumIdb('put',d);return d;
}
function sumFileName(s){const t=iso(new Date());return (String(s.name||'תלמיד').replace(/[\\/:*?"<>|]+/g,'-').trim()||'תלמיד')+' - '+Number(t.slice(8,10))+'.'+Number(t.slice(5,7))+'.'+t.slice(0,4)+'.pdf';}
async function sumWrite(dir,name,blob){
  let fn=name;
  for(let i=2;i<100;i++){try{await dir.getFileHandle(fn);fn=name.replace(/\.pdf$/,' ('+i+').pdf');}catch(e){if(e&&e.name==='NotFoundError')break;throw e;}}
  const fh=await dir.getFileHandle(fn,{create:true}),w=await fh.createWritable();await w.write(blob);await w.close();return fn;
}
async function sumSave(pick){
  const s=studentById(SUMS.sid);if(!s||!SUMS.text.trim())return;
  SUMS.err='';SUMS.saved='';const name=sumFileName(s);
  try{
    if(window.showDirectoryPicker){
      const dir=await sumGetDir(pick);  // קודם התיקייה (דורש לחיצה של המשתמש), אחר כך בניית הקובץ
      SUMS.dir=dir.name;const blob=await sumPdf(s,SUMS.text);
      const fn=await sumWrite(dir,name,blob);SUMS.saved=dir.name+' / '+fn;
    }else{
      const blob=await sumPdf(s,SUMS.text),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);SUMS.saved='הורדות / '+name;
    }
    SUMS.edited=false;toast('הסיכום נשמר כ-PDF');
  }catch(e){SUMS.err=e&&e.name==='AbortError'?'השמירה בוטלה.':'לא הצלחתי לשמור את הקובץ'+(e&&e.message?' ('+e.message+')':'')+'.';}
  sumPaint();
}
/* ===== שיתוף סיכום עם מחנך הכיתה =====
   נשמר ב-sums/{שנת לימודים}_{כיתה}, בשדה m: {id: סיכום}. רק הנוסח הסופי שהמנהל אישר, ורק אחרי שהשרת אישר את השמירה.
   חוקי Firestore: קריאה — מנהל ומחנך הכיתה (members.classes); כתיבה — מנהל בלבד. המחנך לא יכול לערוך או למחוק.
   הסימון "חדש" אצל המחנך נשמר רק בדפדפן שלו (בלי כתיבה למערכת). */
function sumYear(d){const t=d||iso(new Date()),y=+t.slice(0,4),m=+t.slice(5,7);return m>=9?y:y-1;}
function sumDocId(cls,date){return sumYear(date)+'_'+ckOf(cls);}
function sumTeacher(cls){return String((S.config.homeroom||{})[cls]||'').trim();}
async function loadSums(){
  const out=[],add=d=>{if(d)Object.values(nn(d.m)).forEach(it=>{if(it&&it.id&&it.sid)out.push(it);});};
  try{
    if(isAdmin())(await fsList('sums')).forEach(x=>add(x.data));
    else{const y=sumYear(),ids=[];myClasses().forEach(c=>{ids.push(y+'_'+ckOf(c),(y-1)+'_'+ckOf(c));});
      await inChunks(ids,async id=>add(await fsGet('sums/'+id).catch(()=>null)),10);}

function logTable(rows,withInst){

async function userAction(a,el){
  if(a==='bulk-open'){
    const linked={};S.config.users.forEach(u=>{if(u.teacher)linked[u.teacher]=1;});
    S.bulk={list:teachersList().filter(t=>!linked[t]).map(t=>({teacher:t,user:t,on:true}))};S.editUser=null;return render();
  }
  if(a==='bulk-close'){S.bulk=null;return render();}
  if(a==='bulk-run'){
    document.querySelectorAll('#main [data-bku]').forEach(inp=>{S.bulk.list[+inp.dataset.bku].user=inp.value.trim();});
    const todo=S.bulk.list.filter(x=>x.on&&x.user);if(!todo.length)return toast('לא נבחרו מורים');
    const taken={};S.config.users.forEach(u=>taken[ukey(u.user)]=1);
    for(const x of todo){if(taken[ukey(x.user)])return toast('שם המשתמש "'+x.user+'" כבר קיים');taken[ukey(x.user)]=1;}
    const out=[];let i=0;
    for(const x of todo){
      i++;toast('יוצר '+i+' מתוך '+todo.length+'…');
      try{
        const pin=newPin(),r=await createAuthUser(S.inst,x.user,pin),b=FS.batch();
        b.set(FS.doc('insts/'+S.inst+'/members/'+r.uid),{user:x.user,role:'teacher',cls:'',teacher:x.teacher,active:true});
        b.set(FS.doc('logins/'+S.inst+'_'+ukey(x.user)),{email:r.email,inst:S.inst,key:ukey(x.user)});
        await b.commit();out.push({teacher:x.teacher,user:x.user,pin:pin});
      }catch(e){toast(x.user+': '+fbErr(e));break;}
    }
    await reloadMembers();S.bulk=null;S.creds=out;logAct('יצירת משתמשים',out.length+' מורים');
    toast(out.length+' משתמשים נוצרו');return render();
  }
  if(a==='user-pin'){
    const u=S.config.users.find(x=>x.id===el.dataset.id);if(!u)return;
    if(!confirm('ליצור קוד כניסה חדש ל"'+u.user+'"? הקוד הקודם יפסיק לעבוד.'))return;
    try{
      const pin=newPin(),r=await createAuthUser(S.inst,u.user,pin),b=FS.batch();
      b.delete(FS.doc('insts/'+S.inst+'/members/'+u.id));
      b.set(FS.doc('insts/'+S.inst+'/members/'+r.uid),{user:u.user,role:u.role,cls:'',teacher:u.teacher||'',active:true});
      b.set(FS.doc('logins/'+S.inst+'_'+ukey(u.user)),{email:r.email,inst:S.inst,key:ukey(u.user)});
      await b.commit();await reloadMembers();S.creds=[{teacher:u.teacher,user:u.user,pin:pin}];logAct('קוד כניסה חדש',u.user);return render();
    }catch(e){return toast(fbErr(e));}
  }
  if(a==='cred-copy'){const c=S.creds[+el.dataset.i];try{await navigator.clipboard.writeText(credMsg(c));toast('הועתק');}catch(e){toast('ההעתקה לא הצליחה');}return;}
  if(a==='cred-copyall'){const t=S.creds.map(c=>(c.teacher||'')+' | '+c.user+' | '+c.pin).join('\n');try{await navigator.clipboard.writeText('קוד מוסד: '+S.inst+'\n'+t);toast('הועתק');}catch(e){toast('ההעתקה לא הצליחה');}return;}
  if(a==='cred-close'){if(!confirm('לסגור? אחרי הסגירה לא תוכלו לראות שוב את הקודים.'))return;S.creds=null;return render();}
  if(a==='join-new'){
    try{
      const old=S.config.joinToken,tk=newToken();
      await FS.doc('joins/'+tk).set({inst:S.inst,instName:S.config.name,active:true,teachers:teachersList(),created:Date.now()});
      if(old)FS.doc('joins/'+old).delete().catch(()=>{});
      S.config.joinToken=tk;await save(K.config,S.config);logAct('קישור הצטרפות חדש','');toast('הקישור מוכן');return render();
    }catch(e){return toast(fbErr(e));}
  }
  if(a==='join-off'){
    if(!confirm('לבטל את קישור ההצטרפות? מי שעוד לא נרשם לא יוכל להשתמש בו.'))return;
    try{if(S.config.joinToken)await FS.doc('joins/'+S.config.joinToken).delete();}catch(e){}
    S.config.joinToken='';await save(K.config,S.config);toast('הקישור בוטל');return render();
  }
  if(a==='join-copy'){try{await navigator.clipboard.writeText(SITE_URL+'?join='+S.config.joinToken);toast('הקישור הועתק');}catch(e){toast('ההעתקה לא הצליחה');}return;}
  if(a==='jr-ok'||a==='jr-no'){
    const i=+el.dataset.i,r=S.joinReqs[i];if(!r)return;
    try{

async function doJoin(){
  const J=S.joinInfo,g=id=>document.getElementById(id).value,err=document.getElementById('jn-err'),btn=document.getElementById('jn-go');
  const t=g('jn-t'),name=t==='__other'?g('jn-name').trim():t,user=g('jn-u').trim(),p=g('jn-p'),p2=g('jn-p2');

    const email=ukey(user).slice(0,40)+'.'+Math.random().toString(36).slice(2,7)+'@'+J.inst+'.'+MAIL_DOMAIN;

function weekStart(){const d=new Date();d.setDate(d.getDate()-d.getDay());return iso(d);}
async function loadConsole(){
  const q=await FS.collection('insts').get(),list=[],today=iso(new Date()),ws=weekStart();
  const days=[];for(let d=new Date(ws+'T12:00:00');iso(d)<=today;d.setDate(d.getDate()+1))days.push(iso(d));
  for(const d of q.docs){
    const code=d.id,data=d.data()||{},o={code:code,name:data.name||code,disabled:!!data.disabled,students:0,users:0,pend:0,usage:null,log:[]};
    try{const cq=await FS.collection('insts/'+code+'/cls').get();o.students=cq.docs.reduce((a,x)=>a+Object.values((x.data()||{}).m||{}).filter(Boolean).length,0);
      if(!cq.docs.length){const st=await FS.doc('insts/'+code+'/store/students').get();o.students=st.exists?Object.values((st.data()||{}).m||{}).filter(Boolean).length:0;}}catch(e){}
    try{const mm=await FS.collection('insts/'+code+'/members').get();o.users=mm.docs.filter(x=>(x.data()||{}).active!==false).length;}catch(e){}
    try{const rq=await FS.collection('insts/'+code+'/requests').get();o.pend=rq.docs.length;}catch(e){}
    try{const lg=await FS.collection('insts/'+code+'/log').orderBy('ts','desc').limit(30).get();o.log=lg.docs.map(x=>Object.assign({inst:code,instName:o.name},x.data()));}catch(e){}
    try{
      const tt=await FS.doc('insts/'+code+'/store/timetable').get(),m=tt.exists?((tt.data()||{}).m||{}):{};
      const lessons=Object.values(m).filter(Boolean);
      if(lessons.length){
        const months=Array.from(new Set(days.map(x=>x.slice(0,7)))),marks={};
        const aq=await FS.collection('insts/'+code+'/att').get();
        aq.docs.forEach(a=>{if(!months.some(mo=>a.id.indexOf('L'+mo)===0))return;const dd=(a.data()||{}).d||{};Object.keys(dd).forEach(k=>marks[k]=Object.assign(marks[k]||{},dd[k]||{}));});
        let tot=0,done=0;
        days.forEach(function(day){const dw=new Date(day+'T12:00:00').getDay();if(dw>5)return;const mk=marks[day]||{};
          lessons.filter(l=>l.day===dw).forEach(l=>{tot++;if(Object.keys(mk).some(k=>k.indexOf(l.id+':')===0&&mk[k]))done++;});});
        o.usage=tot?Math.round(done/tot*100):null;
      }
    }catch(e){}
    o.last=o.log[0]?o.log[0].ts:null;list.push(o);
  }
  let log=[];list.forEach(o=>log=log.concat(o.log));log.sort((a,b)=>b.ts-a.ts);
  S.console={list:list,log:log.slice(0,120),at:Date.now()};
}

  const nw='<div class="card"><h3>מוסד חדש</h3><div class="grid g2">'+
      '<label class="field"><span>קוד מוסד (באנגלית)</span><input id="ni-code" dir="ltr" placeholder="למשל: beitar-boys" autocapitalize="none"></label>'+
      '<label class="field"><span>שם המוסד</span><input id="ni-name"></label>'+

      '<label class="field"><span>סיסמה ראשונית</span><input id="ni-pass" type="text"></label>'+
    '</div><div class="row"><button class="btn" data-v="primary" data-act="inst-new">יצירת המוסד</button></div></div>';
  const tip=S.inst?'':'<div class="warn">נכנסת כבעל המערכת. לעבודה השוטפת במוסד שלך מומלץ ליצור לעצמך משתמש מנהל רגיל בתוך המוסד (בהגדרות ← משתמשים), ולהשתמש בחשבון הזה רק לניהול המערכת.</div>';

function nameTokens(full,other){

function nmKey(n){return String(n||'').replace(/[\u200e\u200f]/g,'').replace(/[׳'״"\-]/g,'').replace(/\s+/g,' ').trim();}
function idOf(st){const x=st.extra||{};const k=Object.keys(x).find(k=>/ת\s*\.?\s*ז|תעודת\s*זהות|ת"ז|ת״ז|מספר\s*זהות/.test(k));return k?String(x[k]).replace(/\D/g,''):'';}
function mergePlan(rows){
  const byId={},byName={},used={};
  S.students.forEach(st=>{const i=idOf(st);if(i)byId[i]=st;const n=nmKey(st.name);(byName[n]=byName[n]||[]).push(st);});
  const plan=rows.map(function(r){
    let m=null;const i=idOf(r);
    if(i&&byId[i]&&!used[byId[i].id])m=byId[i];
    if(!m){m=(byName[nmKey(r.name)]||[]).find(st=>!used[st.id]&&(!r.cls||!st.cls||st.cls===r.cls))||(byName[nmKey(r.name)]||[]).find(st=>!used[st.id]);}
    if(m)used[m.id]=1;
    let changed=false;
    if(m&&alignedToExisting(m,r))swapParents(r);
    if(m){['name','cls','father','fatherPhone','mother','motherPhone','notes'].forEach(f=>{if(r[f]&&r[f]!==m[f])changed=true;});
      Object.keys(r.extra||{}).forEach(k=>{if(r.extra[k]&&(!m.extra||m.extra[k]!==r.extra[k]))changed=true;});}
    return {row:r,match:m,changed:changed};
  });
  const missing=S.students.filter(st=>!used[st.id]);
  return {plan:plan,upd:plan.filter(x=>x.match&&x.changed).length,same:plan.filter(x=>x.match&&!x.changed).length,add:plan.filter(x=>!x.match).length,missing:missing};
}
function applyMerge(removeMissing){
  const M=mergePlan(S.importPreview.rows);
  M.plan.forEach(function(x){
    if(!x.match){S.students.push(x.row);return;}
    const m=x.match,r=x.row;
    if(alignedToExisting(m,r))swapParents(r);
    const keepOk=!m.parentCheck;
    ['name','cls','father','fatherPhone','mother','motherPhone','notes'].forEach(f=>{if(r[f])m[f]=r[f];});
    if(r.extra&&Object.keys(r.extra).length){m.extra=Object.assign({},m.extra||{});Object.keys(r.extra).forEach(k=>{if(r.extra[k])m.extra[k]=r.extra[k];});}
    if(keepOk)delete m.parentCheck;else if(r.parentCheck)m.parentCheck=true;
  });
  if(removeMissing){const gone={};M.missing.forEach(st=>gone[st.id]=1);S.students=S.students.filter(st=>!gone[st.id]);}
  return M;
}

    const pj=await loadPdfJs(),doc=await pj.getDocument({data:await f.arrayBuffer()}).promise,out=[];
    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i),vp0=pg.getViewport({scale:1}),sc=Math.min(3,2000/Math.max(vp0.width,vp0.height)),vp=pg.getViewport({scale:sc});
      const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:cx,viewport:vp}).promise;out.push(c);}

  }

  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=url;});return [toCanvas(img,img.naturalWidth,img.naturalHeight)];}

function otsu(g){const h=new Array(256).fill(0);for(let i=0;i<g.length;i+=3)h[g[i]]++;let tot=0,sum=0;h.forEach((v,i)=>{tot+=v;sum+=i*v;});

function findSquares(g,W,H,T){
  const seen=new Uint8Array(W*H),out=[],st=new Int32Array(W*H);
  for(let s0=0;s0<W*H;s0++){
    if(seen[s0]||g[s0]>=T)continue;
    let sp=0,cnt=0,x0=W,x1=0,y0=H,y1=0;st[sp++]=s0;seen[s0]=1;
    while(sp){const p=st[--sp],x=p%W,y=(p-x)/W;cnt++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0){const q=p-1;if(!seen[q]&&g[q]<T){seen[q]=1;st[sp++]=q;}}
      if(x<W-1){const q=p+1;if(!seen[q]&&g[q]<T){seen[q]=1;st[sp++]=q;}}
      if(y>0){const q=p-W;if(!seen[q]&&g[q]<T){seen[q]=1;st[sp++]=q;}}
      if(y<H-1){const q=p+W;if(!seen[q]&&g[q]<T){seen[q]=1;st[sp++]=q;}}}

function homography(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){const x=src[i][0],y=src[i][1],u=dst[i][0],v=dst[i][1];
    A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}
  for(let c=0;c<8;c++){let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];if(Math.abs(A[c][c])<1e-12)return null;
    for(let r=0;r<8;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<8;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c];}}
  const h=b.map((v,i)=>v/A[i][i]);
  return (x,y)=>{const z=h[6]*x+h[7]*y+1;return [(h[0]*x+h[1]*y+h[2])/z,(h[3]*x+h[4]*y+h[5])/z];};
}
function makeSampler(g,W,H,Hm){return (x,y)=>{const p=Hm(x,y),u=Math.round(p[0]),v=Math.round(p[1]);return (u<0||v<0||u>=W||v>=H)?255:g[v*W+u];};}
function readPage(cv){
  const W=cv.width,H=cv.height,g=grayOf(cv),T=Math.min(otsu(g),170);
  const sq=findSquares(g,W,H,T);
  if(sq.length<4)return {error:'לא נמצאו ארבעת הריבועים השחורים בפינות הדף'};
  const corners=[[0,0],[W,0],[0,H],[W,H]],pick=[],used={};
  corners.forEach(c=>{let best=-1,bd=1e18;sq.forEach((s,i)=>{if(used[i])return;const d=(s.x-c[0])**2+(s.y-c[1])**2;if(d<bd){bd=d;best=i;}});used[best]=1;pick.push(sq[best]);});
  const F=[[FM.fx[0],FM.fy[0]],[FM.fx[1],FM.fy[0]],[FM.fx[0],FM.fy[1]],[FM.fx[1],FM.fy[1]]];
  const img=pick.map(s=>[s.x,s.y]);
  // ארבעה כיוונים אפשריים (דף הפוך/מסובב)
  const orders=[[0,1,2,3],[3,2,1,0],[1,3,0,2],[2,0,3,1]];
  for(const o of orders){
    const Hm=homography(F,o.map(i=>img[i]));if(!Hm)continue;
    const smp=makeSampler(g,W,H,Hm),G0=fmGeom(1,1),bits=[];
    for(let i=0;i<32;i++){const p=G0.bit(i);let s=0;for(let dx=-0.8;dx<=0.81;dx+=0.8)for(let dy=-0.8;dy<=0.81;dy+=0.8)s+=smp(p.x+dx,p.y+dy);bits.push(s/9<T?1:0);}
    const code=fmDecode(bits);
    if(code)return {smp:smp,T:T,code:code,cv:cv};
  }
  return {smp:null,error:'הדף זוהה, אבל לא הצלחתי לקרוא את קוד הזיהוי שלו. בחרו כיתה ותאריך ידנית.',retry:{g:g,W:W,H:H,T:T,img:img,F:F,cv:cv}};
}
function readMarks(R,L,pi){
  const rows=L.pages[pi],G=fmGeom(rows.length,L.cols.length),smp=R.smp,out=[];
  rows.forEach(function(s,r){
    const cells={};
    L.cols.forEach(function(c,ci){
      const l=L.lessonOf(s,c.n);if(!l)return;
      const p=G.box(r,ci),bgs=[];
      [-1,1].forEach(sx=>[-0.6,0,0.6].forEach(dy=>bgs.push(smp(p.x+sx*Math.min(4.5,G.W/2-0.6),p.y+dy))));
      bgs.sort((a,b)=>a-b);const bg=Math.max(bgs[Math.floor(bgs.length/2)],R.T+20),thr=Math.min(bg*0.72,(bg+R.T)/2);
      let dark=0,n=0;const inn=FM.box/2-1.3;
      for(let dx=-inn;dx<=inn+1e-6;dx+=inn/4)for(let dy=-inn;dy<=inn+1e-6;dy+=inn/4){n++;if(smp(p.x+dx,p.y+dy)<thr)dark++;}
      const f=dark/n;
      cells[c.n]={lid:l.id,f:f,v:f>0.09?'absent':'present',unsure:f>0.035&&f<=0.09};
    });

  });

}

async function handleScanFiles(files){

      const R=readPage(cv);

        if(R.retry)S.scan.pages.push({need:true,name:nm,retry:R.retry,cls:S.markCls||clsOpts[0]||'',date:S.markDate,pg:0,msg:R.error});

async function evAction(a,el){
  const id=el.dataset.id;
  if(a==='goto-events'){S.evf={kind:'open',cls:'',days:'',q:''};return goTab('events');}
  if(a==='ev-new'){S.evc=evDefaults();window.scrollTo(0,0);return render();}
  if(a==='ev-view'){S.evView=el.dataset.v;try{localStorage.setItem('tt:evView',S.evView);}catch(x){}return render();}
  if(a==='ev-for'){const st=studentById(id);S.evc=evDefaults({sids:[id],cls:st?st.cls:''});S.tab='events';window.scrollTo(0,0);return render();}
  if(a==='ev-lesson'){const l=S.timetable.find(x=>x.id===S.markLesson),st=studentById(id);
    const pp=l&&periods().find(x=>x.n===l.period),inNow=S.markDate===iso(new Date())&&pp&&pp.start<=nowHM()&&(!pp.end||nowHM()<pp.end);
    S.evc=evDefaults({sids:[id],cls:st?st.cls:'',date:S.markDate,period:l?l.period:'',time:inNow?nowHM():(pp&&pp.start)||nowHM()});S.evBack=S.markLesson;S.tab='events';window.scrollTo(0,0);return render();}
  if(a==='ev-cancel'){S.evc=null;if(S.evBack){S.tab='mark';S.evBack=null;}return render();}
  evCapture();
  if(a==='ev-cls'){S.evc.cls=el.dataset.c;return render();}
  if(a==='ev-stu'){const c=S.evc,i=c.sids.indexOf(id);if(i>-1)c.sids.splice(i,1);else c.sids.push(id);return render();}
  if(a==='ev-type'){S.evc.type=S.evc.type===el.dataset.t?'':el.dataset.t;return render();}
  if(a==='ev-save'){
    const c=S.evc,t=evType(c.type);if(!c.sids.length)return toast('בחרו תלמיד');if(!t)return toast('בחרו מה קרה');
    if(t.sev===3&&!c.note.trim()&&!confirm('אירוע חמור בלי תיאור. לשמור בכל זאת?'))return;
    const tk=evTk(),ts=Date.now(),time=c.time||(c.date===iso(new Date())?nowHM():'');
    c.sids.forEach(sid=>{const st=studentById(sid);if(!st)return;
      S.events.push({id:uid(),sid:sid,sname:st.name,cls:st.cls,type:t.id,typeName:t.name,kind:t.kind,sev:t.sev,date:c.date,time:time,period:c.period?+c.period:'',note:c.note.trim(),by:S.me.teacher||S.me.user,byUid:S.me.id,tk:tk,ts:ts});});
    await save(K.events,S.events);
    logAct('דיווח אירוע',t.name+' · '+c.sids.map(x=>(studentById(x)||{}).name).join(', '));
    toast('הדיווח נשמר');S.evc=null;
    if(S.evBack){S.tab='mark';S.evBack=null;}
    return render();
  }
  if(a==='ev-handle'){
    const e=S.events.find(x=>x.id===id);if(!e||!canHandle(e))return;
    const n=prompt('מה נעשה? (לא חובה)','');if(n===null)return;
    e.handled=true;e.hnote=n.trim();e.hby=S.me.teacher||S.me.user;e.hts=Date.now();
    await save(K.events,S.events);logAct('אירוע טופל',(studentById(e.sid)||{}).name||'');toast('סומן כטופל');return render();
  }
  if(a==='ev-del'){
    const e=S.events.find(x=>x.id===id);if(!e||!canDelEv(e))return;
    if(!confirm('למחוק את הדיווח?'))return;
    S.events=S.events.filter(x=>x.id!==id);await save(K.events,S.events);logAct('מחיקת אירוע',(studentById(e.sid)||{}).name||'');toast('נמחק');return render();
  }
  if(a==='evt-add'){
    const n=document.getElementById('evtName').value.trim();if(!n)return;
    S.config.evTypes=evTypes().concat([{id:uid(),name:n,kind:document.getElementById('evtKind').value,sev:+document.getElementById('evtSev').value}]);
    if(S.config.evTypes[S.config.evTypes.length-1].kind==='pos')S.config.evTypes[S.config.evTypes.length-1].sev=1;
    save(K.config,S.config);toast('נוסף');return render();
  }
  if(a==='evt-del'){if(!confirm('להסיר את הסוג? דיווחים קיימים לא יימחקו.'))return;S.config.evTypes=evTypes().filter(t=>t.id!==id);save(K.config,S.config);return render();}
}

function markableLessons(date){
  const ls=lessonsOn(date);

  const mc=myClasses();
  return ls.filter(l=>(l.teacher&&l.teacher===S.me.teacher)||(l.classes||[]).some(c=>mc.indexOf(c)>-1));
}
function lessonStudents(l){
  if(l.type==='private'){const ids=l.students||[];return {list:S.students.filter(s=>ids.indexOf(s.id)>-1),away:[]};}
  const par=S.timetable.filter(o=>o.id!==l.id&&o.type==='private'&&o.day===l.day&&o.period===l.period);
  const inC=S.students.filter(s=>(l.classes||[]).indexOf(s.cls)>-1),list=[],away=[];
  inC.forEach(function(s){const pl=par.find(o=>(o.students||[]).indexOf(s.id)>-1);if(pl)away.push({s:s,l:pl});else list.push(s);});
  return {list:list,away:away};

function gapSkips(){return S.config.attSkip=S.config.attSkip||{};}
function gapSkipOf(d,lid){const x=gapSkips()[d];if(!x)return null;if(x.all)return {r:x.all,day:1};return x.L&&x.L[lid]?{r:x.L[lid]}:null;}
function gapDefFrom(){
  if(S.config.gapFrom)return S.config.gapFrom;
  const ds=Object.keys(S.latt).filter(d=>Object.keys(S.latt[d]||{}).length).sort(),m=daysAgo(30);
  return ds.length&&ds[0]>m?ds[0]:m;
}
function gapData(){
  const today=iso(new Date()),hm=nowHM(),from=S.gapFrom||(S.gapFrom=gapDefFrom()),to=S.gapTo&&S.gapTo<today?S.gapTo:today,cls=S.markCls;
  const days=[];if(!from||from>to)return days;
  const d0=new Date(from+'T12:00:00'),d1=new Date(to+'T12:00:00');
  for(let t=d0;t<=d1;t.setDate(t.getDate()+1)){
    const d=iso(t);if(dow(d)>5)continue;
    let ls=lessonsOn(d);if(cls)ls=ls.filter(l=>(l.classes||[]).indexOf(cls)>-1);
    const rows=[];
    ls.forEach(function(l){
      const p=periods().find(x=>x.n===l.period)||{};
      if(d===today&&!(p.end&&p.end<=hm))return;          // שיעור שעוד לא הסתיים היום
      const mk=lessonMarked(d,l);if(!mk.n)return;           // שיעור בלי תלמידים
      const sk=gapSkipOf(d,l.id);
      rows.push({l:l,mk:mk,sk:sk,st:sk?'skip':mk.m?'done':'none'});
    });
    if(!rows.length)continue;
    rows.sort((a,b)=>a.l.period-b.l.period||String(a.l.subject).localeCompare(String(b.l.subject),'he'));
    const miss=rows.filter(r=>r.st==='none').length,skip=rows.filter(r=>r.st==='skip').length;
    days.push({d:d,rows:rows,tot:rows.length,done:rows.filter(r=>r.st==='done').length,miss:miss,skip:skip,dayOff:!!(gapSkips()[d]||{}).all});
  }
  return days;
}

              (r.st!=='done'?'<button class="btn sm" data-act="gap-off" data-r="השיעור לא התקיים" data-d="'+x.d+'" data-id="'+l.id+'">לא התקיים</button><button class="btn sm" data-v="ghost" data-act="gap-off" data-r="" data-d="'+x.d+'" data-id="'+l.id+'">אחר…</button>':'')+'</div>';

            '<td>'+(r.st==='skip'?'<span class="tag" data-s="excused">לא בחישוב</span> <span class="note">'+esc(r.sk.r)+'</span>':stTag[r.st]+(r.st==='done'&&!r.mk.done?' <span class="note">'+r.mk.m+'/'+r.mk.n+'</span>':''))+'</td><td>'+act+'</td></tr>';

  return head+'<div class="card"><h3>לפי יום</h3><p class="note" style="margin-bottom:8px">לחיצה על יום פותחת את השיעורים שלו: אפשר למלא נוכחות, או לסמן שהשיעור לא התקיים ואז הוא לא נספר.</p>'+

/* ---- ייבוא מתיק-תק ---- */
function parseTimetable(m){
  let mode=null,dayCols=null,cur='';
  const lessons=[],seen={},per={},teachers={},classes={};let privNoStu=0;
  for(let r=0;r<m.length;r++){
    const row=m[r]||[],a=String(row[0]==null?'':row[0]).trim();
    let mm=a.match(/^כי?תה\s*:\s*(.+)$/);if(mm){mode='class';cur=mm[1].trim();dayCols=null;continue;}
    mm=a.match(/^מורה\s*:\s*(.+)$/);if(mm){mode='teacher';teachers[mm[1].trim()]=1;dayCols=null;continue;}
    const dc={};row.forEach((c,i)=>{const d=DAYS.indexOf(String(c==null?'':c).trim());if(d>-1)dc[i]=d;});
    if(Object.keys(dc).length>=3){dayCols=dc;continue;}
    if(mode!=='class'||!dayCols)continue;
    const pm=a.match(/^(\d+)\s*(?:(\d{1,2}:\d{2})\s*<?\s*(\d{1,2}:\d{2}))?/);if(!pm)continue;
    const pn=+pm[1];if(pm[2]&&!per[pn])per[pn]={n:pn,start:pm[2].padStart(5,'0'),end:pm[3].padStart(5,'0')};else if(!per[pn])per[pn]={n:pn,start:'',end:''};
    Object.keys(dayCols).forEach(function(ci){
      const txt=String(row[ci]==null?'':row[ci]);if(!txt.trim())return;
      const parts=txt.split(/(הוראה\s+\S+)/);
      for(let k=1;k<parts.length;k+=2){
        const lines=parts[k-1].split('\n').map(x=>x.trim()).filter(Boolean);if(lines.length<2)continue;
        const clsLine=lines[lines.length-1],teacher=lines[lines.length-2],subject=lines.slice(0,-2).join(' ');
        const cl=clsLine.split(/[\s,]+/).map(x=>x.trim()).filter(Boolean).map(clsFromBare);
        const type=/פרטנית/.test(parts[k])?'private':'class';
        const key=[dayCols[ci],pn,subject,teacher,cl.slice().sort().join('+'),type].join('|');
        if(seen[key])continue;seen[key]=1;
        teachers[teacher]=1;cl.forEach(c=>classes[c]=1);if(type==='private')privNoStu++;
        lessons.push({id:uid(),day:dayCols[ci],period:pn,subject:subject,teacher:teacher,classes:cl,type:type,students:[]});
      }
    });
  }
  return {lessons:lessons,periods:Object.keys(per).map(k=>per[k]).sort((a,b)=>a.n-b.n),teachers:Object.keys(teachers),classes:Object.keys(classes),privNoStu:privNoStu};
}
/* התאמת שיעורים מיובאים לשיעורים הקיימים, כדי לשמור את המזהה (והנוכחות שנרשמה לפיו) */
function ttMatch(lessons){
  const k=(l,sub)=>[l.day,l.period,sub?l.subject:'',l.teacher,(l.classes||[]).slice().sort().join('+'),l.type||'class'].join('|');
  const used={},out={};
  [true,false].forEach(function(sub){
    const pool={};S.timetable.forEach(o=>{if(!used[o.id])(pool[k(o,sub)]=pool[k(o,sub)]||[]).push(o);});
    lessons.forEach(function(l,i){if(out[i])return;const c=pool[k(l,sub)];if(!c)return;const o=c.find(x=>!used[x.id]);if(o){used[o.id]=1;out[i]=o;}});
  });
  return out;
}
async function handleTtFile(file){
  try{
    const X=await loadSheetJS();
    const wb=X.read(await file.arrayBuffer(),{type:'array'});
    let all=[];wb.SheetNames.forEach(n=>{all=all.concat(X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}));});
    const r=parseTimetable(all);
    S.ttImport=r.lessons.length?r:{error:'לא מצאתי שיעורים בקובץ. הייבוא תומך בקובץ "שיבוץ" שמיוצא מתיק-תק (דפי "כיתה:").'};
  }catch(e){S.ttImport={error:'לא הצלחתי לקרוא את הקובץ'+(e&&e.message==='cdn'?' (צריך חיבור לאינטרנט)':': '+(e&&e.message||''))};}
  render();
}

function anSlots(){
  const P=periods().filter(p=>p.start&&p.end).sort((a,b)=>a.start.localeCompare(b.start)),out=[];
  P.forEach(function(p,i){out.push({k:'p'+p.n,l:'שיעור '+p.n,s:p.start,e:p.end});const nx=P[i+1];if(nx&&nx.start>p.end)out.push({k:'b'+p.n,l:'הפסקה',s:p.end,e:nx.start,br:1});});

  const pct=a=>a.length?Math.round(a.filter(r=>r.v==='present'||r.v==='late').length/a.length*100):null;
  const cnt=(a,v)=>a.filter(r=>r.v===v).length,out=[];
  const arrow=(x,y,good)=>{if(x===null||y===null)return '';const d=x-y;if(!d)return ' (ללא שינוי)';return ' ('+(d>0?'▲':'▼')+Math.abs(d)+(good?'':'')+')';};

      const t=l.teacher||'ללא מורה',o=tm[t]=tm[t]||{n:0,m:0};o.n++;if(done[l.id])o.m++;});});

async function loadGrades(){

    if(isAdmin()){
      (await fsList('gr')).forEach(x=>{const m=nn(x.data.x);LD['gr/'+x.id]=clone(m);out=out.concat(Object.values(m));});
    }else{
      const mc=myClasses(),tc=teachClasses().filter(c=>mc.indexOf(c)<0),me=evTk(),ids={};
      grYears().forEach(function(y){
        mc.forEach(c=>{const tks={'':1};tks[me]=1;S.timetable.forEach(l=>{if((l.classes||[]).indexOf(c)>-1&&l.teacher)tks[tkOf(l.teacher)]=1;});
          Object.keys(tks).forEach(t=>ids[y+'_'+ckOf(c)+'_'+t]=1);});
        tc.forEach(c=>ids[y+'_'+ckOf(c)+'_'+me]=1);
      });

/* פירוט לפי שבועות: כל מבחן בשורה, ממוצע שבועי, נוכחות השבוע, וסיכום לכל חודש עברי */
function rcWeeks(s,ex,from,to){
  const today=iso(new Date()),end=to<today?to:today,W={},wk=[];
  const wsOf=d=>{const o=new Date(d+'T12:00:00');o.setDate(o.getDate()-o.getDay());return iso(o);};
  const addW=ws=>{if(!W[ws]){W[ws]={ws:ws,ex:[]};wk.push(ws);}return W[ws];};
  ex.forEach(x=>addW(wsOf(x.date)).ex.push(x));
  // שבועות שנרשמה בהם נוכחות
  const ids={};Object.keys(S.latt).concat(Object.keys(S.att)).forEach(d=>{if(d<from||d>end)return;const L=S.latt[d]||{},D=S.att[d]||{};
    if(D[s.id]||Object.keys(L).some(k=>k.slice(k.indexOf(':')+1)===s.id))ids[wsOf(d)]=1;});
  Object.keys(ids).forEach(addW);
  wk.sort();if(!wk.length)return '<div class="empty">אין רישומים בתקופה הזו.</div>';
  const mOf=ws=>{const p=hebParts(ws);return p?p.m+' '+gem(p.y%1000):ws.slice(0,7);};
  const M={},mo=[];wk.forEach(ws=>{const m=mOf(ws);if(!M[m]){M[m]=[];mo.push(m);}M[m].push(ws);});
  const pct=x=>grPct(x,x.g[s.id]);
  const sc=x=>{const v=x.g[s.id],p=pct(x);return p===null?'<span class="note">'+esc(v)+'</span>':'<b style="color:'+grColor(p)+'">'+esc(v)+'</b>'+((+x.max||100)!==100?' <span class="note">/'+x.max+'</span>':'');};
  const attTxt=a=>a.total?(a.pct+'% נוכחות'+(a.absent?' · '+a.absent+' חיסורים':'')+(a.late?' · '+a.late+' איחורים':'')):'לא נרשמה נוכחות';
  let rows='';
  mo.forEach(function(m){
    const mex=[];
    M[m].forEach(function(ws){
      const w=W[ws],we=(()=>{const o=new Date(ws+'T12:00:00');o.setDate(o.getDate()+5);return iso(o);})();
      const a=attStats(s.id,ws<from?from:ws,we>end?end:we),par=Array.from(new Set(w.ex.map(x=>x.parasha).filter(Boolean)));
      const xs=w.ex.slice().sort((p,q)=>String(p.date).localeCompare(String(q.date)));mex.push(...xs);
      rows+='<tr class="rcw"><td colspan="4"><b>שבוע '+esc(hebShort(ws))+' – '+esc(hebShort(we))+'</b> <span class="note">('+esc(ws.slice(8,10)+'.'+ws.slice(5,7))+'–'+esc(we.slice(8,10)+'.'+we.slice(5,7))+')</span>'+
        (par.length?' · פרשת '+esc(par.join(', ')):'')+'</td><td class="note">'+esc(attTxt(a))+'</td></tr>';
      rows+=xs.length?xs.map(x=>'<tr><td>'+esc(shortDate(x.date))+'</td><td><b>'+esc(x.subject)+'</b></td><td>'+esc(x.title||'')+(x.parasha&&par.length>1?' <span class="note">('+esc(x.parasha)+')</span>':'')+'</td><td>'+sc(x)+'</td><td></td></tr>').join('')+
          (xs.length>1?'<tr class="rcwa"><td colspan="3">ממוצע שבועי</td><td><b style="color:'+grColor(avg(xs.map(pct)))+'">'+(avg(xs.map(pct))===null?'—':avg(xs.map(pct)))+'</b></td><td></td></tr>':'')
        :'<tr><td colspan="5" class="note">לא היו מבחנים השבוע</td></tr>';
    });
    const mf=M[m][0]<from?from:M[m][0],ml=(()=>{const o=new Date(M[m][M[m].length-1]+'T12:00:00');o.setDate(o.getDate()+5);const x=iso(o);return x>end?end:x;})();
    const ma=attStats(s.id,mf,ml),mv=avg(mex.map(pct));
    rows+='<tr class="rcm"><td colspan="3">סיכום חודש '+esc(m)+' · '+mex.length+' מבחנים</td><td>'+(mv===null?'—':'<b>'+mv+'</b>')+'</td><td>'+esc(attTxt(ma))+'</td></tr>';
  });
  return '<div class="scroll"><table class="rct"><thead><tr><th>תאריך</th><th>מקצוע</th><th>נושא</th><th>ציון</th><th>נוכחות</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

    '<button class="btn sm" data-v="ghost" data-act="dm-del" data-id="'+m.id+'">מחיקה</button></div><div style="white-space:pre-wrap;margin-top:4px">'+esc(m.text)+'</div></div>').join('')+'</div>';
}

/* ================= עוזר אישי: שיחות וואטסאפ (אבן דרך B) =================
   ייבוא ידני של קובצי ייצוא (TXT / MD) בלבד. אין AI, אין מייל, אין חיבור לוואטסאפ.
   אחסון: insts/{מוסד}/assist/{uid}/... — לפי חוקי האבטחה רק המשתמש עצמו (ורק אם הוא מנהל) קורא וכותב.
     convs/{convId}    שיחה: שם תצוגה, שמות מקור שנקלטו, מונים
     chunks/{chunkId}  מקטע הודעות של שיחה: מחרוזת JSON אחת (עד ~900KB), כדי לא לעבור את מגבלת 1MB
                       ואת מגבלת מספר השדות/האינדקסים של Firestore
     imports/{id}      דוח לכל ייבוא: נוספו, כפולות, כפולות אפשריות, שגיאות */
const AS_CHUNK_BYTES=900000;
const AS_BIDI=/[‎‏‪-‮⁦-⁩﻿]/g;
const AS_MONTHS={'בינואר':1,'בפברואר':2,'במרץ':3,'במרס':3,'באפריל':4,'במאי':5,'ביוני':6,'ביולי':7,'באוגוסט':8,'בספטמבר':9,'באוקטובר':10,'בנובמבר':11,'בדצמבר':12};
function asBase(){return IB()+'assist/'+S.me.id+'/';}
function asId(){const a=new Uint8Array(9);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,14);}
const asBytes=s=>new TextEncoder().encode(s).length;
async function asRetry(fn,tries){let e;for(let i=0;i<(tries||3);i++){try{return await fn();}catch(x){e=x;if(/permission|invalid/.test((x&&x.code)||''))break;await new Promise(r=>setTimeout(r,600*Math.pow(2,i)));}}throw e;}
async function asHash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b).slice(0,10),x=>x.toString(16).padStart(2,'0')).join('');}

/* ---------- ניתוח קבצים ---------- */
function asNormSender(s){return String(s||'').replace(AS_BIDI,'').replace(/\s+/g,' ').trim().normalize('NFC');}
function asNormBody(b){
  let t=String(b||'').replace(/\r/g,'').replace(AS_BIDI,'').normalize('NFC');
  t=t.replace(/\\([*_`~\[\]#>|-])/g,'$1');                          // סימני markdown מוברחים בייצוא MD
  t=t.replace(/\s*<(?:This message was edited|ההודעה נערכה|הודעה זו נערכה)>\s*$/i,'');
  t=t.split('\n').map(x=>x.trim()).join('\n').replace(/\n+$/,'').replace(/^\n+/,'');
  const one=t.replace(/\s+/g,' ').trim();
  if(one.length<60&&/^<?[^<>]*(omitted|הושמט|הושמטה|הושמטו)[^<>]*>?$/i.test(one))return '<מדיה>';
  return one;
}
function asTxtParse(text){
  const re=/^\[?(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp]\.?\s?[Mm]\.?|לפנה["״׳']?צ|אחה["״׳']?צ)?\]?\s*(?:[-–]\s*)?(.*)$/;
  const lines=text.replace(/\r/g,'').split('\n'),hits=[];let dmy=0,mdy=0;
  lines.forEach((ln,i)=>{const m=ln.replace(AS_BIDI,'').match(re);if(m){hits.push([i,m]);if(+m[1]>12)dmy++;if(+m[2]>12)mdy++;}});
  const order=mdy>dmy?'mdy':'dmy',out=[],bad=[];let cur=null,sys=0;
  const at={};hits.forEach(h=>at[h[0]]=h[1]);
  lines.forEach(function(ln,i){
    const m=at[i];
    if(!m){if(cur)cur.b+='\n'+ln;else if(ln.trim())bad.push(i+1);return;}
    if(cur){out.push(cur);cur=null;}
    let d=+m[1],mo=+m[2],y=+m[3],h=+m[4];if(order==='mdy'){const x=d;d=mo;mo=x;}if(y<100)y+=2000;
    const ap=(m[7]||'').toLowerCase();if(ap){const pm=/^p|אחה/.test(ap);h=h%12+(pm?12:0);}
    if(mo<1||mo>12||d<1||d>31||h>23){bad.push(i+1);return;}
    const p=m[8].match(/^(.{1,120}?):\s([\s\S]*)$/)||m[8].match(/^(.{1,120}?):()$/);
    if(!p){sys++;return;}                                                 // הודעות מערכת (הצטרפות, הצפנה וכו')
    cur={day:y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'),hm:String(h).padStart(2,'0')+':'+m[5],sec:m[6]||'',n:p[1],b:p[2]};
  });
  if(cur)out.push(cur);
  return {msgs:out,bad:bad,sys:sys,order:order,prec:hits.some(h=>h[1][6])?'sec':'min'};
}
function asMdParse(text){
  const out=[],bad=[];let day='',cur=null,sys=0,title='';
  text.replace(/\r/g,'').split('\n').forEach(function(raw,i){
    const ln=raw.replace(AS_BIDI,'');
    let m=ln.match(/^#\s+(.+)$/);if(m&&!/^##/.test(ln)){const t=m[1].match(/WhatsApp:?\s*(.+)$/);title=(t?t[1]:m[1]).trim();return;}
    m=ln.match(/^##\s+.*?(\d{1,2})\s+(ב\S+)\s+(\d{4})/);
    if(m){if(cur){out.push(cur);cur=null;}const mo=AS_MONTHS[m[2]];day=mo?m[3]+'-'+String(mo).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'):'';if(!mo)bad.push(i+1);return;}
    m=ln.match(/^\s*\[(\d{1,2}):(\d{2})(?::(\d{2}))?\]\s+\*\*(.+?):\*\*\s?(.*)$/);
    if(m&&day){if(cur)out.push(cur);cur={day:day,hm:String(+m[1]).padStart(2,'0')+':'+m[2],sec:m[3]||'',n:m[4],b:m[5]};return;}
    if(/^\s*\[(\d{1,2}):(\d{2})/.test(ln)&&day){if(cur){out.push(cur);cur=null;}sys++;return;}
    if(cur)cur.b+='\n'+raw;else if(ln.trim()&&!/^---+$/.test(ln.trim()))bad.push(i+1);
  });
  if(cur)out.push(cur);
  return {msgs:out,bad:bad,sys:sys,order:'',prec:out.some(x=>x.sec)?'sec':'min',title:title};
}
function asSourceName(fname,title){
  if(title)return title;
  return String(fname||'').replace(/\.(txt|md|zip)$/i,'').replace(/\s*\(\d+\)$/,'').replace(/^WhatsApp Chat (with|-)\s*/i,'').replace(/^צ['׳]אט (WhatsApp )?(עם|-)\s*/,'').replace(/_/g,' ').trim()||'שיחה ללא שם';
}
async function asParseFile(file){
  const raw=await file.text(),md=/\.md$/i.test(file.name)||/^\s*#\s/.test(raw);
  const r=md?asMdParse(raw):asTxtParse(raw);
  r.fmt=md?'md':'txt';r.file=file.name;r.source=asSourceName(file.name,r.title);
  r.msgs=r.msgs.map(x=>Object.assign(x,{n:asNormSender(x.n),b:String(x.b).replace(/\n+$/,'')})).filter(x=>x.n&&asNormBody(x.b));
  r.msgs.forEach(x=>x.t=x.day+'T'+x.hm);
  const ts=r.msgs.map(x=>x.t).sort();r.first=ts[0]||'';r.last=ts[ts.length-1]||'';
  return r;
}
/* מפתח יציב להודעה: שיחה + דקה מדויקת + דובר + תוכן מנורמל + מספר מופע.
   "מספר מופע" מבדיל בין הודעות זהות לגיטימיות באותה דקה, ונשמר זהה בייצוא חוזר של אותה שיחה (TXT או MD) */
async function asKeys(conv,msgs){
  const occ={};
  for(const x of msgs){const base=x.t+'|'+asNormSender(x.n)+'|'+asNormBody(x.b);x.o=occ[base]=(occ[base]===undefined?0:occ[base]+1);x.k=await asHash(conv+'|'+base+'|'+x.o);x.sb=asNormSender(x.n)+'|'+asNormBody(x.b);}
  return msgs;
}
const asMin=t=>Math.round(Date.parse(t+':00Z')/60000);

/* ---------- טעינה ושמירה ---------- */
async function asLoadMeta(){
  S.as=S.as||{};S.as.err='';
  try{
    const c=await FS.collection(asBase()+'convs').get(),im=await FS.collection(asBase()+'imports').get();
    S.as.convs=c.docs.map(d=>Object.assign({id:d.id},d.data()));
    S.as.imports=im.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.at||0)-(a.at||0));
    S.as.loaded=true;
  }catch(e){S.as.err=/permission/.test((e&&e.code)||'')?'אין הרשאה. צריך לעדכן את חוקי האבטחה ב-Firebase (החלק של assist).':fbErr(e);S.as.convs=S.as.convs||[];S.as.imports=S.as.imports||[];}
}
async function asLoadConv(cid){
  S.as.msgs=S.as.msgs||{};S.as.chunks=S.as.chunks||{};
  const q=await asRetry(()=>FS.collection(asBase()+'chunks').where('c','==',cid).get());
  const ch=[],all=[];
  q.docs.forEach(function(d){const v=d.data()||{};let arr=[];try{arr=JSON.parse(v.d||'[]');}catch(e){}ch.push({id:d.id,seq:v.q||0,arr:arr});arr.forEach(m=>all.push(m));});
  ch.sort((a,b)=>a.seq-b.seq);
  S.as.chunks[cid]=ch;S.as.msgs[cid]=all.sort((a,b)=>(a.t+(a.s||'')).localeCompare(b.t+(b.s||''))||a.o-b.o);
  return all;
}
/* כתיבת מקטעים: ממלאים את המקטע האחרון עד הגבול ופותחים חדשים לפי הצורך. נכתב ב-batch (אטומי) כשאפשר */
async function asWriteConv(cid,convPatch,newMsgs,extraWrites){
  const ch=S.as.chunks[cid]||[],dirty={};
  let last=ch[ch.length-1];
  if(last&&last.bytes===undefined)last.bytes=asBytes(JSON.stringify(last.arr));
  for(const m of newMsgs){
    const mb=asBytes(JSON.stringify(m))+1;
    if(!last||last.bytes+mb>AS_CHUNK_BYTES){last={id:cid+'_'+asId(),seq:ch.length?ch[ch.length-1].seq+1:0,arr:[],bytes:2};ch.push(last);}
    last.arr.push(m);last.bytes+=mb;dirty[last.id]=last;
  }
  S.as.chunks[cid]=ch;
  const ops=Object.values(dirty).map(c=>({p:asBase()+'chunks/'+c.id,v:{c:cid,q:c.seq,n:c.arr.length,d:JSON.stringify(c.arr),u:Date.now()}}));
  ops.push({p:asBase()+'convs/'+cid,v:convPatch,merge:true});
  (extraWrites||[]).forEach(w=>ops.push(w));
  // batch עד ~8MB לבקשה
  let batch=FS.batch(),bytes=0,n=0;const commits=[];
  for(const o of ops){const b=asBytes(JSON.stringify(o.v));if(n&&(bytes+b>8e6||n>=450)){commits.push(batch);batch=FS.batch();bytes=0;n=0;}
    if(o.del)batch.delete(FS.doc(o.p));else batch.set(FS.doc(o.p),o.v,o.merge?{merge:true}:undefined);bytes+=b;n++;}
  commits.push(batch);
  for(const b of commits)await asRetry(()=>b.commit());
}
function asConvStats(cid){const a=S.as.msgs[cid]||[];return {count:a.length,first:a.length?a[0].t:'',last:a.length?a[a.length-1].t:''};}

/* ---------- ייבוא ---------- */
async function asImport(p,cid,newName){
  const now=Date.now(),isNew=!cid;
  if(isNew)cid=asId();
  const existing=isNew?[]:await asLoadConv(cid);
  S.as.msgs=S.as.msgs||{};S.as.chunks=S.as.chunks||{};S.as.convs=S.as.convs||[];S.as.imports=S.as.imports||[];
  if(isNew){S.as.msgs[cid]=[];S.as.chunks[cid]=[];}
  await asKeys(cid,p.msgs);
  const have={},bySB={};existing.forEach(m=>{have[m.k]=1;(bySB[m.n+'|'+m.nb]=bySB[m.n+'|'+m.nb]||[]).push(asMin(m.t));});
  const iid=asId(),add=[],dup=[],maybe=[],seen={},shifts={};let longN=0;
  const exact={};existing.forEach(m=>exact[m.n+'|'+m.nb+'|'+asMin(m.t)]=1);
  p.msgs.forEach(function(x){
    if(have[x.k]||seen[x.k]){dup.push(x);return;}seen[x.k]=1;
    const nb=asNormBody(x.b),mx=asMin(x.t);let hit=0;
    (bySB[x.n+'|'+nb]||[]).forEach(t=>{const d=mx-t,ad=Math.abs(d);if(ad>0&&ad<=180&&[0,1,59].indexOf(ad%60)>-1){hit=d;}});
    if(nb.length>=6&&nb!=='<מדיה>'){longN++;if(hit){shifts[Math.round(hit/60)*60]=(shifts[Math.round(hit/60)*60]||0)+1;maybe.push(x);return;}}   // כנראה אותה הודעה עם הפרש שעון/אזור זמן
    add.push(x);
  });
  // אם רוב ההודעות בקובץ מוזזות באותו הפרש (למשל שעה), גם הודעות קצרות שתואמות להפרש הזה מסומנות כאפשריות
  const dom=Object.keys(shifts).sort((a,b)=>shifts[b]-shifts[a])[0];
  if(dom&&shifts[dom]>=3&&shifts[dom]>=longN*0.5){
    for(let i=add.length-1;i>=0;i--){const x=add[i],key=x.n+'|'+asNormBody(x.b)+'|';
      if([0,1,-1].some(e=>exact[key+(asMin(x.t)-(+dom)+e)])){maybe.push(x);add.splice(i,1);}}
  }
  const rec=x=>({k:x.k,t:x.t,s:x.sec||'',n:x.n,b:x.b,nb:asNormBody(x.b),o:x.o,i:iid,f:p.fmt});
  const addRecs=add.map(rec),all=existing.concat(addRecs).sort((a,b)=>(a.t+(a.s||'')).localeCompare(b.t+(b.s||'')));
  const conv=isNew?{name:(newName||p.source).trim(),aliases:[p.source],created:now}:{aliases:Array.from(new Set(((S.as.convs.find(c=>c.id===cid)||{}).aliases||[]).concat([p.source])))};
  Object.assign(conv,{updated:now,count:all.length,analyzed:all.filter(m=>m.a).length,first:all.length?all[0].t:'',last:all.length?all[all.length-1].t:'',lastImport:now});
  const imp={conv:cid,file:p.file,fmt:p.fmt,source:p.source,at:now,total:p.msgs.length,added:add.length,dup:dup.length,maybe:maybe.length,sys:p.sys,bad:p.bad.length,badLines:p.bad.slice(0,30),first:p.first,last:p.last,prec:p.prec,order:p.order||'',
    maybeList:maybe.slice(0,200).map(x=>({t:x.t,s:x.sec||'',n:x.n,b:x.b.slice(0,2000),o:x.o,k:x.k}))};
  await asWriteConv(cid,conv,addRecs,[{p:asBase()+'imports/'+iid,v:imp}]);
  S.as.msgs[cid]=all;
  await asLoadMeta();
  return Object.assign({id:iid},imp);
}
/* הוספה ידנית של "כפולות אפשריות" שאושרו */
async function asAcceptMaybe(iid){
  const im=S.as.imports.find(x=>x.id===iid);if(!im||!im.maybeList||!im.maybeList.length)return;
  const cid=im.conv,ex=await asLoadConv(cid),have={};ex.forEach(m=>have[m.k]=1);
  const add=im.maybeList.filter(x=>!have[x.k]).map(x=>({k:x.k,t:x.t,s:x.s||'',n:x.n,b:x.b,nb:asNormBody(x.b),o:x.o,i:iid,f:im.fmt}));
  const all=ex.concat(add).sort((a,b)=>(a.t+(a.s||'')).localeCompare(b.t+(b.s||'')));
  await asWriteConv(cid,{updated:Date.now(),count:all.length,first:all[0]?all[0].t:'',last:all.length?all[all.length-1].t:''},add,
    [{p:asBase()+'imports/'+iid,v:{added:(im.added||0)+add.length,maybe:0,maybeList:[],accepted:add.length},merge:true}]);
  S.as.msgs[cid]=all;await asLoadMeta();return add.length;
}
/* כתיבה מחדש של כל המקטעים של שיחה (אחרי הסרה/העברה של הודעות) */
async function asRewriteConv(cid,msgs,convPatch,extra){
  const old=(S.as.chunks[cid]||[]).map(c=>c.id);S.as.chunks[cid]=[];
  const dels=old.map(id=>({p:asBase()+'chunks/'+id,v:{},del:true}));
  msgs.sort((a,b)=>(a.t+(a.s||'')).localeCompare(b.t+(b.s||'')));
  await asWriteConv(cid,Object.assign({updated:Date.now(),count:msgs.length,analyzed:msgs.filter(m=>m.a).length,first:msgs[0]?msgs[0].t:'',last:msgs.length?msgs[msgs.length-1].t:''},convPatch||{}),msgs,dels.concat(extra||[]));
  S.as.msgs[cid]=msgs;
}
/* תיקון שיוך שגוי: העברת כל ההודעות של ייבוא לשיחה אחרת (או חדשה) */
async function asMoveImport(iid,target,newName){
  const im=S.as.imports.find(x=>x.id===iid);if(!im)return;
  const from=im.conv,src=await asLoadConv(from),moving=src.filter(m=>m.i===iid),stay=src.filter(m=>m.i!==iid);
  let to=target,isNew=!to;if(isNew)to=asId();
  const dest=isNew?[]:await asLoadConv(to);if(isNew){S.as.chunks[to]=[];S.as.msgs[to]=[];}
  const raw=moving.map(m=>({t:m.t,day:m.t.slice(0,10),hm:m.t.slice(11),sec:m.s,n:m.n,b:m.b}));
  await asKeys(to,raw);
  const have={};dest.forEach(m=>have[m.k]=1);let moved=0,dupN=0;const addRecs=[];
  raw.forEach((x,i)=>{if(have[x.k]){dupN++;return;}have[x.k]=1;moved++;addRecs.push({k:x.k,t:x.t,s:x.sec||'',n:x.n,b:x.b,nb:asNormBody(x.b),o:x.o,i:iid,f:moving[i].f});});
  const all=dest.concat(addRecs);all.sort((a,b)=>(a.t+(a.s||'')).localeCompare(b.t+(b.s||'')));
  const fromConv=S.as.convs.find(c=>c.id===from)||{},toConv=S.as.convs.find(c=>c.id===to)||{};
  const patchTo={updated:Date.now(),count:all.length,first:all[0]?all[0].t:'',last:all.length?all[all.length-1].t:'',aliases:Array.from(new Set((toConv.aliases||[]).concat([im.source||''].filter(Boolean))))};
  if(isNew)Object.assign(patchTo,{name:(newName||im.source||'שיחה').trim(),created:Date.now()});
  await asWriteConv(to,patchTo,addRecs,[{p:asBase()+'imports/'+iid,v:{conv:to,movedFrom:from,movedAt:Date.now()},merge:true}]);
  S.as.msgs[to]=all;
  const srcAliases=Array.from(new Set(S.as.imports.filter(x=>x.conv===from&&x.id!==iid).map(x=>x.source).filter(Boolean)));
  await asRewriteConv(from,stay,{aliases:srcAliases.length?srcAliases:(fromConv.aliases||[])});
  await asLoadMeta();
  return {moved:moved,dup:dupN,to:to};
}
async function asDeleteImport(iid){
  const im=S.as.imports.find(x=>x.id===iid);if(!im)return;
  const src=await asLoadConv(im.conv),stay=src.filter(m=>m.i!==iid);
  await asRewriteConv(im.conv,stay,null,[{p:asBase()+'imports/'+iid,v:{},del:true}]);
  await asLoadMeta();return src.length-stay.length;
}
async function asDeleteMsg(cid,k){
  const src=S.as.msgs[cid]||await asLoadConv(cid),stay=src.filter(m=>m.k!==k);
  await asRewriteConv(cid,stay);await asLoadMeta();
}
async function asDeleteConv(cid){
  await asLoadConv(cid);
  const ops=(S.as.chunks[cid]||[]).map(c=>({p:asBase()+'chunks/'+c.id,del:true,v:{}})).concat(S.as.imports.filter(x=>x.conv===cid).map(x=>({p:asBase()+'imports/'+x.id,del:true,v:{}})));
  ops.push({p:asBase()+'convs/'+cid,del:true,v:{}});
  for(let i=0;i<ops.length;i+=400){const b=FS.batch();ops.slice(i,i+400).forEach(o=>b.delete(FS.doc(o.p)));await asRetry(()=>b.commit());}
  delete S.as.msgs[cid];delete S.as.chunks[cid];if(S.as.cur===cid)S.as.cur='';await asLoadMeta();
}

function asDT(t,s){return t?esc(shortDate(t.slice(0,10)))+' '+esc(t.slice(11,16))+(s?':'+esc(s):''):'';}
function asConvName(id){const c=(S.as.convs||[]).find(x=>x.id===id);return c?c.name:'(שיחה שנמחקה)';}
function asSuggest(source){const s=String(source||'').trim();const c=(S.as.convs||[]).find(x=>(x.aliases||[]).indexOf(s)>-1||x.name===s);return c?c.id:'';}

  return h;

async function asAction(a,el,id){
  const A=S.as=S.as||{};
  const busy=async(msg,fn)=>{A.busy=msg;render();try{return await fn();}catch(e){toast(fbErr(e));}finally{A.busy='';render();}};
  if(a==='as-pick'){const f=document.getElementById('asFiles');if(f)f.click();return;}
  if(a==='as-cancel'){A.pending=null;return render();}
  if(a==='as-close-report'){A.report=null;return render();}
  if(a==='as-run'){
    const P=A.pending||[];document.querySelectorAll('#main [data-asn]').forEach(i=>P[+i.dataset.asn].newName=i.value);
    document.querySelectorAll('#main [data-asf]').forEach(s=>P[+s.dataset.asf].target=s.value);
    for(const p of P)if(!p.target&&!String(p.newName===undefined?p.source:p.newName).trim())return toast('כתבו שם לשיחה החדשה');
    A.pending=null;const rep=[];
    await busy('מייבא…',async function(){
      for(const p of P){
        try{A.busy='מייבא את '+p.file+' ('+p.msgs.length+' הודעות)…';render();
          // שני קבצים חדשים באותו ייבוא עם אותו שם שיחה חדש → אותה שיחה
          let t=p.target;if(!t){const same=rep.find(r=>r._new&&r._name===String(p.newName===undefined?p.source:p.newName).trim());if(same)t=same.conv;}
          const r=await asImport(p,t,p.newName===undefined?p.source:p.newName);r._new=!p.target;r._name=String(p.newName===undefined?p.source:p.newName).trim();rep.push(r);}
        catch(e){rep.push({file:p.file,error:fbErr(e)});}
      }
    });
    A.report=rep;logAct('ייבוא שיחות וואטסאפ',rep.length+' קבצים');return render();
  }
  if(a==='as-open'){A.cur=id;A.q='';A.day='';A.page=0;render();if(!(A.msgs&&A.msgs[id]))await busy('טוען הודעות…',()=>asLoadConv(id));return render();}
  if(a==='as-close'){A.cur='';return render();}
  if(a==='as-day'){const all=A.msgs[A.cur]||[],days=Array.from(new Set(all.map(m=>m.t.slice(0,10)))).sort(),i=days.indexOf(A.day)+(+el.dataset.n);if(days[i]){A.day=days[i];A.page=0;}return render();}
  if(a==='as-page'){A.page=Math.max(0,(A.page||0)+(+el.dataset.n));return render();}
  if(a==='as-ren'){A.ren=id;return render();}
  if(a==='as-ren-save'){const v=(document.getElementById('asRen')||{}).value||'';if(!v.trim())return toast('כתבו שם');
    await busy('שומר…',()=>asRetry(()=>FS.doc(asBase()+'convs/'+id).set({name:v.trim(),updated:Date.now()},{merge:true})));A.ren='';await asLoadMeta();toast('השם עודכן (השיחה נשארה אותה שיחה)');return render();}
  if(a==='as-del-conv'){const c=(A.convs||[]).find(x=>x.id===id);if(!c||!confirm('למחוק לצמיתות את השיחה "'+c.name+'" עם כל '+(c.count||0)+' ההודעות שלה?'))return;
    await busy('מוחק…',()=>asDeleteConv(id));logAct('מחיקת שיחה מהעוזר',c.name);toast('השיחה נמחקה');return render();}
  if(a==='as-del-msg'){if(!confirm('למחוק את ההודעה הזו מהמאגר?'))return;await busy('מוחק…',()=>asDeleteMsg(A.cur,id));toast('ההודעה נמחקה');return render();}
  if(a==='as-move'){A.move=id;return render();}
  if(a==='as-move-run'){const to=(document.getElementById('asMoveTo')||{}).value||'';const im=(A.imports||[]).find(x=>x.id===id);let nm='';
    if(!to){nm=prompt('שם לשיחה החדשה:',(im&&im.source)||'');if(nm===null)return;if(!nm.trim())return toast('כתבו שם');}
    if(!confirm('להעביר את כל ההודעות מהייבוא "'+(im&&im.file)+'" לשיחה '+(to?'"'+asConvName(to)+'"':'חדשה')+'?'))return;
    A.move='';const r=await busy('מעביר…',()=>asMoveImport(id,to,nm));
    if(r){logAct('תיקון שיוך שיחה',(im&&im.file)||'');toast('הועברו '+r.moved+' הודעות'+(r.dup?' ('+r.dup+' כבר היו שם)':''));A.cur=r.to;A.day='';}return render();}
  if(a==='as-del-imp'){const im=(A.imports||[]).find(x=>x.id===id);if(!im||!confirm('לבטל את הייבוא "'+im.file+'"? ההודעות שנוספו בו יימחקו מהשיחה.'))return;
    const n=await busy('מבטל…',()=>asDeleteImport(id));toast('נמחקו '+(n||0)+' הודעות');return render();}
  if(a==='as-maybe'){A.maybeOpen=id;return render();}
  if(a==='as-maybe-close'){A.maybeOpen='';return render();}
  if(a==='as-maybe-add'){if(!confirm('להוסיף את ההודעות האלה לשיחה?'))return;const n=await busy('מוסיף…',()=>asAcceptMaybe(id));A.maybeOpen='';toast('נוספו '+(n||0)+' הודעות');return render();}
}
function loadJSZip(){
  return new Promise(function(res,rej){
    if(window.JSZip)return res(window.JSZip);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    sc.onload=()=>res(window.JSZip);sc.onerror=()=>rej(new Error('cdn'));
    document.head.appendChild(sc);
  });
}
/* קובץ ZIP של ייצוא וואטסאפ: מחלצים רק את קובץ השיחה (TXT), בלי המדיה.
   באייפון הקובץ בפנים נקרא _chat.txt, ולכן שם השיחה נלקח משם קובץ ה-ZIP. */
async function asUnzip(f){
  const Z=await loadJSZip(),zip=await Z.loadAsync(f),out=[];
  const txts=Object.values(zip.files).filter(e=>!e.dir&&/\.txt$/i.test(e.name)&&!/(^|\/)__MACOSX\//.test(e.name));
  for(const e of txts){
    const base=e.name.split('/').pop(),generic=/^_?chat\.txt$/i.test(base)||txts.length===1;
    const name=generic?f.name.replace(/\.zip$/i,'.txt'):base;
    out.push(new File([await e.async('string')],name,{type:'text/plain'}));
  }
  return out;
}
async function asFilesChosen(files){
  const A=S.as=S.as||{},P=[],errs=[];let nz=0;
  A.busy='קורא '+files.length+' קבצים…';render();
  const flat=[];
  for(const f of files){
    if(/\.zip$/i.test(f.name)||f.type==='application/zip'||f.type==='application/x-zip-compressed'){
      if(f.size>400e6){errs.push(f.name+' (גדול מדי — ייצאו "בלי מדיה")');continue;}
      try{const inner=await asUnzip(f);nz++;if(!inner.length)errs.push(f.name+' (אין בו קובץ שיחה)');inner.forEach(x=>{x._zip=f.name;flat.push(x);});}
      catch(e){errs.push(f.name+(e&&e.message==='cdn'?' (לא הצלחתי לטעון את רכיב הפתיחה של ZIP — בדקו חיבור)':' (קובץ ZIP פגום)'));}
      continue;
    }
    flat.push(f);
  }
  for(const f of flat){
    if(!/\.(txt|md)$/i.test(f.name)){errs.push(f.name+' (רק ZIP, TXT או MD)');continue;}
    if(f.size>60e6){errs.push(f.name+' (גדול מדי)');continue;}
    try{const p=await asParseFile(f);if(f._zip)p.file=f._zip;
      if(!p.msgs.length)errs.push(p.file+' (לא נמצאו הודעות בפורמט של וואטסאפ)');
      else{const same=P.find(q=>q.source===p.source&&q.fmt===p.fmt&&q.msgs.length===p.msgs.length&&q.last===p.last);if(!same)P.push(p);}}
    catch(e){errs.push(f.name);}
  }
  A.busy='';
  if(errs.length)toast('לא נקראו: '+errs.join(', '));
  A.pending=P.length?P:null;render();
}
