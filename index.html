@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700&family=Noto+Sans:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#E9EDF2;--surface:#FFFFFF;--surface2:#F4F6F9;--ink:#16243B;--muted:#5C6B80;--line:#D6DDE6;
--accent:#8A2E3F;--accent-soft:#F6EAEC;--present:#2F7A4F;--late:#B0801F;--absent:#AF3A2E;--excused:#5C6B80;
--green:#2F7A4F;--yellow:#C9911C;--red:#AF3A2E}
body{margin:0;font-family:'Assistant',system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-weight:700;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
a{color:var(--accent)}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
#login .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px;width:100%;max-width:360px}
#login h1{font-size:24px;margin-bottom:4px}
#login .logo{max-height:70px;max-width:200px;display:block;margin:0 auto 16px}
.shell{display:none;min-height:100vh}
.shell.on{display:flex}
.side{width:210px;flex:0 0 210px;background:var(--surface);border-left:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
.brand{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand img{max-height:52px;max-width:100%;display:block;margin-bottom:8px}
.brand h1{font-size:19px;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:right;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;transition:background .12s,color .12s}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[data-on="1"]{background:var(--accent-soft);color:var(--accent)}
.who{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.who b{display:block;color:var(--ink);font-size:14px}
main{flex:1;min-width:0;padding:24px 28px 80px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h2{font-size:26px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.hebdate{font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:17px;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:31px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600;transition:background .12s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--surface2)}
.btn[data-v="primary"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[data-v="primary"]:hover{background:#75252f}
.btn[data-v="ghost"]{border-color:transparent;background:transparent;color:var(--muted)}
.btn[data-v="ghost"]:hover{color:var(--accent);background:var(--accent-soft)}
.btn[data-v="danger"]{color:var(--absent);border-color:#E7C6C1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sm{padding:5px 10px;font-size:13px}
.big{padding:12px 22px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.full{width:100%;text-align:center}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface)}
.field textarea{min-height:90px;resize:vertical;line-height:1.6}
.inp{width:auto}
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:12.5px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--surface2)}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.ltr{direction:ltr;text-align:right;display:inline-block}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:right}
.link:hover{text-decoration:underline}
.mark{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--surface2)}
.mark-name{flex:1;min-width:0;font-weight:600}
.mark-name em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:var(--surface);padding:8px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-left:1px solid var(--line);min-width:52px}
.seg button:last-child{border-left:0}
.seg button:hover{background:var(--surface2)}
.seg button[data-on="1"]{color:#fff}
.seg button[data-on="1"][data-s="present"]{background:var(--present)}
.seg button[data-on="1"][data-s="late"]{background:var(--late)}
.seg button[data-on="1"][data-s="absent"]{background:var(--absent)}
.seg button[data-on="1"][data-s="excused"]{background:var(--excused)}
.savebar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 -2px 12px rgba(22,36,59,.06)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:700}
.tag[data-s="present"]{background:#E4F0E9;color:var(--present)}
.tag[data-s="late"]{background:#F7EFDC;color:var(--late)}
.tag[data-s="absent"]{background:#F7E4E1;color:var(--absent)}
.tag[data-s="excused"],.tag[data-s="teacher"]{background:var(--surface2);color:var(--muted)}
.tag[data-s="admin"]{background:var(--accent-soft);color:var(--accent)}
.tag[data-s="green"]{background:#E4F0E9;color:var(--green)}
.tag[data-s="yellow"]{background:#F9F0DA;color:var(--yellow)}
.tag[data-s="red"]{background:#F7E4E1;color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip b{width:7px;height:7px;border-radius:50%;background:var(--absent)}
.chip[data-done="1"] b{background:var(--present)}
.chip[data-done="1"]{color:var(--muted);font-weight:400}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.warn{background:#FBF3E3;border:1px solid #EBD9AE;color:#7A5B14;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--present)}
.bar i[data-low="1"]{background:var(--late)}
.bar i[data-low="2"]{background:var(--absent)}
#toast{position:fixed;bottom:18px;left:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:50;display:none}
.printhead{display:none}
/* תמונת מצב */
.rev-wrap{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.rev-name{font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:30px;font-weight:700;line-height:1.15}
.lights{display:flex;gap:10px;margin:14px 0 18px}
.lights button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 8px;cursor:pointer;font-weight:700;font-size:16px;color:var(--muted)}
.lights button:hover{background:var(--surface2)}
.lights button[data-on="1"]{color:#fff}
.lights button[data-on="1"][data-l="green"]{background:var(--green);border-color:var(--green)}
.lights button[data-on="1"][data-l="yellow"]{background:var(--yellow);border-color:var(--yellow)}
.lights button[data-on="1"][data-l="red"]{background:var(--red);border-color:var(--red)}
.dom{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--surface2)}
.dom-label{flex:1;font-weight:600}
.dom-label i{font-style:normal;color:var(--muted);font-weight:400;font-size:12.5px;margin-right:6px}
.scale{display:flex;gap:5px}
.scale button{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:700;color:var(--muted)}
.scale button:hover{background:var(--surface2)}
.scale button[data-on="1"]{background:var(--ink);border-color:var(--ink);color:#fff}
.prev{background:var(--surface2);border-radius:8px;padding:12px 14px;font-size:13.5px}
.prev h4{margin:0 0 8px;font-size:14px;font-family:'Noto Sans Hebrew';font-weight:700}
.dots{display:flex;gap:4px}
.dots i{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--line)}
.dots i[data-l="green"]{background:var(--green)}
.dots i[data-l="yellow"]{background:var(--yellow)}
.dots i[data-l="red"]{background:var(--red)}
.prog{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--accent)}
.tl{border-right:2px solid var(--line);padding:0 0 4px 0;margin-right:6px}
.tl-item{position:relative;padding:0 18px 16px 0}
.tl-item::before{content:'';position:absolute;right:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--surface)}
.tl-item[data-l="green"]::before{background:var(--green)}
.tl-item[data-l="yellow"]::before{background:var(--yellow)}
.tl-item[data-l="red"]::before{background:var(--red)}
.tl-date{font-size:12.5px;color:var(--muted);font-weight:700}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--surface2)}
.task-body{flex:1;min-width:0}
.task-body b{display:block;font-weight:600}
.task[data-done="1"] .task-body b{text-decoration:line-through;color:var(--muted)}
.tick{width:24px;height:24px;border:2px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;flex:0 0 auto;margin-top:2px;font-weight:700;color:transparent}
.task[data-done="1"] .tick{background:var(--present);border-color:var(--present);color:#fff}
.alert{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--surface2);font-size:14px}
.alert:last-child{border-bottom:0}
.alert b{flex:0 0 auto}
@media(max-width:900px){.rev-wrap{grid-template-columns:1fr}}
@media(max-width:820px){
.shell.on{flex-direction:column}
.side{width:auto;flex:none;border-left:0;border-bottom:1px solid var(--line);padding:14px}
.brand{border-bottom:0;margin-bottom:8px;padding-bottom:8px}
.nav{flex-direction:row;overflow-x:auto;gap:4px}
.nav button{white-space:nowrap;padding:7px 12px}
.who{margin-top:10px;padding-top:10px}
main{padding:18px 14px 70px}
.mark{flex-wrap:wrap}
.seg{width:100%}
.seg button{flex:1}
.rev-name{font-size:24px}
.scale button{width:34px;height:34px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.savebar,#toast,.btn{display:none}main{padding:0}.card{break-inside:avoid;border:0;padding:0}
.printhead{display:block;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}.printhead img{max-height:50px}}

/* ===== מובייל, מגע ואפליקציה ===== */
html{-webkit-text-size-adjust:100%;height:100%}
body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent;min-height:100%}
button,.btn,.chip,.link,a,label,[data-act],[data-tab]{touch-action:manipulation}
.btn:active,.chip:active,.seg button:active,.lights button:active,.scale button:active,.tick:active,.nav button:active,.bnav button:active{transform:scale(.96)}
.btn,.chip,.seg button,.lights button,.scale button,.tick,.bnav button{transition:background .12s,transform .08s}
.topbar,.bnav,.backdrop{display:none}
#login{padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(hover:none){
  .btn:hover{background:var(--surface)}
  .btn[data-v="primary"]:hover{background:var(--accent)}
  .btn[data-v="ghost"]:hover{background:transparent;color:var(--muted)}
  .nav button:hover,.seg button:hover,.lights button:hover,.scale button:hover{background:inherit}
}
@media(pointer:coarse){
  .btn{min-height:44px;padding:10px 16px}
  .btn.sm,.sm{min-height:38px;padding:8px 12px}
  .field input,.field select,.field textarea,.inp,input,select,textarea{font-size:16px;min-height:44px}
  .field textarea,textarea{min-height:100px}
  .seg button{min-height:46px;font-size:14px}
  .scale{gap:7px;flex-wrap:wrap}
  .scale button{width:44px;height:44px;font-size:16px}
  .lights button{padding:18px 8px;font-size:17px}
  .tick{width:32px;height:32px}
  .chip{padding:9px 15px;font-size:14.5px}
  .link{padding:6px 0;min-height:32px}
  .nav button{padding:12px 12px;font-size:16px}
  td{padding:12px 8px}
  input[type="checkbox"],input[type="radio"]{width:22px;height:22px;min-height:0}
}
@media(max-width:820px){
  .shell.on{flex-direction:column}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
    padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;min-height:56px}
  .topbar .menu{width:44px;height:44px;border:0;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .topbar .menu:active{background:var(--surface2)}
  .topbar .menu i,.topbar .menu i::before,.topbar .menu i::after{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px;position:relative}
  .topbar .menu i::before,.topbar .menu i::after{content:'';position:absolute;left:0}
  .topbar .menu i::before{top:-6px}.topbar .menu i::after{top:6px}
  .topbar .t{flex:1;min-width:0}
  .topbar .t b{display:block;font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar img{max-height:34px;max-width:70px;flex:0 0 auto}
  .side{position:fixed;top:0;bottom:0;right:0;width:min(290px,84vw);z-index:60;border-left:0;border-bottom:0;
    box-shadow:-8px 0 30px rgba(22,36,59,.18);transform:translateX(105%);transition:transform .22s ease;
    padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;will-change:transform}
  .side.open{transform:none}
  .side .nav{flex-direction:column;overflow:visible;gap:2px}
  .side .nav button{white-space:normal;text-align:right}
  .brand{border-bottom:1px solid var(--line);margin-bottom:10px;padding-bottom:12px}
  .who{margin-top:auto}
  .backdrop{display:block;position:fixed;inset:0;background:rgba(22,36,59,.35);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
  .backdrop.on{opacity:1;pointer-events:auto}
  main{padding:16px 14px calc(92px + env(safe-area-inset-bottom,0px))}
  .head h2{font-size:22px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 14px rgba(22,36,59,.06)}
  .bnav button{flex:1;min-width:0;border:0;background:none;padding:6px 2px 7px;border-radius:10px;cursor:pointer;color:var(--muted);
    font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center}
  .bnav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bnav button[data-on="1"]{color:var(--accent);background:var(--accent-soft)}
  .savebar{bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:20}
  #toast{left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));max-width:90vw;text-align:center}
  .scroll{-webkit-overflow-scrolling:touch}
  .rev-name{font-size:24px}
}
.swipe-hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px}
@media(min-width:821px){.swipe-hint{display:none}}
@media print{.topbar,.bnav,.backdrop{display:none!important}}
.ltr{white-space:nowrap}

/* ===== מערכת שעות ===== */
.lrow{display:flex;width:100%;align-items:center;gap:10px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;font:inherit;color:inherit}
.lrow:hover{background:var(--surface2)}
.lrow[data-now="1"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.lrow .lr-main{flex:1;min-width:0}
.lrow .lr-main b{display:block;font-size:15px}
.lrow .lr-main span{display:block;font-size:13px;color:var(--muted)}

.seg button[data-on="1"]:not([data-s]){background:var(--accent)}
.chip[data-on="1"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tt{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
table.tt th{font-size:13px;color:var(--muted);font-weight:700;padding:8px 4px;border-bottom:1px solid var(--line)}
table.tt th.pc{width:74px}
table.tt td{vertical-align:top;border:1px solid var(--line);padding:4px;height:58px;cursor:pointer;background:var(--surface)}
table.tt td.pc{cursor:default;text-align:center;font-size:12px;color:var(--muted);background:var(--surface2)}
table.tt td.pc b{display:block;font-size:16px;color:var(--ink)}
table.tt td.sel{outline:2px solid var(--accent);outline-offset:-2px}
table.tt td.add:hover{background:var(--surface2)}
.lsn{background:var(--surface2);border-radius:8px;padding:5px 7px;margin-bottom:4px;font-size:12.5px;line-height:1.35;border-right:3px solid var(--accent)}
.lsn b{display:block;font-size:13px}
.lsn span{display:block;color:var(--muted)}
.lsn.pr{border-right-color:var(--late)}
.lsn.cf{outline:2px solid var(--absent)}
.lsn .bd{display:inline-block;font-size:11px;font-weight:700;color:var(--late)}
.tt-plus{color:var(--muted);opacity:.35;font-size:18px;text-align:center;line-height:48px}
.tt-mob{display:none}
.chk{display:inline-flex;align-items:center;gap:6px;margin:0 0 6px 12px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;min-height:0}
@media(max-width:820px){.tt-desk{display:none}.tt-mob{display:block}
  .tt-mob .per{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .tt-mob .per .pc{width:54px;flex:0 0 54px;text-align:center;font-size:12px;color:var(--muted)}
  .tt-mob .per .pc b{display:block;font-size:17px;color:var(--ink)}
  .tt-mob .per .ls{flex:1}}
/* ================= עיצוב: אינדיגו וזהב ================= */
:root{--bg:#F2F4F9;--surface:#FFFFFF;--surface2:#F5F7FC;--ink:#141B34;--muted:#636C86;--line:#E1E5EF;
--accent:#2E3E9E;--accent-dark:#232F7E;--accent-soft:#E9ECFA;--gold:#F2B530;--side:#1A2357;--side2:#232D6A;
--present:#1E9E6A;--late:#D08A0B;--absent:#DB4537;--excused:#7A839C;--green:#1E9E6A;--yellow:#D9A10F;--red:#DB4537}
body{background:var(--bg);font-size:15px;font-family:'Noto Sans Hebrew','Noto Sans',system-ui,'Segoe UI',sans-serif}
h1,h2,h3,.stat b,.rev-name,.hebdate,.topbar .t b{font-family:'Noto Sans Hebrew','Noto Sans',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
.head h2{font-size:30px;line-height:1.15}
.card h3{font-size:18px}
.sub{font-size:13.5px}
.hebdate{color:var(--accent)}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* סרגל צד כהה */
.side{background:var(--side);border-left:0;color:#C3CAEC}
.brand{border-bottom:1px solid rgba(255,255,255,.1)}
.brand h1{color:#fff;font-size:21px}
.brand span{color:#97A1D2}
.nav button{color:#C3CAEC;border-radius:10px;padding:10px 12px;font-size:15px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[data-on="1"]{background:var(--side2);color:#fff;box-shadow:inset -3px 0 0 var(--gold)}
.who{border-top:1px solid rgba(255,255,255,.1);color:#97A1D2}
.who b{color:#fff}
.who .btn{background:transparent;border-color:rgba(255,255,255,.22);color:#E4E8FA}
.who .btn:hover{background:rgba(255,255,255,.08)}
#installBtn{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* כרטיסים */
.card,.stat{border-radius:16px;border-color:var(--line);box-shadow:0 1px 2px rgba(20,27,52,.04)}
.card{padding:20px}
.stat{padding:16px 18px}
.stat b{font-size:36px;line-height:1.05;margin-bottom:2px}

/* כפתורים */
.btn{border-radius:10px;padding:9px 16px;border-color:var(--line);transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--surface2);border-color:#CDD3E3}
.btn[data-v="primary"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[data-v="primary"]:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn[data-v="ghost"]:hover{color:var(--accent);background:var(--accent-soft)}
.btn[data-v="danger"]{color:var(--absent);border-color:#F2CFCB}
.btn[data-v="danger"]:hover{background:#FDF1EF}
.link{color:var(--accent)}
a{color:var(--accent)}

/* שדות */
.field span{color:var(--ink);font-size:13.5px}
.field input,.field select,.field textarea,.inp{border-radius:10px;border-color:#D5DAE7;padding:9px 12px;transition:border-color .12s,box-shadow .12s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* בורר מקטעים */
.seg{border:0;background:#EAEDF5;border-radius:12px;padding:3px;gap:3px}
.seg button{border:0!important;border-radius:9px;background:transparent;color:var(--muted)}
.seg button:hover{background:rgba(255,255,255,.7)}
.seg button[data-on="1"]{box-shadow:0 1px 2px rgba(20,27,52,.12)}
.seg button[data-on="1"]:not([data-s]){background:#fff;color:var(--accent)}

/* תגיות ושבבים */
.tag[data-s="present"],.tag[data-s="green"]{background:#E2F5EC;color:#14794F}
.tag[data-s="late"],.tag[data-s="yellow"]{background:#FCF1D9;color:#946208}
.tag[data-s="absent"],.tag[data-s="red"]{background:#FCE6E3;color:#B4362A}
.tag[data-s="admin"]{background:var(--accent-soft);color:var(--accent)}
.chip{border-radius:999px;border-color:#D5DAE7}
.chip:hover{border-color:var(--accent)}
.chip[data-on="1"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* טבלאות */
th{color:var(--muted);font-size:12.5px;padding:8px;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid #EEF1F7}
tbody tr:hover td{background:#FAFBFE}

/* שונות */
.savebar{border-radius:14px;box-shadow:0 6px 24px rgba(20,27,52,.10);border-color:var(--line)}
#toast{background:var(--side);border-radius:12px;box-shadow:0 8px 24px rgba(20,27,52,.25)}
.lights button{border-radius:14px}
.mark{padding:11px 4px}
.lrow{border-radius:14px;padding:12px 14px}
.lrow:hover{border-color:#CDD3E3}
.lsn{background:#EEF1FB;border-radius:9px}
table.tt td{border-color:#E6EAF3}
table.tt td.pc{background:#F7F8FC}
.warn{border-radius:12px}
.bar{height:7px;border-radius:99px}

/* משקלים לנוטו */
.nav button,.btn,.chip,.seg button,.field span,.mark-name,.link,.lights button{font-weight:500}
.btn[data-v="primary"]{font-weight:600}
.tag{font-weight:600}
th{font-weight:600}
.head h2{font-size:28px}
/* מסך כניסה */
#login{background:var(--side);background-image:radial-gradient(circle at 85% 10%,rgba(242,181,48,.16),transparent 40%),radial-gradient(circle at 10% 95%,rgba(255,255,255,.06),transparent 45%)}
#login .box{border:0;border-radius:22px;padding:34px 30px;box-shadow:0 24px 60px rgba(5,10,40,.35)}
#login h1{font-size:30px;color:var(--side)}
#login .box::before{content:'';display:block;width:44px;height:5px;border-radius:9px;background:var(--gold);margin-bottom:18px}
#boot{background:var(--bg)}

/* מובייל */
@media(max-width:820px){
  .topbar{background:var(--side);border-bottom:0;color:#fff}
  .topbar .t span{color:#A9B2DD}
  .topbar .menu:active{background:rgba(255,255,255,.1)}
  .topbar .menu i,.topbar .menu i::before,.topbar .menu i::after{background:#fff}
  .side{box-shadow:-10px 0 40px rgba(5,10,40,.35)}
  .bnav{border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(20,27,52,.06)}
  .bnav button[data-on="1"]{color:var(--accent);background:var(--accent-soft)}
  .head h2{font-size:25px}
  .card{padding:16px;border-radius:14px}
  .grid:has(> .stat){grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{padding:12px 14px}
  .stat b{font-size:30px}
}
@media(hover:none){.btn[data-v="primary"]:hover{background:var(--accent)}}
.hd{display:block;text-align:right;direction:rtl;font-size:12.5px;color:var(--accent);margin-top:4px;font-weight:500;min-height:1em}
</style>
</head>
<body>

<div id="boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600">טוען נתונים…</div>
<div id="login">
  <div class="box">
    <img id="loginLogo" class="logo" style="display:none" alt="">
    <h1 id="loginTitle">ניהול המוסד</h1>
    <p class="note" style="margin:0 0 18px">התחברות למערכת</p>
    <label class="field"><span>קוד מוסד</span><input id="li" autocomplete="organization" dir="ltr" autocapitalize="none" spellcheck="false"></label>
    <label class="field"><span>שם משתמש</span><input id="lu" autocomplete="username" autocapitalize="none"></label>
    <label class="field"><span>סיסמה</span><input id="lp" type="password" autocomplete="current-password"></label>
    <label class="row" style="margin:0 0 14px;font-size:14px;cursor:pointer"><input type="checkbox" id="lr" checked> להישאר מחובר במכשיר הזה</label>
    <button class="btn full" data-v="primary" id="loginBtn">כניסה</button>
    <p class="note" id="loginErr" style="color:var(--absent);min-height:20px;margin:10px 0 0"></p>
    <p class="note" id="loginHint" style="margin-top:6px"></p>
  </div>
</div>

<div class="shell" id="shell">
  <header class="topbar"><button class="menu" id="menuBtn" aria-label="תפריט"><i></i></button><div class="t"><b id="topTitle"></b><span id="topSub"></span></div><img id="topLogo" style="display:none" alt=""></header>
  <div class="backdrop" id="backdrop"></div>
  <aside class="side" id="side">
    <div class="brand"><img id="brandLogo" style="display:none" alt=""><h1 id="brandName">המוסד</h1><span id="brandSub"></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main id="main"><div class="empty">טוען…</div></main>
  <nav class="bnav" id="bnav"></nav>
</div>
<div id="toast"></div>

<script>
const K={config:'tt:config',students:'tt:students',staff:'tt:staff',att:'tt:attendance',reviews:'tt:reviews',tasks:'tt:tasks',timetable:'tt:timetable',latt:'tt:latt'};
/* ===== אחסון: מאגר משותף בענן (כשפתוח מהקישור) או הדפדפן (כקובץ) ===== */
let DB=null;
const LAST={};const WQ={};
const ARRKEYS={'tt:students':'students','tt:staff':'staff','tt:tasks':'tasks','tt:timetable':'timetable'};
const month=d=>String(d||'').slice(0,7)||'none';
const clone=o=>JSON.parse(JSON.stringify(o));
/* ===== Firebase ===== */
const FB_CONFIG={apiKey:"AIzaSyC1T3SBl84VJ9iMhXTgxpO2N0Vcw5VJpdk",authDomain:"nihul-mosad.firebaseapp.com",projectId:"nihul-mosad",
  storageBucket:"nihul-mosad.firebasestorage.app",messagingSenderId:"930039998457",appId:"1:930039998457:web:8d22bbc56c2feec9b2ff28"};
const OWNER_UID='OPqeXR8eV9fR5Js5TmaEwTyjlZ82',OWNER_EMAIL='admin@nihul-mosad.app',MAIL_DOMAIN='nihul-mosad.app';
let FS=null,AUTH=null;
function ukey(u){
  const t=String(u||'').trim(),l=t.toLowerCase();
  if(/^[a-z0-9._-]+$/.test(l))return l;
  return 'h'+Array.from(new TextEncoder().encode(t)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function fsAdapter(base){
  const wrap=x=>({id:x.id,exists:x.exists,data:()=>x.data()});
  return {
    doc:p=>{const r=FS.doc(base+'/'+p);return{get:async()=>wrap(await r.get()),set:d=>r.set(d),update:d=>r.set(d,{merge:true})};},
    collection:p=>({get:async()=>{const q=await FS.collection(base+'/'+p).get();return{docs:q.docs.map(wrap)};}})
  };
}
function fbErr(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return 'שם משתמש או סיסמה שגויים';
  if(/too-many-requests/.test(c))return 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות';
  if(/network-request-failed|unavailable/.test(c))return 'אין חיבור לשרת. בדקו את האינטרנט (או חסימה בנטפרי)';
  if(/weak-password/.test(c))return 'הסיסמה חלשה מדי — לפחות 6 תווים';
  if(/requires-recent-login/.test(c))return 'כדי להחליף סיסמה צריך להתנתק ולהיכנס מחדש, ואז לנסות שוב';
  if(/permission-denied/.test(c))return 'אין הרשאה לפעולה הזו';
  if(/email-already-in-use/.test(c))return 'שם המשתמש כבר קיים במערכת';
  return 'שגיאה: '+(c||(e&&e.message)||'לא ידועה');
}
async function createAuthUser(inst,u,pass){
  const app2=firebase.apps.find(a=>a.name==='second')||firebase.initializeApp(FB_CONFIG,'second');
  const a2=app2.auth();
  try{await a2.setPersistence(firebase.auth.Auth.Persistence.NONE);}catch(e){}
  const email=ukey(u).slice(0,40)+'.'+Math.random().toString(36).slice(2,7)+'@'+inst+'.'+MAIL_DOMAIN;
  const c=await a2.createUserWithEmailAndPassword(email,pass);
  const id=c.user.uid;try{await a2.signOut();}catch(e){}
  return {uid:id,email:email};
}
async function reloadMembers(){
  const q=await FS.collection('insts/'+S.inst+'/members').get();
  S.config.users=q.docs.map(d=>Object.assign({id:d.id},d.data())).filter(m=>m.active!==false)
    .map(m=>({id:m.id,user:m.user,role:m.role==='admin'?'admin':'teacher',cls:m.cls||'',teacher:m.teacher||''}));
}
async function createInst(code,name,adminUid,adminUser,adminEmail,classes){
  const b=FS.batch();
  b.set(FS.doc('insts/'+code),{name:name,created:firebase.firestore.FieldValue.serverTimestamp()});
  b.set(FS.doc('insts/'+code+'/members/'+adminUid),{user:adminUser,role:'admin',cls:'',active:true});
  b.set(FS.doc('logins/'+code+'_'+ukey(adminUser)),{email:adminEmail,inst:code,key:ukey(adminUser)});
  b.set(FS.doc('insts/'+code+'/store/config'),{v:{name:name,classes:classes||[],logo:'',domains:SEED_DOMAINS}});
  await b.commit();
}
async function enterInst(inst,user,typed){
  const owner=user.uid===OWNER_UID;
  let mem=null;
  try{mem=await FS.doc('insts/'+inst+'/members/'+user.uid).get();}catch(e){mem=null;}
  const isMem=mem&&mem.exists&&mem.data().active!==false;
  if(!isMem&&!owner){await AUTH.signOut();throw {code:'no-member'};}
  let isnap=await FS.doc('insts/'+inst).get();
  if(!isnap.exists){
    if(!owner){await AUTH.signOut();throw {code:'no-inst'};}
    if(!confirm('המוסד "'+inst+'" עוד לא קיים במערכת. ליצור אותו עכשיו?'))return false;
    await createInst(inst,'תלמוד תורה',user.uid,typed||'admin',OWNER_EMAIL,SEED_CLASSES.slice());
    isnap=await FS.doc('insts/'+inst).get();
    mem=await FS.doc('insts/'+inst+'/members/'+user.uid).get();
  }
  const m=(mem&&mem.exists)?mem.data():{user:'בעל המערכת',role:'admin',cls:''};
  S.inst=inst;S.owner=owner;S.instList=null;
  DB=fsAdapter('insts/'+inst);
  Object.keys(LAST).forEach(k=>delete LAST[k]);
  let cfg=await load(K.config,null);
  if(!cfg){cfg={name:(isnap.data()||{}).name||'המוסד',classes:[],logo:'',domains:SEED_DOMAINS};await save(K.config,cfg);}
  S.config=cfg;
  if(!S.config.domains||!S.config.domains.length)S.config.domains=SEED_DOMAINS;
  if(!S.config.classes)S.config.classes=[];
  await reloadMembers();
  S.students=await load(K.students,[]);S.staff=await load(K.staff,[]);
  S.att=await load(K.att,{});S.reviews=await load(K.reviews,[]);S.tasks=await load(K.tasks,[]);S.timetable=await load(K.timetable,[]);S.latt=await load(K.latt,{});LIDX=null;
  S.me={id:user.uid,user:m.user,role:m.role==='admin'?'admin':'teacher',cls:m.cls||'',teacher:m.teacher||'',mustChange:false};S.markLesson=null;S.markView='lessons';S.ttInit=0;S.ttMode='class';S.ttTeacher='';
  try{localStorage.setItem('tt:inst',inst);localStorage.setItem('tt:instName',S.config.name||'');}catch(e){}
  S.tab='dash';S.markCls=myClasses()[0]||'';S.revCls=myClasses()[0]||'';S.filter='';S.repCls='';S.revIdx=null;
  S.draft=Object.assign({},S.att[S.markDate]||{});S.dirty=false;
  document.getElementById('login').style.display='none';
  document.getElementById('shell').classList.add('on');
  render();
  return true;
}
function queued(path,fn){const p=(WQ[path]||Promise.resolve()).then(fn);WQ[path]=p.catch(()=>{});return p;}
async function dbMerge(path,body){
  return queued(path,async function(){
    const ref=DB.doc(path);
    for(let tries=0;tries<2;tries++){
      try{
        const snap=await ref.get();
        if(snap.exists)await ref.update(body);else await ref.set(body);
        return;
      }catch(e){
        if(e&&e.code==='unavailable'&&tries===0){await new Promise(r=>setTimeout(r,700+Math.random()*900));continue;}
        throw e;
      }
    }
  });
}
async function dbSet(path,body){
  return queued(path,async function(){
    try{await DB.doc(path).set(body);}
    catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800));await DB.doc(path).set(body);}else throw e;}
  });
}
function saveFailed(e){
  const c=e&&e.code;
  toast(c==='quota_exceeded'?'המאגר מלא — לא נשמר':c==='revoked'||c==='not_granted'?'אין הרשאה לשמור':'השמירה נכשלה — בדקו את החיבור');
}
async function load(key,fb){
  if(DB){
    try{
      if(ARRKEYS[key]){
        const sn=await DB.doc('store/'+ARRKEYS[key]).get();
        if(!sn.exists)return fb;
        const d=sn.data()||{},m=d.m||{},o=Array.isArray(d.o)?d.o:[];
        const seen={},out=[];
        o.forEach(id=>{if(m[id]&&!seen[id]){out.push(clone(m[id]));seen[id]=1;}});
        Object.keys(m).forEach(id=>{if(m[id]&&!seen[id])out.push(clone(m[id]));});
        const L={};out.forEach(r=>L[r.id]=JSON.stringify(r));LAST[key]={m:L,o:JSON.stringify(out.map(r=>r.id))};
        return out;
      }
      if(key===K.config){
        const sn=await DB.doc('store/config').get();
        if(!sn.exists)return fb;
        const v=clone((sn.data()||{}).v||null);if(v)delete v.users;LAST[key]=JSON.stringify(v);return v||fb;
      }
      if(key===K.att||key===K.latt){
        const q=await DB.collection('att').get();const out={},L={},wantL=key===K.latt;
        q.docs.forEach(doc=>{if((String(doc.id).charAt(0)==='L')!==wantL)return;const d=(doc.data()||{}).d||{};Object.keys(d).forEach(date=>{
          if(!d[date])return;const day={};Object.keys(d[date]).forEach(sid=>{if(d[date][sid]!=null)day[sid]=d[date][sid];});
          out[date]=day;L[date]=clone(day);});});
        LAST[key]=L;return out;
      }
      if(key===K.reviews){
        const q=await DB.collection('rev').get();const out=[],L={};
        q.docs.forEach(doc=>{const r=(doc.data()||{}).r||{};Object.keys(r).forEach(id=>{if(r[id]){out.push(clone(r[id]));L[id]={j:JSON.stringify(r[id]),mo:doc.id};}});});
        out.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
        LAST[key]=L;return out;
      }
    }catch(e){return fb;}
    return fb;
  }
  try{ const v=localStorage.getItem(key); if(v) return JSON.parse(v); }catch(e){}
  return fb;
}
async function save(key,val){
  if(DB){
    try{
      if(ARRKEYS[key]){
        const prev=LAST[key]||{m:{},o:'[]'},L={},m={};let ch=false;
        (val||[]).forEach(r=>{if(!r.id)r.id=uid();const j=JSON.stringify(r);L[r.id]=j;if(prev.m[r.id]!==j){m[r.id]=r;ch=true;}});
        Object.keys(prev.m).forEach(id=>{if(!(id in L)){m[id]=null;ch=true;}});
        const o=JSON.stringify((val||[]).map(r=>r.id));
        if(!ch&&o===prev.o)return;
        await dbMerge('store/'+ARRKEYS[key],{m:m,o:JSON.parse(o)});
        LAST[key]={m:L,o:o};return;
      }
      if(key===K.config){
        const cv=Object.assign({},val);delete cv.users;
        const j=JSON.stringify(cv);if(LAST[key]===j)return;
        await dbSet('store/config',{v:cv});LAST[key]=j;
        if(FS&&S.inst&&cv.name)FS.doc('insts/'+S.inst).set({name:cv.name},{merge:true}).catch(()=>{});
        return;
      }
      if(key===K.att||key===K.latt){
        const prev=LAST[key]||{},by={},pre=key===K.latt?'L':'';
        const dates=new Set(Object.keys(prev).concat(Object.keys(val||{})));
        dates.forEach(date=>{
          const a=prev[date]||{},b=(val||{})[date]||{},diff={};let ch=false;
          Object.keys(b).forEach(sid=>{if(a[sid]!==b[sid]){diff[sid]=b[sid];ch=true;}});
          Object.keys(a).forEach(sid=>{if(!(sid in b)){diff[sid]=null;ch=true;}});
          if(ch){(by[month(date)]=by[month(date)]||{})[date]=diff;}
        });
        for(const mo of Object.keys(by)){
          await dbMerge('att/'+pre+mo,{d:by[mo]});
          Object.keys(by[mo]).forEach(date=>{LAST[key]=LAST[key]||{};LAST[key][date]=clone((val||{})[date]||{});});
        }
        return;
      }
      if(key===K.reviews){
        const prev=LAST[key]||{},L={},by={};
        (val||[]).forEach(r=>{if(!r.id)r.id=uid();const j=JSON.stringify(r),mo=month(r.date);L[r.id]={j:j,mo:mo};
          const p=prev[r.id];
          if(!p||p.j!==j||p.mo!==mo){(by[mo]=by[mo]||{})[r.id]=r;if(p&&p.mo!==mo)(by[p.mo]=by[p.mo]||{})[r.id]=null;}});
        Object.keys(prev).forEach(id=>{if(!L[id])(by[prev[id].mo]=by[prev[id].mo]||{})[id]=null;});
        for(const mo of Object.keys(by))await dbMerge('rev/'+mo,{r:by[mo]});
        LAST[key]=L;return;
      }
    }catch(e){saveFailed(e);return;}
  }
  try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){ toast('אין מקום לשמור בדפדפן'); }
}
const STATUSES=[['present','נוכח'],['late','איחור'],['absent','חיסור'],['excused','מאושר']];

function iso(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return iso(d);}
const isSchoolDay=d=>new Date(d).getDay()!==6;
function gregLabel(s){try{return new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'}).format(new Date(s+'T12:00:00'));}catch(e){return s;}}
function gem(n){
  n=+n;if(!n)return '';
  const u=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],t=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],h=['','ק','ר','ש','ת','תק','תר','תש','תת','תתק'];
  let s=h[Math.floor(n/100)%10]+(n%100===15?'טו':n%100===16?'טז':t[Math.floor(n%100/10)]+u[n%10]);
  return s.length>1?s.slice(0,-1)+'״'+s.slice(-1):s+'׳';
}
function hebParts(s){
  try{
    const p=new Intl.DateTimeFormat('he-IL-u-ca-hebrew-nu-latn',{day:'numeric',month:'long',year:'numeric'}).formatToParts(new Date(s+'T12:00:00'));
    const g=t=>(p.find(x=>x.type===t)||{}).value||'';
    return {d:parseInt(g('day'),10),m:g('month').replace(/^ב/,''),y:parseInt(g('year'),10)};
  }catch(e){return null;}
}
function hebLabel(s){const p=hebParts(s);return p&&p.d?gem(p.d)+' ב'+p.m+' '+gem(p.y%1000):'';}
function hebShort(s){const p=hebParts(s);return p&&p.d?gem(p.d)+' ב'+p.m:'';}
function dual(s){return gregLabel(s)+' · '+hebLabel(s);}
function shortDate(s){try{const g=new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'numeric'}).format(new Date(s+'T12:00:00'));const h=hebShort(s);return g+(h?' · '+h:'');}catch(e){return s;}}
let toastTimer;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2400);}
function copy(txt,msg){navigator.clipboard&&navigator.clipboard.writeText(txt);toast(msg);}
function download(name,content,type){
  const url=URL.createObjectURL(new Blob([content],{type:type}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function hash(txt){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tt'+txt));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=5381;for(let i=0;i<txt.length;i++)h=((h<<5)+h+txt.charCodeAt(i))|0;return 'f'+(h>>>0).toString(16);}
}
function cleanPhone(v){
  if(v==null)return '';
  let s=String(v).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').trim();
  let d=s.replace(/\D/g,'');
  if(d.indexOf('972')===0)d='0'+d.slice(3);
  if(d.length===9&&d[0]==='5')d='0'+d;
  if(d.length===10&&d[0]==='0')return d.slice(0,3)+'-'+d.slice(3);
  if(d.length===9&&d[0]==='0')return d.slice(0,2)+'-'+d.slice(2);
  return s;
}

function reviewsOf(sid){return S.reviews.filter(r=>r.studentId===sid).sort((a,b)=>b.date<a.date?-1:1);}
function lastReview(sid){const r=reviewsOf(sid);return r.length?r[r.length-1]:null;}
let LIDX=null;
function lidx(){
  if(LIDX)return LIDX;LIDX={};
  Object.keys(S.latt).forEach(function(d){const day=S.latt[d]||{};Object.keys(day).forEach(function(k){
    const i=k.indexOf(':');if(i<0)return;const sid=k.slice(i+1),v=day[k];if(!v)return;
    (LIDX[sid]=LIDX[sid]||[]).push({d:d,l:k.slice(0,i),v:v});});});
  return LIDX;
}
function attStats(sid,from,to){
  let p=0,l=0,a=0,x=0,t=0;const ld={};
  (lidx()[sid]||[]).forEach(function(e){if(e.d<from||e.d>to)return;ld[e.d]=1;t++;
    if(e.v==='present')p++;else if(e.v==='late')l++;else if(e.v==='absent')a++;else x++;});
  Object.keys(S.att).forEach(function(d){
    if(d<from||d>to||ld[d])return;
    const v=S.att[d][sid];if(!v)return;t++;
    if(v==='present')p++;else if(v==='late')l++;else if(v==='absent')a++;else x++;
  });
  return {present:p,late:l,absent:a,excused:x,total:t,pct:t?Math.round((p+l)/t*100):null};
}
function dayStatus(sid,date){
  const es=(lidx()[sid]||[]).filter(e=>e.d===date);
  if(es.length){
    if(es.some(e=>e.v==='absent'))return 'absent';
    if(es.some(e=>e.v==='late'))return 'late';
    if(es.every(e=>e.v==='excused'))return 'excused';
    return 'present';
  }
  return (S.att[date]||{})[sid]||'';
}
function studentById(id){return S.students.find(s=>s.id===id);}

async function doLogin(){
  const inst=document.getElementById('li').value.trim().toLowerCase();
  const u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value;
  const err=document.getElementById('loginErr'),btn=document.getElementById('loginBtn');
  if(!inst||!u||!p){err.textContent='נא למלא קוד מוסד, שם משתמש וסיסמה';return;}
  if(!/^[a-z0-9-]{2,30}$/.test(inst)){err.textContent='קוד המוסד כתוב באנגלית בלבד (אותיות קטנות, ספרות ומקף), למשל: afula';return;}
  if(!FS){err.textContent='אין חיבור לשרת. בדקו את האינטרנט (או חסימה בנטפרי)';return;}
  err.textContent='';btn.disabled=true;btn.textContent='מתחבר…';
  try{
    try{await AUTH.setPersistence(document.getElementById('lr').checked?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);}catch(e){}
    let email=null;
    try{const l=await FS.doc('logins/'+inst+'_'+ukey(u)).get();if(l.exists)email=l.data().email;}catch(e){}
    if(!email&&ukey(u)==='admin')email=OWNER_EMAIL;
    if(!email)throw {code:'auth/invalid-credential'};
    const cred=await AUTH.signInWithEmailAndPassword(email,p);
    await enterInst(inst,cred.user,u);
    document.getElementById('lp').value='';
  }catch(e){
    err.textContent=e&&e.code==='no-member'?'למשתמש הזה אין הרשאה למוסד הזה':e&&e.code==='no-inst'?'קוד המוסד לא נמצא':fbErr(e);
  }finally{btn.disabled=false;btn.textContent='כניסה';}
}

function viewDash(){
  const today=iso(new Date()),day=S.att[today]||{},list=myStudents();
  const c={present:0,late:0,absent:0,excused:0,none:0};
  list.forEach(s=>{c[dayStatus(s.id,today)||'none']++;});
  const from=daysAgo(30);
  const alerts=[];
  if(S.timetable.length){
    const now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    const um=markableLessons(today).filter(l=>{const p=periods().find(x=>x.n===l.period);return p&&p.end&&p.end<=hm&&!lessonMarked(today,l).done;});
    if(um.length)alerts.push({t:'נוכחות',x:um.length+' שיעורים שהסתיימו היום ועוד לא סומנה בהם נוכחות',act:'goto-mark'});
  }
  if(!S.timetable.length)myClasses().forEach(function(cls){
    const inC=list.filter(s=>s.cls===cls),m=inC.filter(s=>day[s.id]).length;
    if(inC.length&&m<inC.length)alerts.push({t:'נוכחות',x:cls+' — טרם סומנה היום ('+m+'/'+inC.length+')',act:'goto-mark',cls:cls});
  });
  list.forEach(function(s){
    const a=attStats(s.id,from,today);
    if(a.total>=8&&a.pct<85)alerts.push({t:'נוכחות',x:s.name+' — '+a.pct+'% בחודש האחרון',act:'card',id:s.id});
  });
  list.forEach(function(s){
    const r=lastReview(s.id);
    if(r&&r.light==='red')alerts.push({t:'תמונת מצב',x:s.name+' — אדום בתמונת המצב מ־'+shortDate(r.date),act:'card',id:s.id});
  });
  const cutoff=daysAgo(21);
  const stale=list.filter(function(s){const r=lastReview(s.id);return !r||r.date<cutoff;});
  if(stale.length)alerts.push({t:'תמונת מצב',x:stale.length+' תלמידים ללא תמונת מצב מעל שלושה שבועות',act:'goto-review'});
  const overdue=S.tasks.filter(t=>t.status!=='done'&&t.due&&t.due<today);
  if(overdue.length)alerts.push({t:'משימות',x:overdue.length+' משימות באיחור',act:'goto-tasks'});

  const openTasks=S.tasks.filter(t=>t.status!=='done').slice(0,5);
  const recent=S.reviews.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,6);

  return printHead()+
   '<div class="head"><div><h2>'+gregLabel(today)+'</h2><div class="hebdate">'+hebLabel(today)+'</div></div>'+
   '<div class="row"><button class="btn" data-act="goto-mark">נוכחות</button><button class="btn" data-v="primary" data-act="goto-review">תמונת מצב</button></div></div>'+
   '<div class="grid g3" style="margin-bottom:14px">'+
     stat(c.present+c.late,'נוכחים מתוך '+list.length,'')+
     stat(c.absent,'חיסורים היום','var(--absent)')+
     stat(S.reviews.filter(r=>r.date>=daysAgo(7)).length,'תמונות מצב השבוע','')+
     stat(S.tasks.filter(t=>t.status!=='done').length,'משימות פתוחות','')+'</div>'+
   '<div class="card"><h3>מה דורש התייחסות</h3>'+
     (alerts.length?alerts.slice(0,12).map(function(a){
       return '<div class="alert"><b class="note" style="min-width:82px">'+a.t+'</b><span style="flex:1">'+esc(a.x)+'</span>'+
       '<button class="btn sm" data-v="ghost" data-act="'+a.act+'"'+(a.id?' data-id="'+a.id+'"':'')+(a.cls?' data-cls="'+esc(a.cls)+'"':'')+'>פתיחה</button></div>';
     }).join(''):'<div class="empty">הכול תקין. אין התראות פתוחות.</div>')+'</div>'+
   '<div class="grid g2">'+
   '<div class="card"><h3>משימות קרובות</h3>'+
     (openTasks.length?openTasks.map(t=>'<div class="alert"><span style="flex:1">'+esc(t.text)+'</span><span class="note">'+(t.due?shortDate(t.due):'')+'</span></div>').join('')
      :'<div class="empty">אין משימות פתוחות.</div>')+
     '<div class="row" style="margin-top:12px"><button class="btn sm" data-act="goto-tasks">ליומן המשימות</button></div></div>'+
   '<div class="card"><h3>תמונות מצב אחרונות</h3>'+
     (recent.length?recent.map(function(r){
       const s=studentById(r.studentId);
       return '<div class="alert"><span class="tag" data-s="'+r.light+'">'+LIGHTNAME[r.light]+'</span>'+
       '<button class="link" style="flex:1" data-act="card" data-id="'+r.studentId+'">'+esc(s?s.name:'—')+'</button>'+

     }).join(''):'<div class="empty">עוד לא נרשמו תמונות מצב.</div>')+'</div></div>';

function viewReview(){
  if(S.revIdx===null)return reviewSetup();
  const s=S.revList[S.revIdx];
  if(!s)return reviewDone();
  const d=S.revDraft||{light:'',scores:{},note:''};
  const prev=reviewsOf(s.id).filter(r=>r.date<S.revDate).slice(-1)[0];
  const hist=reviewsOf(s.id).slice(-5);
  const a=attStats(s.id,daysAgo(30),iso(new Date()));

  return '<div class="head"><div><h2>תמונת מצב</h2><div class="sub">'+esc(S.revCls)+' · '+dual(S.revDate)+'</div></div>'+
    '<button class="btn" data-v="ghost" data-act="rev-exit">סיום הסבב</button></div>'+
    '<div class="prog"><i style="width:'+Math.round((S.revIdx)/S.revList.length*100)+'%"></i></div>'+
    '<div class="rev-wrap"><div class="card">'+
      '<div class="row" style="justify-content:space-between;align-items:flex-start">'+
        '<div><div class="rev-name">'+esc(s.name)+'</div>'+
        '<div class="note">תלמיד '+(S.revIdx+1)+' מתוך '+S.revList.length+
        (a.pct!==null?' · נוכחות חודשית '+a.pct+'%':'')+'</div></div>'+
        '<button class="btn sm" data-v="ghost" data-act="card" data-id="'+s.id+'">כרטיס מלא</button></div>'+

      '<div class="lights">'+LIGHTS.map(l=>'<button data-act="rev-light" data-l="'+l[0]+'" data-on="'+(d.light===l[0]?1:0)+'">'+l[1]+'</button>').join('')+'</div>'+

      domains().map(function(dom){
        const v=d.scores[dom.id]||0;
        const pv=prev&&prev.scores?prev.scores[dom.id]:null;
        let delta='';
        if(pv&&v){const diff=v-pv;delta=diff>0?'<i style="color:var(--green)">▲ '+diff+'</i>':diff<0?'<i style="color:var(--red)">▼ '+(-diff)+'</i>':'<i>=</i>';}
        else if(pv)delta='<i>קודם '+pv+'</i>';
        return '<div class="dom"><div class="dom-label">'+esc(dom.name)+' '+delta+'</div><div class="scale">'+
          [1,2,3,4,5].map(n=>'<button data-act="rev-score" data-d="'+dom.id+'" data-n="'+n+'" data-on="'+(v===n?1:0)+'">'+n+'</button>').join('')+
          '</div></div>';
      }).join('')+

      '<label class="field" style="margin-top:14px"><span>הערה מהשיחה</span>'+
      '<textarea id="revNote" data-in="revNote" placeholder="מה עלה בשיחה, מה לעקוב אחריו, מה לעשות">'+esc(d.note)+'</textarea></label>'+

      '<div class="row"><button class="btn big" data-v="primary" data-act="rev-next">שמירה והבא</button>'+
      '<button class="btn" data-act="rev-skip">דילוג</button>'+
      (S.revIdx>0?'<button class="btn" data-v="ghost" data-act="rev-back">הקודם</button>':'')+'</div>'+
    '</div>'+

    '<div><div class="card"><h3 style="margin-bottom:8px">בפעם הקודמת</h3>'+
      (prev?'<div class="prev"><div class="row" style="justify-content:space-between;margin-bottom:8px">'+
        '<span class="tag" data-s="'+prev.light+'">'+LIGHTNAME[prev.light]+'</span><span class="note">'+shortDate(prev.date)+'</span></div>'+
        domains().map(function(dm){return prev.scores&&prev.scores[dm.id]?('<div>'+esc(dm.name)+': <b>'+prev.scores[dm.id]+'</b></div>'):'';}).join('')+
        (prev.note?'<p style="margin:8px 0 0">'+esc(prev.note)+'</p>':'')+'</div>'
        :'<p class="note">זו תמונת המצב הראשונה שלו.</p>')+
      (hist.length>1?'<div style="margin-top:12px"><div class="note" style="margin-bottom:5px">חמש האחרונות</div><div class="dots">'+
        hist.map(h=>'<i data-l="'+h.light+'" title="'+shortDate(h.date)+'"></i>').join('')+'</div></div>':'')+
    '</div>'+
    '<div class="card"><h3 style="margin-bottom:8px">נוכחות בחודש</h3>'+
      (a.total?'<div class="note">נוכח '+a.present+' · איחר '+a.late+' · חיסר '+a.absent+
      '</div><div class="bar" style="margin-top:8px"><i style="width:'+a.pct+'%" data-low="'+(a.pct<80?2:a.pct<90?1:0)+'"></i></div>'
      :'<p class="note">אין נתוני נוכחות.</p>')+'</div></div></div>';
}

function lessonStudents(l){
  if(l.type==='private'){const ids=l.students||[];return {list:S.students.filter(s=>ids.indexOf(s.id)>-1),away:[]};}
  const par=S.timetable.filter(o=>o.id!==l.id&&o.type==='private'&&o.day===l.day&&o.period===l.period);
  const inC=S.students.filter(s=>(l.classes||[]).indexOf(s.cls)>-1),list=[],away=[];
  inC.forEach(function(s){const pl=par.find(o=>(o.students||[]).indexOf(s.id)>-1);if(pl)away.push({s:s,l:pl});else list.push(s);});

async function markAction(a,el){

    Object.keys(day).forEach(k=>{if(k.indexOf(S.markLesson+':')===0)S.ldraft[k.slice(S.markLesson.length+1)]=day[k];});

function parseTimetable(m){
  let mode=null,dayCols=null,cur='';
  const lessons=[],seen={},per={},teachers={},classes={};let privNoStu=0;
  for(let r=0;r<m.length;r++){
    const row=m[r]||[],a=String(row[0]==null?'':row[0]).trim();
    let mm=a.match(/^כי?תה\s*:\s*(.+)$/);if(mm){mode='class';cur=mm[1].trim();dayCols=null;continue;}
    mm=a.match(/^מורה\s*:\s*(.+)$/);if(mm){mode='teacher';teachers[mm[1].trim()]=1;dayCols=null;continue;}
    const dc={};row.forEach((c,i)=>{const d=DAYS.indexOf(String(c==null?'':c).trim());if(d>-1)dc[i]=d;});
    if(Object.keys(dc).length>=3){dayCols=dc;continue;}
    if(mode!=='class'||!dayCols)continue;
    const pm=a.match(/^(\d+)\s*(?:(\d{1,2}:\d{2})\s*<?\s*(\d{1,2}:\d{2}))?/);if(!pm)continue;
    const pn=+pm[1];if(pm[2]&&!per[pn])per[pn]={n:pn,start:pm[2].padStart(5,'0'),end:pm[3].padStart(5,'0')};else if(!per[pn])per[pn]={n:pn,start:'',end:''};
    Object.keys(dayCols).forEach(function(ci){
      const txt=String(row[ci]==null?'':row[ci]);if(!txt.trim())return;
      const parts=txt.split(/(הוראה\s+\S+)/);
      for(let k=1;k<parts.length;k+=2){
        const lines=parts[k-1].split('\n').map(x=>x.trim()).filter(Boolean);if(lines.length<2)continue;
        const clsLine=lines[lines.length-1],teacher=lines[lines.length-2],subject=lines.slice(0,-2).join(' ');
        const cl=clsLine.split(/[\s,]+/).map(x=>x.trim()).filter(Boolean).map(clsFromBare);
        const type=/פרטנית/.test(parts[k])?'private':'class';
        const key=[dayCols[ci],pn,subject,teacher,cl.slice().sort().join('+'),type].join('|');
        if(seen[key])continue;seen[key]=1;
        teachers[teacher]=1;cl.forEach(c=>classes[c]=1);if(type==='private')privNoStu++;
        lessons.push({id:uid(),day:dayCols[ci],period:pn,subject:subject,teacher:teacher,classes:cl,type:type,students:[]});
      }
    });
  }
  return {lessons:lessons,periods:Object.keys(per).map(k=>per[k]).sort((a,b)=>a.n-b.n),teachers:Object.keys(teachers),classes:Object.keys(classes),privNoStu:privNoStu};
}
async function handleTtFile(file){
  try{
    const X=await loadSheetJS();
    const wb=X.read(await file.arrayBuffer(),{type:'array'});
    let all=[];wb.SheetNames.forEach(n=>{all=all.concat(X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}));});
    const r=parseTimetable(all);
    S.ttImport=r.lessons.length?r:{error:'לא מצאתי שיעורים בקובץ. הייבוא תומך בקובץ "שיבוץ" שמיוצא מתיק-תק (דפי "כיתה:").'};
  }catch(e){S.ttImport={error:'לא הצלחתי לקרוא את הקובץ'+(e&&e.message==='cdn'?' (צריך חיבור לאינטרנט)':': '+(e&&e.message||''))};}
  render();
}

async function ttAction(a,el){
  if(!isAdmin()&&['tt-mode','tt-cls','tt-teacher','tt-day'].indexOf(a)<0)return;
  if(a==='tt-mode'){S.ttMode=el.dataset.m;S.ttSlot=null;S.ttEdit=null;return render();}
  if(a==='tt-cls'){S.ttCls=el.dataset.c;S.ttSlot=null;S.ttEdit=null;return render();}
  if(a==='tt-teacher'){S.ttTeacher=el.dataset.t;S.ttSlot=null;S.ttEdit=null;return render();}
  if(a==='tt-day'){S.ttDay=+el.dataset.d;S.ttSlot=null;S.ttEdit=null;return render();}
  if(a==='tt-slot'){
    S.ttSlot={day:+el.dataset.day,period:+el.dataset.p};S.ttEdit=null;render();

    classes:S.ttMode==='teacher'?[]:[ttCurCls()],type:'class',students:[]};return render();}
  if(a==='tt-edit'){S.ttEdit=clone(S.timetable.find(l=>l.id===el.dataset.id));return render();}
  if(a==='tt-cancel'){S.ttEdit=null;return render();}
  if(a==='tt-del'){if(!confirm('למחוק את השיעור?'))return;S.timetable=S.timetable.filter(l=>l.id!==el.dataset.id);save(K.timetable,S.timetable);toast('השיעור נמחק');return render();}
  if(a==='tt-save'){
    ttCapture();const e=S.ttEdit;
    if(!e.subject&&!e.teacher)return toast('צריך למלא מקצוע או מורה');
    if(!e.classes||!e.classes.length)return toast('צריך לבחור לפחות כיתה אחת');
    const o={id:e.id||uid(),day:e.day,period:e.period,subject:e.subject,teacher:e.teacher,classes:e.classes,type:e.type,students:e.type==='private'?e.students:[]};

  }
  if(a==='tt-periods'){S.ttPeriods=!S.ttPeriods;S.ttPerDraft=null;return render();}
  if(a==='per-add'){perCapture();const P=S.ttPerDraft;P.push({n:P.length+1,start:'',end:''});return render();}
  if(a==='per-del'){perCapture();const i=+el.dataset.i,n=i+1;
    if(S.timetable.some(l=>l.period===n)&&!confirm('יש שיעורים בשיעור '+n+'. להסיר בכל זאת? השיעורים שבו יימחקו.'))return;
    S.ttPerDraft.splice(i,1);S.ttPerDraft._removed=(S.ttPerDraft._removed||[]).concat([n]);return render();}
  if(a==='per-save'){
    perCapture();const P=S.ttPerDraft,rem=P._removed||[];
    // renumber lessons: map old period numbers to new positions
    const oldNs=periods().map(p=>p.n).filter(n=>rem.indexOf(n)<0);
    const mapN={};oldNs.forEach((n,i)=>mapN[n]=i+1);
    S.timetable=S.timetable.filter(l=>mapN[l.period]).map(l=>Object.assign({},l,{period:mapN[l.period]}));
    S.config.periods=P.map((p,i)=>({n:i+1,start:p.start||'',end:p.end||''}));
    save(K.config,S.config);save(K.timetable,S.timetable);S.ttPeriods=false;S.ttPerDraft=null;toast('מבנה היום נשמר');return render();
  }
  if(a==='tt-pick-file')return document.getElementById('ttFile').click();
  if(a==='tt-import-cancel'){S.ttImport=null;return render();}
  if(a==='tt-import-apply'){
    const r=S.ttImport;
    r.classes.forEach(c=>{if(S.config.classes.indexOf(c)<0)S.config.classes.push(c);});
    if(r.periods.length&&r.periods.every(p=>p.start))S.config.periods=r.periods;
    let st=false;r.teachers.forEach(t=>{if(ttEnsureStaff(t))st=true;});
    S.timetable=r.lessons;

    S.ttImport=null;S.ttSlot=null;S.ttMode='class';toast(r.lessons.length+' שיעורים נטענו');return render();
  }
  if(a==='tt-clear'){
    if(!S.timetable.length)return toast('המערכת כבר ריקה');

    S.timetable=[];save(K.timetable,S.timetable);S.ttSlot=null;S.ttEdit=null;toast('המערכת רוקנה');return render();
  }
}

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  text=text.replace(/^\ufeff/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(c!=='\r')cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()));
}
const IMP_TARGETS=[['first','שם פרטי'],['last','שם משפחה'],['full','שם מלא'],['cls','כיתה'],['father','שם האב'],['fphone','טלפון האב'],
  ['mother','שם האם'],['mphone','טלפון האם'],['notes','הערות'],['extra','שדה נוסף (נשמר בכרטיס)'],['skip','לא לייבא']];
function impNorm(h){return String(h==null?'':h).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').replace(/[״"׳'.:_\-\/\\()]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();}
function guessTarget(h){
  const n=impNorm(h);if(!n)return 'skip';
  const toks=n.split(' '),has=(...w)=>w.some(x=>n.indexOf(x)>-1),tok=(...w)=>w.some(x=>toks.indexOf(x)>-1);
  const phone=has('טל','נייד','פלאפון','סלולר','phone','mobile','cell');
  const dad=tok('אב','האב','father','dad')||has('אבא');
  const mom=tok('אם','האם','mother','mom')||has('אמא');
  if(phone&&dad&&!mom)return 'fphone';
  if(phone&&mom&&!dad)return 'mphone';
  if(has('פרטי')||n==='first name'||n==='first')return 'first';
  if(has('משפחה')||n==='last name'||n==='surname'||n==='last')return 'last';
  if(dad&&!mom&&!phone)return 'father';
  if(mom&&!dad&&!phone)return 'mother';
  if(has('כיתה','כתה','שיעור','class'))return 'cls';
  if(n==='שם'||has('שם מלא','שם התלמיד','שם תלמיד','שם הילד','student','name'))return 'full';
  if(has('הערה','הערות','notes','remark'))return 'notes';
  if(phone)return 'phone';
  if(['מס','#','מספר','מס סידורי','מספר סידורי','no'].indexOf(n)>-1)return 'skip';
  return 'extra';
}
function detectHeaderRow(m){
  const lim=Math.min(m.length,12);
  for(let r=0;r<lim;r++){
    const cells=(m[r]||[]).filter(c=>String(c==null?'':c).trim()!=='');
    if(cells.length<2)continue;
    const g=(m[r]||[]).map(guessTarget);
    if(g.some(t=>t==='first'||t==='last'||t==='full'))return r;
  }
  for(let r=0;r<lim;r++){if((m[r]||[]).filter(c=>String(c==null?'':c).trim()!=='').length>=2)return r;}
  return 0;
}
function buildPreview(matrix){
  matrix=(matrix||[]).filter(r=>Array.isArray(r));
  if(!matrix.length)return {error:'הקובץ ריק'};
  const hr=detectHeaderRow(matrix);
  const width=Math.max.apply(null,matrix.map(r=>r.length));
  const head=[];for(let i=0;i<width;i++)head.push(String(matrix[hr][i]==null?'':matrix[hr][i]).replace(/[\u200e\u200f]/g,'').trim());
  const used={},map=head.map(function(h){
    let t=guessTarget(h);
    if(t!=='extra'&&t!=='skip'&&t!=='phone'){if(used[t])t='extra';else used[t]=1;}
    return t;
  });
  map.forEach(function(t,i){if(t==='phone'){if(!used.fphone){map[i]='fphone';used.fphone=1;}else if(!used.mphone){map[i]='mphone';used.mphone=1;}else map[i]='extra';}});
  // columns with header but no data at all -> skip
  const p={matrix:matrix,hr:hr,head:head,map:map};
  head.forEach(function(h,i){
    if(!h){map[i]=matrix.slice(hr+1).some(r=>String(r[i]==null?'':r[i]).trim())?'extra':'skip';}
  });
  return computeImport(p);
}
function computeImport(p){
  const m=p.matrix,map=p.map,head=p.head;
  const col=t=>map.indexOf(t);
  const rows=[],classes={};let noPhone=0;
  for(let r=p.hr+1;r<m.length;r++){
    const row=m[r]||[];
    const v=i=>i<0?'':String(row[i]==null?'':row[i]).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').trim();
    const full=v(col('full')),fl=(v(col('first'))+' '+v(col('last'))).trim();
    const name=(col('first')>-1||col('last')>-1)?(fl||full):full;
    if(!name)continue;
    let cls=v(col('cls'));
    {const bare=cls.replace(/['׳"״]/g,'').replace(/^כי?תה\s*/,'').trim();if(bare&&bare.length<=2&&!/\d/.test(bare))cls='כיתה '+bare+GER;}
    const extra={};
    map.forEach(function(t,i){if(t==='extra'){const x=v(i);if(x)extra[head[i]||('עמודה '+(i+1))]=x;}});
    const o={id:uid(),name:name,cls:cls,father:v(col('father')),fatherPhone:cleanPhone(v(col('fphone'))),
      mother:v(col('mother')),motherPhone:cleanPhone(v(col('mphone'))),notes:v(col('notes')),extra:extra};
    if(!Object.keys(extra).length)delete o.extra;
    if(!o.fatherPhone&&!o.motherPhone)noPhone++;
    if(cls)classes[cls]=1;
    rows.push(o);
  }
  p.rows=rows;p.classes=Object.keys(classes).sort();p.noPhone=noPhone;
  p.error=(col('full')<0&&col('first')<0&&col('last')<0)?'nomap':(rows.length?null:'norows');
  return p;
}
function loadSheetJS(){
  return new Promise(function(res,rej){
    if(window.XLSX)return res(window.XLSX);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=()=>res(window.XLSX);sc.onerror=()=>rej(new Error('cdn'));
    document.head.appendChild(sc);
  });
}
async function handleImportFile(file){
  try{
    if(file.name.toLowerCase().slice(-4)==='.csv'){
      S.importPreview=buildPreview(parseCSV(await file.text()));
    }else{
      let X;
      try{X=await loadSheetJS();}
      catch(e){S.importPreview={error:'לקריאת קובץ אקסל צריך חיבור לאינטרנט בפעם הראשונה. אפשר גם לשמור באקסל כ־CSV UTF-8 ולייבא — זה עובד גם בלי אינטרנט.'};return render();}
      const wb=X.read(await file.arrayBuffer(),{type:'array'});
      let best=null;
      wb.SheetNames.forEach(function(n){const mtx=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).filter(r=>r.some(c=>String(c).trim()));if(!best||mtx.length>best.length)best=mtx;});
      S.importPreview=buildPreview(best||[]);
    }
  }catch(e){S.importPreview={error:'לא הצלחתי לקרוא את הקובץ: '+e.message};}
  render();
}

function loadRevDraft(){
  const s=S.revList[S.revIdx];
  if(!s){S.revDraft=null;return;}
  const ex=S.reviews.find(r=>r.studentId===s.id&&r.date===S.revDate);
  S.revDraft=ex?{light:ex.light,scores:Object.assign({},ex.scores),note:ex.note}:{light:'',scores:{},note:''};
}
function saveRev(){
  const s=S.revList[S.revIdx],d=S.revDraft;
  if(!s||!d)return false;
  if(!d.light&&!d.note&&!Object.keys(d.scores).length)return false;
  const rec={id:uid(),studentId:s.id,date:S.revDate,light:d.light||'yellow',scores:d.scores,note:d.note,by:S.me.user};
  const i=S.reviews.findIndex(r=>r.studentId===s.id&&r.date===S.revDate);
  if(i>-1){rec.id=S.reviews[i].id;S.reviews[i]=rec;}else{S.reviews.push(rec);S.revDone++;}
  save(K.reviews,S.reviews);
  return true;
}

  if(a==='goto-mark'){S.tab='mark';if(el.dataset.cls)S.markCls=el.dataset.cls;S.draft=Object.assign({},S.att[S.markDate]||{});S.dirty=false;return render();}

  if(a==='goto-import'){S.tab='import';S.importPreview=null;return render();}

  if(a==='backup'){

document.getElementById('main').addEventListener('change',function(e){
  const el=e.target;
  if(el.id==='importFile'&&el.files&&el.files[0])return handleImportFile(el.files[0]);
  if(el.id==='ttFile'&&el.files&&el.files[0]){const f=el.files[0];el.value='';return handleTtFile(f);}
  if(el.dataset&&el.dataset.ttf){ttCapture();if(el.dataset.ttstu||(el.tagName==='INPUT'&&el.type!=='checkbox'))return;return render();}
  if(el.dataset&&el.dataset.per!==undefined)return;
  if(el.dataset&&el.dataset.hr!==undefined){S.config.homeroom=Object.assign({},S.config.homeroom||{});if(el.value)S.config.homeroom[el.dataset.hr]=el.value;else delete S.config.homeroom[el.dataset.hr];save(K.config,S.config);toast('המחנך עודכן');return render();}
  if(el.dataset&&el.dataset.map!==undefined&&S.importPreview&&S.importPreview.map){
    const i=+el.dataset.map,t=el.value,p=S.importPreview;
    if(['extra','skip'].indexOf(t)<0)p.map.forEach(function(x,j){if(j!==i&&x===t)p.map[j]='extra';});
    p.map[i]=t;computeImport(p);return render();
  }
  if(el.id==='logoFile'&&el.files&&el.files[0]){
    const r=new FileReader();
    r.onload=function(){
      const img=new Image();
      img.onload=function(){
        let w=img.width,h=img.height;
        const sc=Math.min(260/w,110/h,1);w=Math.round(w*sc);h=Math.round(h*sc);
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        S.config.logo=cv.toDataURL('image/png');
        save(K.config,S.config);toast('הלוגו נשמר');render();
      };
      img.onerror=function(){toast('לא הצלחתי לקרוא את התמונה');};
      img.src=r.result;
    };
    r.readAsDataURL(el.files[0]);return;
  }
  if(el.id==='restoreFile'&&el.files&&el.files[0]){
    const r=new FileReader();
    r.onload=function(){try{
      const d=JSON.parse(r.result);
      const keepUsers=S.config.users;S.config=Object.assign({},d.config||S.config,{users:keepUsers});S.students=d.students||[];S.staff=d.staff||[];
      S.att=d.att||{};S.reviews=d.reviews||[];S.tasks=d.tasks||[];if(d.timetable)S.timetable=d.timetable;if(d.latt)S.latt=d.latt;LIDX=null;
      [[K.config,S.config],[K.students,S.students],[K.staff,S.staff],[K.att,S.att],[K.reviews,S.reviews],[K.tasks,S.tasks],[K.timetable,S.timetable],[K.latt,S.latt]].forEach(p=>save(p[0],p[1]));
      toast('הגיבוי נטען');render();
    }catch(err){toast('הקובץ לא תקין');}};
    r.readAsText(el.files[0]);return;
  }
  const k=el.dataset.ch;if(!k)return;
  S[k]=el.value;
  if(k==='markDate'){S.draft=Object.assign({},S.att[S.markDate]||{});S.dirty=false;S.markLesson=null;S.ldirty=false;}
  if(k==='revDate'&&S.revIdx!==null)loadRevDraft();
  render();
});

const side=document.getElementById('side'),backdrop=document.getElementById('backdrop');
function drawerOpen(){return side.classList.contains('open');}
function openDrawer(){
  if(drawerOpen())return;
  side.classList.add('open');backdrop.classList.add('on');
  try{history.pushState({tab:S.tab,cardId:S.cardId,menu:1},'','#'+S.tab);}catch(e){}
}
function closeDrawer(silent){
  if(!drawerOpen())return;
  side.classList.remove('open');backdrop.classList.remove('on');
  if(!silent&&history.state&&history.state.menu){try{history.back();}catch(e){}}

function paintMobile(){

  document.getElementById('bnav').innerHTML=quick.map(t=>'<button data-tab="'+t[0]+'" data-on="'+(S.tab===t[0]?1:0)+'"><svg viewBox="0 0 24 24">'+(ICONS[t[0]]||ICONS.more)+'</svg><span>'+t[1]+'</span></button>').join('')+
    '<button data-more="1" data-on="'+(quick.some(t=>t[0]===S.tab)?0:1)+'"><svg viewBox="0 0 24 24">'+ICONS.more+'</svg><span>עוד</span></button>';

/* כפתור "חזרה" של אנדרואיד */
let histReady=false,fromPop=false;
function syncHistory(){
  if(fromPop)return;
  const st=history.state||{};
  const want={tab:S.tab,cardId:S.cardId};
  try{
    if(!histReady){history.replaceState(want,'','#'+S.tab);histReady=true;return;}
    if(st.menu){history.replaceState(want,'','#'+S.tab);return;}
    if(st.tab!==S.tab||(S.tab==='card'&&st.cardId!==S.cardId))history.pushState(want,'','#'+S.tab);
  }catch(e){}
}
window.addEventListener('popstate',function(e){
  if(drawerOpen()){closeDrawer(true);return;}
  if(!S.me)return;
  const st=e.state;
  if(!st||!st.tab)return;
  if(S.tab==='mark'&&S.dirty&&!confirm('יש שינויים בנוכחות שלא נשמרו. לצאת בכל זאת?')){try{history.pushState({tab:S.tab},'','#'+S.tab);}catch(x){}return;}
  fromPop=true;
  if(st.tab==='card'){if(st.cardId&&studentById(st.cardId)){S.cardId=st.cardId;S.tab='card';render();}else goTab('dash');}
  else goTab(st.tab);
  fromPop=false;window.scrollTo(0,0);
});

/* החלקות: פתיחת תפריט מהקצה, סגירה, ומעבר בין תלמידים בתמונת מצב */
let tStart=null;
document.addEventListener('touchstart',function(e){
  if(e.touches.length!==1){tStart=null;return;}
  const t=e.touches[0];
  tStart={x:t.clientX,y:t.clientY,time:Date.now(),edge:t.clientX>window.innerWidth-28,inSide:!!e.target.closest('#side'),
    field:!!e.target.closest('input,textarea,select,.scroll,table')};
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!tStart||!S.me)return;
  const t=e.changedTouches[0],dx=t.clientX-tStart.x,dy=t.clientY-tStart.y,dt=Date.now()-tStart.time;
  const s=tStart;tStart=null;
  if(dt>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2)return;
  const mobile=matchMedia('(max-width:820px)').matches;
  if(mobile&&s.edge&&dx<0&&!drawerOpen())return openDrawer();
  if(mobile&&drawerOpen()&&dx>0)return closeDrawer(false);
  if(s.field||s.inSide||drawerOpen())return;
  if(S.tab==='review'&&S.revIdx!=null&&S.revList[S.revIdx]){
    const btn=document.querySelector('#main [data-act="'+(dx<0?'rev-next':'rev-back')+'"]');
    if(btn&&!btn.disabled){btn.click();window.scrollTo(0,0);}
  }
},{passive:true});

  if(!installEvt||document.getElementById('installBtn'))return;
  const b=document.createElement('button');b.className='btn full';b.dataset.v='primary';b.id='installBtn';b.textContent='התקנה כאפליקציה';b.style.marginBottom='10px';
  b.addEventListener('click',async function(){if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(x){}installEvt=null;b.remove();});
  const who=document.getElementById('who');who.parentNode.insertBefore(b,who);
}
