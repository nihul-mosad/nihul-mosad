@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700&family=Noto+Sans:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#E9EDF2;--surface:#FFFFFF;--surface2:#F4F6F9;--ink:#16243B;--muted:#5C6B80;--line:#D6DDE6;
--accent:#8A2E3F;--accent-soft:#F6EAEC;--present:#2F7A4F;--late:#B0801F;--absent:#AF3A2E;--excused:#5C6B80;
--green:#2F7A4F;--yellow:#C9911C;--red:#AF3A2E}
body{margin:0;font-family:'Assistant',system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-weight:700;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
a{color:var(--accent)}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
#login .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px;width:100%;max-width:360px}
#login h1{font-size:24px;margin-bottom:4px}
#login .logo{max-height:70px;max-width:200px;display:block;margin:0 auto 16px}
.shell{display:none;min-height:100vh}
.shell.on{display:flex}
.side{width:210px;flex:0 0 210px;background:var(--surface);border-left:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
.brand{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand img{max-height:52px;max-width:100%;display:block;margin-bottom:8px}
.brand h1{font-size:19px;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:right;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;transition:background .12s,color .12s}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[data-on="1"]{background:var(--accent-soft);color:var(--accent)}
.who{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.who b{display:block;color:var(--ink);font-size:14px}
main{flex:1;min-width:0;padding:24px 28px 80px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h2{font-size:26px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.hebdate{font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:17px;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px}
.exrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--surface2);padding:5px 0}
.exrow input{width:84px;text-align:center}
.rchead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--line);padding-bottom:10px}
.rcgrp{margin:12px 0 4px}
.dmi{border-bottom:1px solid var(--surface2);padding:10px 0}
.asfile{border-bottom:1px solid var(--surface2);padding:10px 0}
.asmsgs{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.asm{border-bottom:1px solid var(--surface2);padding:8px 0}
.asb{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.asx{background:none;border:0;color:var(--muted);cursor:pointer;float:left;font-size:12px;opacity:.5}
.asx:hover{opacity:1;color:var(--absent)}
.asm[data-a="1"]{border-right:3px solid var(--present);padding-right:8px}
.asm[data-a="0"]{border-right:3px solid var(--late);padding-right:8px}
.acstep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.acprop{border-bottom:1px solid var(--surface2);padding:12px 0}
.acprop .row{flex-wrap:wrap}
.acsrc{margin-top:6px;padding:6px 10px;border-right:3px solid var(--line);background:var(--surface2);border-radius:6px}
.acq{font-size:13.5px;overflow-wrap:anywhere}
.acin{min-width:0;width:min(520px,100%)}
.acitem{padding:8px 0;border-bottom:1px solid var(--surface2)}
.actopic{margin-top:14px}
.acsel{width:auto;padding:3px 6px;font-size:13px}
.acks{font-weight:700;color:var(--accent)}
.acurg{font-size:13px}
.acurg:has(input:checked){color:var(--absent);font-weight:700}
.nbadge{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:6px;border-radius:99px;background:var(--absent);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
#dmPill{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:9000;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:11px 20px;font:inherit;font-weight:700;box-shadow:0 8px 24px rgba(20,27,52,.3);cursor:pointer;animation:remIn .35s ease;white-space:nowrap}
@media print{#dmPill{display:none}}
.rct tr.rcw td{background:var(--surface2);padding-top:9px}
.rct tr.rcwa td{font-size:13px;color:var(--muted)}
.rct tr.rcm td{background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-weight:700;border-top:2px solid var(--accent)}
@media print{.rct tr.rcw td,.rct tr.rcm td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.rcsign{display:flex;gap:24px;margin-top:40px}
.rcsign div{flex:1;border-top:1px solid var(--ink);padding-top:4px;text-align:center;font-size:13px;color:var(--muted)}
.rcpage{margin-bottom:34px}
@media print{.rcpage{break-after:page;margin:0}.rcpage:last-child{break-after:auto}}
.hmt td.hm{text-align:center;font-weight:600;min-width:58px;border-radius:6px;font-variant-numeric:tabular-nums}
.hmt th{white-space:nowrap}
.ains{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--surface))}
.afresh .alert[data-tone="bad"]{color:var(--absent)}
.afresh .alert[data-tone="good"]{color:var(--present)}
#remBox{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;width:min(440px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px}
.remp{background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(20,27,52,.28);animation:remIn .35s ease;transition:opacity .3s,transform .3s}
.remp.out{opacity:0;transform:translateY(-12px)}
.remh{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--accent);font-size:15px}
.remx{background:none;border:0;font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px}
.remt{font-size:16px;margin:8px 0 4px;white-space:pre-wrap}
.remb{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:8px}
.remb i{display:block;height:100%;background:var(--gold);animation:remBar 120s linear forwards}
@keyframes remIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes remBar{from{width:100%}to{width:0}}
.dhero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.dnow{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13.5px}
.dquick .btn{white-space:nowrap}
.dcls{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--surface2)}
.dcls b{min-width:70px}
.dtrend{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:4px}
.dtrend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.dtrend i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--present)}
.dtrend i[data-low="1"]{background:var(--late)}.dtrend i[data-low="2"]{background:var(--absent)}
.dtrend em{font-style:normal;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.dtrend .note{font-size:11px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:31px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600;transition:background .12s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--surface2)}
.btn[data-v="primary"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[data-v="primary"]:hover{background:#75252f}
.btn[data-v="ghost"]{border-color:transparent;background:transparent;color:var(--muted)}
.btn[data-v="ghost"]:hover{color:var(--accent);background:var(--accent-soft)}
.btn[data-v="danger"]{color:var(--absent);border-color:#E7C6C1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sm{padding:5px 10px;font-size:13px}
.big{padding:12px 22px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.full{width:100%;text-align:center}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface)}
.field textarea{min-height:90px;resize:vertical;line-height:1.6}
.inp{width:auto}
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:12.5px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--surface2)}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.ltr{direction:ltr;text-align:right;display:inline-block}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:right}
.link:hover{text-decoration:underline}
.mark{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--surface2)}
.mark-name{flex:1;min-width:0;font-weight:600}
.mark-name em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:var(--surface);padding:8px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-left:1px solid var(--line);min-width:52px}
.seg button:last-child{border-left:0}
.seg button:hover{background:var(--surface2)}
.seg button[data-on="1"]{color:#fff}
.seg button[data-on="1"][data-s="present"]{background:var(--present)}
.seg button[data-on="1"][data-s="late"]{background:var(--late)}
.seg button[data-on="1"][data-s="absent"]{background:var(--absent)}
.seg button[data-on="1"][data-s="excused"]{background:var(--excused)}
.savebar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 -2px 12px rgba(22,36,59,.06)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:700}
.tag[data-s="present"]{background:#E4F0E9;color:var(--present)}
.tag[data-s="late"]{background:#F7EFDC;color:var(--late)}
.tag[data-s="absent"]{background:#F7E4E1;color:var(--absent)}
.tag[data-s="excused"],.tag[data-s="teacher"]{background:var(--surface2);color:var(--muted)}
.tag[data-s="admin"]{background:var(--accent-soft);color:var(--accent)}
.tag[data-s="green"]{background:#E4F0E9;color:var(--green)}
.tag[data-s="yellow"]{background:#F9F0DA;color:var(--yellow)}
.tag[data-s="red"]{background:#F7E4E1;color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip b{width:7px;height:7px;border-radius:50%;background:var(--absent)}
.chip[data-done="1"] b{background:var(--present)}
.chip[data-done="1"]{color:var(--muted);font-weight:400}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.warn{background:#FBF3E3;border:1px solid #EBD9AE;color:#7A5B14;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--present)}
.bar i[data-low="1"]{background:var(--late)}
.bar i[data-low="2"]{background:var(--absent)}
#toast{position:fixed;bottom:18px;left:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:50;display:none}
.printhead{display:none}.onlyprint{display:none}
/* תמונת מצב */
.rev-wrap{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.rev-name{font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:30px;font-weight:700;line-height:1.15}
.lights{display:flex;gap:10px;margin:14px 0 18px}
.lights button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 8px;cursor:pointer;font-weight:700;font-size:16px;color:var(--muted)}
.lights button:hover{background:var(--surface2)}
.lights button[data-on="1"]{color:#fff}
.lights button[data-on="1"][data-l="green"]{background:var(--green);border-color:var(--green)}
.lights button[data-on="1"][data-l="yellow"]{background:var(--yellow);border-color:var(--yellow)}
.lights button[data-on="1"][data-l="red"]{background:var(--red);border-color:var(--red)}
.dom{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--surface2)}
.dom-label{flex:1;font-weight:600}
.dom-label i{font-style:normal;color:var(--muted);font-weight:400;font-size:12.5px;margin-right:6px}
.scale{display:flex;gap:5px}
.scale button{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:700;color:var(--muted)}
.scale button:hover{background:var(--surface2)}
.scale button[data-on="1"]{background:var(--ink);border-color:var(--ink);color:#fff}
.prev{background:var(--surface2);border-radius:8px;padding:12px 14px;font-size:13.5px}
.prev h4{margin:0 0 8px;font-size:14px;font-family:'Noto Sans Hebrew';font-weight:700}
.dots{display:flex;gap:4px}
.dots i{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--line)}
.dots i[data-l="green"]{background:var(--green)}
.dots i[data-l="yellow"]{background:var(--yellow)}
.dots i[data-l="red"]{background:var(--red)}
.prog{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--accent)}
.tl{border-right:2px solid var(--line);padding:0 0 4px 0;margin-right:6px}
.tl-item{position:relative;padding:0 18px 16px 0}
.tl-item::before{content:'';position:absolute;right:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--surface)}
.tl-item[data-l="green"]::before{background:var(--green)}
.tl-item[data-l="yellow"]::before{background:var(--yellow)}
.tl-item[data-l="red"]::before{background:var(--red)}
.tl-date{font-size:12.5px;color:var(--muted);font-weight:700}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--surface2)}
.task-body{flex:1;min-width:0}
.task-body b{display:block;font-weight:600}
.task[data-done="1"] .task-body b{text-decoration:line-through;color:var(--muted)}
.tick{width:24px;height:24px;border:2px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;flex:0 0 auto;margin-top:2px;font-weight:700;color:transparent}
.task[data-done="1"] .tick{background:var(--present);border-color:var(--present);color:#fff}
.alert{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--surface2);font-size:14px}
.alert:last-child{border-bottom:0}
.alert b{flex:0 0 auto}
@media(max-width:900px){.rev-wrap{grid-template-columns:1fr}}
@media(max-width:820px){
.shell.on{flex-direction:column}
.side{width:auto;flex:none;border-left:0;border-bottom:1px solid var(--line);padding:14px}
.brand{border-bottom:0;margin-bottom:8px;padding-bottom:8px}
.nav{flex-direction:row;overflow-x:auto;gap:4px}
.nav button{white-space:nowrap;padding:7px 12px}
.who{margin-top:10px;padding-top:10px}
main{padding:18px 14px 70px}
.mark{flex-wrap:wrap}
.seg{width:100%}
.seg button{flex:1}
.rev-name{font-size:24px}
.scale button{width:34px;height:34px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.savebar,#toast,.btn{display:none}main{padding:0}.card{break-inside:avoid;border:0;padding:0}
.printhead{display:block;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}.printhead img{max-height:50px}
.noprint{display:none!important}.onlyprint{display:block}.card.brk{break-inside:auto}.lgday{break-after:avoid;margin-top:14px}}

/* ===== מובייל, מגע ואפליקציה ===== */
html{-webkit-text-size-adjust:100%;height:100%}
body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent;min-height:100%}
button,.btn,.chip,.link,a,label,[data-act],[data-tab]{touch-action:manipulation}
.btn:active,.chip:active,.seg button:active,.lights button:active,.scale button:active,.tick:active,.nav button:active,.bnav button:active{transform:scale(.96)}
.btn,.chip,.seg button,.lights button,.scale button,.tick,.bnav button{transition:background .12s,transform .08s}
.topbar,.bnav,.backdrop{display:none}
#login{padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(hover:none){
  .btn:hover{background:var(--surface)}
  .btn[data-v="primary"]:hover{background:var(--accent)}
  .btn[data-v="ghost"]:hover{background:transparent;color:var(--muted)}
  .nav button:hover,.seg button:hover,.lights button:hover,.scale button:hover{background:inherit}
}
@media(pointer:coarse){
  .btn{min-height:44px;padding:10px 16px}
  .btn.sm,.sm{min-height:38px;padding:8px 12px}
  .field input,.field select,.field textarea,.inp,input,select,textarea{font-size:16px;min-height:44px}
  .field textarea,textarea{min-height:100px}
  .seg button{min-height:46px;font-size:14px}
  .scale{gap:7px;flex-wrap:wrap}
  .scale button{width:44px;height:44px;font-size:16px}
  .lights button{padding:18px 8px;font-size:17px}
  .tick{width:32px;height:32px}
  .chip{padding:9px 15px;font-size:14.5px}
  .link{padding:6px 0;min-height:32px}
  .nav button{padding:12px 12px;font-size:16px}
  td{padding:12px 8px}
  input[type="checkbox"],input[type="radio"]{width:22px;height:22px;min-height:0}
}
@media(max-width:820px){
  .shell.on{flex-direction:column}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
    padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;min-height:56px}
  .topbar .menu{width:44px;height:44px;border:0;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .topbar .menu:active{background:var(--surface2)}
  .topbar .menu i,.topbar .menu i::before,.topbar .menu i::after{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px;position:relative}
  .topbar .menu i::before,.topbar .menu i::after{content:'';position:absolute;left:0}
  .topbar .menu i::before{top:-6px}.topbar .menu i::after{top:6px}
  .topbar .t{flex:1;min-width:0}
  .topbar .t b{display:block;font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

async function writeDoc(path,field,depth,newMap,order){
  const prev=LD[path]||{},pairs=[],J=JSON.stringify,DEL=firebase.firestore.FieldValue.delete();
  const keys=Array.from(new Set(Object.keys(prev).concat(Object.keys(newMap))));
  if(depth===1)keys.forEach(k=>{const a=prev[k],b=newMap[k];if(b===undefined){if(a!==undefined)pairs.push([[field,k],DEL]);}else if(J(a)!==J(b))pairs.push([[field,k],b]);});
  else keys.forEach(d=>{const A=prev[d]||{},B=newMap[d]||{};Array.from(new Set(Object.keys(A).concat(Object.keys(B)))).forEach(k=>{
    if(B[k]===undefined){if(A[k]!==undefined)pairs.push([[field,d,k],DEL]);}else if(A[k]!==B[k])pairs.push([[field,d,k],B[k]]);});});
  const ordJ=order?J(order):null,ordCh=order&&LD[path+'#o']!==ordJ;
  if(!pairs.length&&!ordCh)return;
  await queued(path,async function(){
    const ref=FS.doc(IB()+path),args=[];
    pairs.forEach(p=>{args.push(new firebase.firestore.FieldPath(...p[0]));args.push(p[1]);});
    if(ordCh){args.push(new firebase.firestore.FieldPath('o'));args.push(order);}
    try{await ref.update(...args);}
    catch(e){
      if(e&&(e.code==='not-found'||e.code==='invalid_argument')){const full={};full[field]=newMap;if(order)full.o=order;await ref.set(full);}

        const dates=new Set(Object.keys(prev).concat(Object.keys(val||{})));
        dates.forEach(date=>{

          const p=prev[r.id];
          if(!p||p.j!==j||p.mo!==mo){(by[mo]=by[mo]||{})[r.id]=r;if(p&&p.mo!==mo)(by[p.mo]=by[p.mo]||{})[r.id]=null;}});
        Object.keys(prev).forEach(id=>{if(!L[id])(by[prev[id].mo]=by[prev[id].mo]||{})[id]=null;});
        for(const mo of Object.keys(by))await dbMerge('rev/'+mo,{r:by[mo]});
        LAST[key]=L;return;
      }
    }catch(e){saveFailed(e);return;}
  }
  try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){ toast('אין מקום לשמור בדפדפן'); }
}

async function hash(txt){

  }catch(e){let h=5381;for(let i=0;i<txt.length;i++)h=((h<<5)+h+txt.charCodeAt(i))|0;return 'f'+(h>>>0).toString(16);}

function cleanPhone(v){
  if(v==null)return '';
  let s=String(v).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').trim();
  let d=s.replace(/\D/g,'');
  if(d.indexOf('972')===0)d='0'+d.slice(3);

  return s;
}

function gemVal(t){const V={א:1,ב:2,ג:3,ד:4,ה:5,ו:6,ז:7,ח:8,ט:9,י:10,כ:20,ך:20,ל:30,מ:40,ם:40,נ:50,ן:50,ס:60,ע:70,פ:80,ף:80,צ:90,ץ:90,ק:100,ר:200,ש:300,ת:400};
  return String(t).split('').reduce((a,c)=>a+(V[c]||0),0);}
function birthRaw(s){const x=s.extra||{};const k=Object.keys(x).find(k=>/לידה/.test(k));return k?String(x[k]==null?'':x[k]).trim():'';}
function birthIso(t){
  const mk=(y,mo,d)=>{if(mo<1||mo>12||d<1||d>31||y<1900)return '';const o=new Date(y,mo-1,d,12);return o.getMonth()===mo-1?iso(o):'';};
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return mk(+m[1],+m[2],+m[3]);
  m=t.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2,4})$/);
  if(m){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=y>40?1900:2000;return a<=12&&b>12?mk(y,a,b):mk(y,b,a);}
  if(/^\d{5}$/.test(t)){const o=new Date(Date.UTC(1899,11,30)+(+t)*864e5);return mk(o.getUTCFullYear(),o.getUTCMonth()+1,o.getUTCDate());}
  return '';
}
const HBC={};
function hebBirth(s){
  const raw=birthRaw(s);if(!raw)return null;if(HBC[s.id]&&HBC[s.id].raw===raw)return HBC[s.id].v;
  let v=null;const g=birthIso(raw);
  if(g){const p=hebParts(g);if(p&&p.d)v={d:p.d,m:hmNorm(p.m),y:p.y};}
  else if(/[א-ת]/.test(raw)){ // תאריך עברי שנכתב בכרטיס, למשל ב' חשוון תשע"ו
    const w=raw.replace(/["'׳״]/g,'').split(/\s+/).filter(Boolean),d=gemVal(w[0]);
    for(let i=w.length;i>1;i--){const mm=hmNorm(w.slice(1,i).join(' '));if(HMONTHS.some(x=>x[0]===mm)&&d>=1&&d<=30){v={d:d,m:mm,y:null};break;}}
  }
  HBC[s.id]={raw:raw,v:v};return v;
}
function hbMonthEq(bm,cm){if(bm===cm)return true;if(cm==='אדר')return bm==='אדר א׳'||bm==='אדר ב׳';if(cm==='אדר ב׳')return bm==='אדר';return false;}
function birthdaysAhead(list,days){
  const out=[],cand=[];
  for(let i=0;i<=days;i++){const dt=new Date();dt.setDate(dt.getDate()+i);const d=iso(dt);const pv=new Date(dt);pv.setDate(pv.getDate()-1);
    const p=hebParts(d),q=hebParts(iso(pv));if(p&&p.d)cand.push({i:i,d:d,p:{d:p.d,m:hmNorm(p.m),y:p.y},q:q&&q.d?{d:q.d,m:hmNorm(q.m)}:null});}
  list.forEach(function(s){const b=hebBirth(s);if(!b)return;
    const c=cand.find(c=>(c.p.d===b.d&&hbMonthEq(b.m,c.p.m))||(b.d===30&&c.p.d===1&&c.q&&c.q.d===29&&hbMonthEq(b.m,c.q.m)));
    if(c)out.push({s:s,b:b,i:c.i,d:c.d,age:b.y?c.p.y-b.y:null});});
  return out.sort((a,b)=>a.i-b.i||a.s.name.localeCompare(b.s.name,'he'));
}

function dashWatch(list,today){
  const from=daysAgo(30),out=[];
  list.forEach(function(s){
    const a=attStats(s.id,from,today),r=lastReview(s.id),why=[];let sc=0;
    if(a.total>=6&&a.pct!==null&&a.pct<90){why.push(['absent',a.pct+'% נוכחות']);sc+=(90-a.pct)/5;}
    if(r&&r.light==='red'){why.push(['red','אדום בתמונת מצב']);sc+=4;}

    if(why.length)out.push({s:s,why:why,sc:sc});
  });

}

  // שיעורי היום והסימון שלהם
  const lessons=S.timetable.length?markableLessons(today).slice().sort((a,b)=>a.period-b.period):[];
  const endOf=l=>{const p=periods().find(x=>x.n===l.period);return p&&p.end?p.end:'';};
  const startOf=l=>{const p=periods().find(x=>x.n===l.period);return p&&p.start?p.start:'';};
  const lst=lessons.map(l=>{const m=lessonMarked(today,l),e=endOf(l),st=startOf(l);
    return {l:l,m:m,state:m.done?'done':m.m?'part':(e&&e<=hm)?'miss':(st&&st<=hm)?'now':'wait'};});
  const missed=lst.filter(x=>x.state==='miss'||(x.state==='part'&&endOf(x.l)<=hm));
  if(missed.length)alerts.push({t:'נוכחות',x:missed.length+' שיעורים שהסתיימו היום ועוד לא סומנה בהם נוכחות מלאה',act:'goto-mark'});
  if(!S.timetable.length)myClasses().forEach(function(cls){
    const inC=list.filter(s=>s.cls===cls),m=inC.filter(s=>day[s.id]).length;
    if(inC.length&&m<inC.length)alerts.push({t:'נוכחות',x:cls+' — טרם סומנה היום ('+m+'/'+inC.length+')',act:'goto-mark',cls:cls});
  });
  const op=S.events.filter(e=>e.kind==='neg'&&e.sev>=2&&!e.handled&&canHandle(e));
  op.filter(e=>e.sev>=3).slice(0,4).forEach(e=>alerts.unshift({t:'אירוע חמור',x:((studentById(e.sid)||{}).name||e.sname||'')+' — '+(e.typeName||'')+' ('+shortDate(e.date)+')',act:'card',id:e.sid}));
  if(op.length)alerts.push({t:'אירועים',x:op.length+' אירועים ממתינים לטיפול',act:'goto-events'});
  const overdue=myTasks().filter(t=>t.status!=='done'&&t.due&&t.due<today);
  if(overdue.length)alerts.push({t:'משימות',x:overdue.length+' משימות באיחור',act:'goto-tasks'});
  const stale=list.filter(function(s){const r=lastReview(s.id);return !r||r.date<daysAgo(21);});
  if(stale.length&&list.length)alerts.push({t:'תמונת מצב',x:stale.length+' תלמידים ללא תמונת מצב מעל שלושה שבועות',act:'goto-review'});

  const hasBD=list.some(s=>birthRaw(s)),bds=hasBD?birthdaysAhead(list,7):[];
  const watch=dashWatch(list,today);
  const trend=dashTrend(list);
  const wk=daysAgo(7),evW=S.events.filter(e=>e.date>=wk),posW=evW.filter(e=>e.kind==='pos'),negW=evW.length-posW.length;
  const openTasks=myTasks().filter(t=>t.status!=='done').sort((a,b)=>(a.due||'9999')<(b.due||'9999')?-1:1);
  const lastMt=(S.meetings||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0];
  const recent=S.reviews.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,5);
  const h=new Date().getHours(),greet=h<12?'בוקר טוב':h<17?'צהריים טובים':'ערב טוב';
  const nm=S.me.teacher||S.me.user||'';
  const stuLink=(id,name)=>S.students.some(s=>s.id===id)?'<button class="link" data-act="card" data-id="'+id+'">'+esc(name)+'</button>':'<b>'+esc(name)+'</b>';
  const card=(title,body,more)=>'<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">'+title+'</h3>'+(more||'')+'</div>'+body+'</div>';

  // נוכחות לפי כיתה היום
  const classes=myClasses().filter(cl=>list.some(s=>s.cls===cl));
  const clsRows=classes.map(function(cl){const st=list.filter(s=>s.cls===cl);let p=0,m=0,ab=0;
    st.forEach(s=>{const v=dayStatus(s.id,today);if(!v)return;m++;if(v==='present'||v==='late')p++;else if(v==='absent')ab++;});
    const pct=m?Math.round(p/m*100):null;
    return '<div class="dcls"><b>'+esc(cl)+'</b><div class="bar" style="flex:1"><i style="width:'+(pct||0)+'%" data-low="'+(pct===null?0:pct<80?2:pct<90?1:0)+'"></i></div>'+
      '<span class="note" style="min-width:110px;text-align:left">'+(m?pct+'% · '+ab+' חסרים':'טרם סומן')+'</span></div>';}).join('');

  const stIcon={done:['present','✓ סומן'],part:['late','חלקי'],miss:['absent','לא סומן'],now:['admin','מתקיים עכשיו'],wait:['excused','בהמשך']};
  const lessonRows=lst.filter(x=>!adm||x.state!=='done'&&x.state!=='wait').map(x=>{const l=x.l,i=stIcon[x.state];
    return '<div class="alert"><b style="min-width:20px">'+l.period+'</b><span style="flex:1">'+esc(l.subject)+' <span class="note">· '+esc((l.classes||[]).join(', '))+(l.teacher&&l.teacher!==S.me.teacher?' · '+esc(l.teacher):'')+'</span></span>'+
      '<span class="tag" data-s="'+i[0]+'">'+i[1]+(x.state==='part'?' '+x.m.m+'/'+x.m.n:'')+'</span>'+
      (adm&&l.teacher&&x.state!=='now'?'<button class="btn sm" data-v="ghost" data-act="rem-lesson" data-id="'+l.id+'" title="תזכורת למורה">🔔</button>':'')+
      '<button class="btn sm" data-v="ghost" data-act="dash-lesson" data-id="'+l.id+'">סימון</button></div>';}).join('');
  const missT={};if(adm)missed.forEach(x=>{if(x.l.teacher)missT[x.l.teacher]=(missT[x.l.teacher]||0)+1;});
  const missTL=Object.keys(missT).sort((a,b)=>missT[b]-missT[a]);

  const trendBox=trend.length>1?'<div class="dtrend">'+trend.map(t=>'<div title="'+esc(dual(t.d))+': '+t.pct+'%"><span class="note">'+t.pct+'</span><i style="height:'+Math.max(4,t.pct)+'%" data-low="'+(t.pct<80?2:t.pct<90?1:0)+'"></i><em>'+esc((hebShort(t.d)||'').split(' ')[0]||t.d.slice(8))+'</em></div>').join('')+'</div>':'<p class="note">יוצג אחרי שיירשמו כמה ימי נוכחות.</p>';

  return printHead()+
   '<div class="dhero"><div><div class="note" style="font-size:15px">'+greet+(nm?', '+esc(nm):'')+'</div><h2 style="margin:2px 0">'+gregLabel(today)+'</h2><div class="hebdate">'+hebLabel(today)+'</div>'+
     (S.timetable.length?'<div class="dnow">'+esc(dashNow())+'</div>':'')+'</div>'+
     '<div class="row dquick"><button class="btn" data-v="primary" data-act="goto-mark">נוכחות</button><button class="btn" data-act="dash-ev">+ דיווח אירוע</button>'+
     '<button class="btn" data-act="goto-review">תמונת מצב</button><button class="btn" data-act="goto-tasks">+ משימה</button>'+refreshBtn()+
     (adm?'<button class="btn" data-act="rem-new">🔔 תזכורת למורה</button>':'')+'</div></div>'+
   (S.remc&&adm?remComposer():'')+
   '<div class="grid g4" style="margin-bottom:14px">'+
     stat(pctToday===null?'—':pctToday+'%','נוכחות היום: '+(c.present+c.late)+' נוכחים מתוך '+list.length+' תלמידים'+(c.none&&marked?' · '+c.none+' עדיין לא סומנו':''),pctToday!==null&&pctToday<85?'var(--late)':'var(--present)')+
     stat(c.absent,'חיסורים היום'+(c.late?' · '+c.late+' איחורים':''),c.absent?'var(--absent)':'')+
     stat('<span style="color:var(--present)">'+posW.length+'</span> / <span style="color:var(--late)">'+negW+'</span>','אירועים השבוע: לשבח / לשיפור','')+
     stat(openTasks.length,'המשימות הפתוחות שלי'+(overdue.length?' · '+overdue.length+' באיחור':''),overdue.length?'var(--absent)':'')+'</div>'+
   card('מה דורש התייחסות',alerts.length?alerts.slice(0,10).map(function(a){
       return '<div class="alert"><b class="note" style="min-width:82px">'+a.t+'</b><span style="flex:1">'+esc(a.x)+'</span>'+
       '<button class="btn sm" data-v="ghost" data-act="'+a.act+'"'+(a.id?' data-id="'+a.id+'"':'')+(a.cls?' data-cls="'+esc(a.cls)+'"':'')+'>פתיחה</button></div>';
     }).join(''):'<div class="empty">הכול תקין. אין התראות פתוחות. 👍</div>')+
   '<div class="grid g2">'+
     (hasBD?card('ימי הולדת השבוע 🎂',bds.length?bds.map(x=>'<div class="alert"'+(x.i===0?' style="background:var(--accent-soft);border-radius:10px;padding:8px 10px"':'')+'>'+
         '<span style="flex:1">'+stuLink(x.s.id,x.s.name)+' <span class="note">'+esc(x.s.cls)+'</span></span>'+
         '<span><b>'+gem(x.b.d)+' ב'+esc(x.b.m)+'</b>'+(x.age?' <span class="note">· '+(x.s.gender==='f'?'בת ':'בן ')+x.age+'</span>':'')+'</span>'+
         '<span class="note" style="min-width:70px;text-align:left">'+(x.i===0?'<b style="color:var(--accent)">היום!</b>':x.i===1?'מחר':'יום '+(DAYS[dow(x.d)]||'שבת'))+'</span></div>').join('')
       :'<div class="empty">אין ימי הולדת בשבוע הקרוב.</div>','<button class="btn sm" data-v="ghost" data-act="goto-bdays">לכל ימי ההולדת</button>'):'')+
     (lst.length?card(adm?'שיעורים שטרם סומנו היום':'השיעורים היום',(lessonRows||'<div class="empty">כל השיעורים שהתקיימו עד עכשיו סומנו. 👍</div>')+
       (missTL.length?'<div style="margin-top:10px"><span class="note" style="color:var(--absent)">טרם סימנו (לחיצה שולחת תזכורת):</span><div class="row" style="gap:6px;margin-top:6px">'+
         missTL.map(t=>'<button class="chip" data-act="rem-teacher" data-t="'+esc(t)+'">🔔 '+esc(t)+' ('+missT[t]+')</button>').join('')+'</div></div>':''),
       '<span class="note">'+lst.filter(x=>x.state==='done').length+'/'+lst.length+' סומנו</span>'):'')+
     (classes.length?card('נוכחות לפי כיתה היום',clsRows):'')+
     card('מגמת נוכחות','<p class="note" style="margin-bottom:6px">אחוז נוכחות בימים האחרונים שנרשמו</p>'+trendBox)+
     card('תלמידים במעקב',watch.length?watch.slice(0,7).map(w=>'<div class="alert" style="flex-wrap:wrap">'+stuLink(w.s.id,w.s.name)+' <span class="note">'+esc(w.s.cls)+'</span><span style="flex:1"></span>'+
       w.why.map(x=>'<span class="tag" data-s="'+x[0]+'">'+esc(x[1])+'</span>').join(' ')+'</div>').join('')+(watch.length>7?'<p class="note" style="margin-top:6px">ועוד '+(watch.length-7)+' תלמידים.</p>':'')
       :'<div class="empty">אין תלמידים שדורשים מעקב כרגע.</div>')+
     card('אירועים אחרונים',(evW.length?evW.slice().sort((a,b)=>(b.date+(b.time||''))>(a.date+(a.time||''))?1:-1).slice(0,6).map(e=>'<div class="alert"><span class="tag" data-s="'+(e.kind==='pos'?'present':e.sev>=3?'absent':'late')+'">'+esc(e.typeName||'')+'</span>'+
         '<span style="flex:1">'+stuLink(e.sid,(studentById(e.sid)||{}).name||e.sname||'')+' <span class="note">'+esc(e.cls||'')+'</span></span><span class="note">'+shortDate(e.date)+'</span></div>').join('')
       :'<div class="empty">לא דווחו אירועים השבוע.</div>')+
       (posW.length?'<p style="margin-top:8px"><b style="color:var(--present)">לשבח השבוע:</b> '+Array.from(new Set(posW.map(e=>(studentById(e.sid)||{}).name||e.sname))).map(esc).join(', ')+'</p>':''),
       '<button class="btn sm" data-v="ghost" data-act="goto-events-all">לכל האירועים</button>')+
     card('משימות קרובות',(openTasks.length?openTasks.slice(0,5).map(t=>'<div class="alert"><span style="flex:1">'+esc(t.text)+'</span><span class="note"'+(t.due&&t.due<today?' style="color:var(--absent)"':'')+'>'+(t.due?shortDate(t.due):'')+'</span></div>').join('')
       :'<div class="empty">אין משימות פתוחות.</div>'),'<button class="btn sm" data-v="ghost" data-act="goto-tasks">ליומן</button>')+
     (lastMt?card('ישיבת הצוות האחרונה','<b>'+esc(lastMt.title||'ישיבת צוות')+'</b> <span class="note">'+esc(dual(lastMt.date))+'</span>'+
       (lastMt.dec?'<div style="margin-top:6px"><span class="note">החלטות ומשימות:</span><div style="white-space:pre-wrap;max-height:9em;overflow:hidden">'+esc(lastMt.dec)+'</div></div>':''),
       '<button class="btn sm" data-v="ghost" data-act="goto-meetings">לפרוטוקולים</button>'):'')+
     card('תמונות מצב אחרונות',recent.length?recent.map(function(r){
       const s=studentById(r.studentId);
       return '<div class="alert"><span class="tag" data-s="'+r.light+'">'+LIGHTNAME[r.light]+'</span>'+
       '<button class="link" style="flex:1" data-act="card" data-id="'+r.studentId+'">'+esc(s?s.name:'—')+'</button>'+
       '<span class="note">'+shortDate(r.date)+'</span></div>';
     }).join(''):'<div class="empty">עוד לא נרשמו תמונות מצב.</div>')+
   '</div>';
}

/* ================= תמונת מצב ================= */
function viewReview(){
  if(S.revIdx===null)return reviewSetup();
  const s=S.revList[S.revIdx];
  if(!s)return reviewDone();
  const d=S.revDraft||{light:'',scores:{},note:''};
  const prev=reviewsOf(s.id).filter(r=>r.date<S.revDate).slice(-1)[0];
  const hist=reviewsOf(s.id).slice(-5);
  const a=attStats(s.id,daysAgo(30),iso(new Date()));

  return '<div class="head"><div><h2>תמונת מצב</h2><div class="sub">'+esc(S.revCls)+' · '+dual(S.revDate)+'</div></div>'+
    '<button class="btn" data-v="ghost" data-act="rev-exit">סיום הסבב</button></div>'+
    '<div class="prog"><i style="width:'+Math.round((S.revIdx)/S.revList.length*100)+'%"></i></div>'+
    '<div class="rev-wrap"><div class="card">'+
      '<div class="row" style="justify-content:space-between;align-items:flex-start">'+
        '<div><div class="rev-name">'+esc(s.name)+'</div>'+
        '<div class="note">תלמיד '+(S.revIdx+1)+' מתוך '+S.revList.length+
        (a.pct!==null?' · נוכחות חודשית '+a.pct+'%':'')+'</div></div>'+
        '<button class="btn sm" data-v="ghost" data-act="card" data-id="'+s.id+'">כרטיס מלא</button></div>'+

      '<div class="lights">'+LIGHTS.map(l=>'<button data-act="rev-light" data-l="'+l[0]+'" data-on="'+(d.light===l[0]?1:0)+'">'+l[1]+'</button>').join('')+'</div>'+

      domains().map(function(dom){
        const v=d.scores[dom.id]||0;
        const pv=prev&&prev.scores?prev.scores[dom.id]:null;
        let delta='';
        if(pv&&v){const diff=v-pv;delta=diff>0?'<i style="color:var(--green)">▲ '+diff+'</i>':diff<0?'<i style="color:var(--red)">▼ '+(-diff)+'</i>':'<i>=</i>';}
        else if(pv)delta='<i>קודם '+pv+'</i>';
        return '<div class="dom"><div class="dom-label">'+esc(dom.name)+' '+delta+'</div><div class="scale">'+
          [1,2,3,4,5].map(n=>'<button data-act="rev-score" data-d="'+dom.id+'" data-n="'+n+'" data-on="'+(v===n?1:0)+'">'+n+'</button>').join('')+
          '</div></div>';
      }).join('')+

      '<label class="field" style="margin-top:14px"><span>הערה מהשיחה</span>'+
      '<textarea id="revNote" data-in="revNote" placeholder="מה עלה בשיחה, מה לעקוב אחריו, מה לעשות">'+esc(d.note)+'</textarea></label>'+

      '<div class="row"><button class="btn big" data-v="primary" data-act="rev-next">שמירה והבא</button>'+
      '<button class="btn" data-act="rev-skip">דילוג</button>'+
      (S.revIdx>0?'<button class="btn" data-v="ghost" data-act="rev-back">הקודם</button>':'')+
      ((d.light||d.note||Object.keys(d.scores).length)?'<button class="btn" data-v="ghost" data-act="rev-clear">ניקוי הסימונים</button>':'')+
      (S.reviews.some(r=>S.revList[S.revIdx]&&r.studentId===S.revList[S.revIdx].id&&r.date===S.revDate)?'<button class="btn" data-v="danger" data-act="rev-del" style="margin-right:auto">מחיקת תמונת המצב</button>':'')+'</div>'+
      '<p class="note" style="margin-top:8px">לחיצה נוספת על צבע או ציון שכבר נבחר מבטלת אותו.</p>'+
    '</div>'+

    '<div><div class="card"><h3 style="margin-bottom:8px">בפעם הקודמת</h3>'+
      (prev?'<div class="prev"><div class="row" style="justify-content:space-between;margin-bottom:8px">'+
        '<span class="tag" data-s="'+prev.light+'">'+LIGHTNAME[prev.light]+'</span><span class="note">'+shortDate(prev.date)+'</span></div>'+
        domains().map(function(dm){return prev.scores&&prev.scores[dm.id]?('<div>'+esc(dm.name)+': <b>'+prev.scores[dm.id]+'</b></div>'):'';}).join('')+
        (prev.note?'<p style="margin:8px 0 0">'+esc(prev.note)+'</p>':'')+'</div>'
        :'<p class="note">זו תמונת המצב הראשונה שלו.</p>')+
      (hist.length>1?'<div style="margin-top:12px"><div class="note" style="margin-bottom:5px">חמש האחרונות</div><div class="dots">'+
        hist.map(h=>'<i data-l="'+h.light+'" title="'+shortDate(h.date)+'"></i>').join('')+'</div></div>':'')+
    '</div>'+
    '<div class="card"><h3 style="margin-bottom:8px">נוכחות בחודש</h3>'+
      (a.total?'<div class="note">נוכח '+a.present+' · איחר '+a.late+' · חיסר '+a.absent+
      '</div><div class="bar" style="margin-top:8px"><i style="width:'+a.pct+'%" data-low="'+(a.pct<80?2:a.pct<90?1:0)+'"></i></div>'
      :'<p class="note">אין נתוני נוכחות.</p>')+'</div></div></div>';
}
function reviewSetup(){
  const list=myStudents().filter(s=>s.cls===S.revCls);
  const doneToday=S.reviews.filter(r=>r.date===S.revDate).map(r=>r.studentId);
  return '<div class="head"><div><h2>תמונת מצב</h2><div class="sub">סבב שבועי — תלמיד אחרי תלמיד</div></div></div>'+
    '<div class="card"><div class="grid g2">'+
      '<label class="field"><span>כיתה</span><select data-ch="revCls">'+myClasses().map(c=>opt(c,c,S.revCls)).join('')+'</select></label>'+
      '<label class="field"><span>תאריך הסבב</span><input type="date" data-ch="revDate" value="'+S.revDate+'"></label></div>'+
      (list.length?'<div class="row"><button class="btn big" data-v="primary" data-act="rev-start">התחלת הסבב ('+list.length+' תלמידים)</button>'+
        (doneToday.length?'<span class="note">'+doneToday.filter(id=>list.some(s=>s.id===id)).length+' כבר נרשמו בתאריך הזה</span>':'')+'</div>'
        :'<div class="empty">אין תלמידים בכיתה הזו.</div>')+'</div>'+
    (list.length?'<div class="card"><h3>מצב נוכחי בכיתה</h3>'+
      table(['תלמיד','אחרון','תאריך','נוכחות',''],list.map(function(s){
        const r=lastReview(s.id),a=attStats(s.id,daysAgo(30),iso(new Date()));
        return ['<b>'+esc(s.name)+'</b>',
          r?'<span class="tag" data-s="'+r.light+'">'+LIGHTNAME[r.light]+'</span>':'<span class="note">—</span>',
          r?shortDate(r.date):'<span class="note">מעולם</span>',
          a.pct!==null?a.pct+'%':'—',
          '<button class="btn sm" data-v="ghost" data-act="rev-one" data-id="'+s.id+'">רק אותו</button>'+
          '<button class="btn sm" data-v="ghost" data-act="card" data-id="'+s.id+'">כרטיס</button>'];
      }))+'</div>':'');
}
function reviewDone(){
  return '<div class="head"><h2>הסבב הושלם</h2></div><div class="card"><div class="empty">'+
    '<p style="font-size:17px;color:var(--ink)">נרשמו '+S.revDone+' תמונות מצב ל'+esc(S.revCls)+'.</p>'+
    '<button class="btn" data-v="primary" data-act="rev-exit">חזרה</button></div></div>';
}

/* ================= כרטיס תלמיד ================= */
function viewCard(){
  const s=studentById(S.cardId);
  if(!s)return '<div class="empty">התלמיד לא נמצא.</div>';
  if(!canSeeStudent(s.id))return '<div class="empty">כרטיס התלמיד זמין רק למחנך הכיתה ולמנהל.</div>';
  const revs=reviewsOf(s.id).slice().reverse();
  const a30=attStats(s.id,daysAgo(30),iso(new Date()));
  const aAll=attStats(s.id,'2000-01-01','2100-01-01');
  const last=revs[0];
  const trend=domains().map(function(d){
    const vals=revs.slice(0,4).map(r=>r.scores&&r.scores[d.id]).filter(Boolean);
    return {name:d.name,now:vals[0]||null,prev:vals[1]||null};
  });
  return printHead()+'<div class="head"><div><h2>'+esc(s.name)+'</h2><div class="sub">'+esc(s.cls)+
    (last?' · '+LIGHTNAME[last.light]+' מ־'+shortDate(last.date):'')+'</div></div>'+
    '<div class="row"><button class="btn" data-v="ghost" data-act="goto-students">חזרה</button>'+
    '<button class="btn" data-act="print">הדפסה</button>'+
    (isAdmin()?'<button class="btn" data-act="student-edit" data-id="'+s.id+'">עריכת פרטים</button>':'')+'</div></div>'+
    '<div class="grid g3" style="margin-bottom:14px">'+
      stat(a30.pct!==null?a30.pct+'%':'—','נוכחות בחודש האחרון',a30.pct!==null&&a30.pct<85?'var(--late)':'')+
      stat(aAll.absent,'חיסורים מצטברים','')+
      stat(aAll.late,'איחורים מצטברים','')+
      stat(revs.length,'תמונות מצב','')+'</div>'+
    '<div class="grid g2">'+
    '<div class="card"><h3>פרטי קשר</h3>'+
      (isAdmin()?(s.parentCheck?'<div class="warn" style="margin-bottom:10px">לא בטוח מי האב ומי האם. בדקו את הטבלה:<div class="row" style="margin-top:8px"><button class="btn sm" data-v="primary" data-act="parents-ok" data-id="'+s.id+'">נכון, האב והאם במקום</button><button class="btn sm" data-act="parents-swap" data-id="'+s.id+'">החלפה בין ההורים</button></div></div>':''):'')+
      table(['','שם','טלפון'],[
        ['<span class="note">אב</span>',esc(s.father||'—'),s.fatherPhone?'<span class="ltr">'+esc(s.fatherPhone)+'</span>':'—'],
        ['<span class="note">אם</span>',esc(s.mother||'—'),s.motherPhone?'<span class="ltr">'+esc(s.motherPhone)+'</span>':'—']])+
      (s.notes?'<p class="note" style="margin-top:10px">'+esc(s.notes)+'</p>':'')+
      (hebBirth(s)?'<p style="margin-top:10px">🎂 <b>יום הולדת עברי:</b> '+gem(hebBirth(s).d)+' ב'+esc(hebBirth(s).m)+'</p>':'')+
      (s.extra&&Object.keys(s.extra).length?'<h3 style="margin-top:16px">פרטים נוספים</h3>'+table(['',''],Object.keys(s.extra).map(k=>['<span class="note">'+esc(k)+'</span>',esc(s.extra[k])])):'')+'</div>'+
    '<div class="card"><h3>מגמה לפי תחום</h3>'+
      (last?trend.map(function(t){
        let d='';
        if(t.now&&t.prev){const x=t.now-t.prev;d=x>0?'<span style="color:var(--green)">▲</span>':x<0?'<span style="color:var(--red)">▼</span>':'<span class="note">=</span>';}
        return '<div class="dom"><div class="dom-label">'+esc(t.name)+'</div><div>'+(t.now?'<b style="font-size:18px">'+t.now+'</b> '+d:'<span class="note">—</span>')+'</div></div>';
      }).join(''):'<p class="note">עוד לא נרשמה תמונת מצב.</p>')+'</div></div>'+
    cardGroupsSection(s)+
    cardAttSection(s)+
    cardGradesSection(s)+
    evCardSection(s)+
    '<div class="card brk"><h3>היסטוריית תמונות מצב</h3>'+
      (revs.length?'<div class="tl">'+revs.map(function(r){
        return '<div class="tl-item" data-l="'+r.light+'"><div class="tl-date" style="display:flex;justify-content:space-between;gap:8px"><span>'+dual(r.date)+(r.ts&&iso(new Date(r.ts))===r.date?' · <b>'+hmOf(r.ts)+'</b>':'')+' · '+esc(r.by||'')+(r.ts&&iso(new Date(r.ts))!==r.date?' · נרשם '+esc(tsLine(r.ts)):'')+'</span><button class="link" style="color:var(--muted);font-weight:500;font-size:12.5px" data-act="rev-del-id" data-id="'+r.id+'">מחיקה</button></div>'+
        '<div class="row" style="gap:6px;margin:4px 0"><span class="tag" data-s="'+r.light+'">'+LIGHTNAME[r.light]+'</span>'+
        domains().map(function(d){return r.scores&&r.scores[d.id]?'<span class="note">'+esc(d.name)+' '+r.scores[d.id]+'</span>':'';}).join(' · ')+'</div>'+
        (r.note?'<div>'+esc(r.note)+'</div>':'')+'</div>';
      }).join('')+'</div>':'<div class="empty">אין עדיין רישומים.</div>')+'</div>';
}



function decorateDates(){
  document.querySelectorAll('#main input[type="date"]').forEach(function(inp){
    let h=inp.nextElementSibling;
    if(!h||!h.classList.contains('hd')){h=document.createElement('small');h.className='hd';inp.insertAdjacentElement('afterend',h);}
    h.textContent=inp.value?hebLabel(inp.value):'';
  });
}
document.addEventListener('input',function(e){const t=e.target;if(t&&t.type==='date'){const h=t.nextElementSibling;if(h&&h.classList.contains('hd'))h.textContent=t.value?hebLabel(t.value):'';}});

/* ================= משתמשים: יצירה מרוכזת, קודים, הצטרפות ================= */
const SITE_URL='https://nihul-mosad.github.io/nihul-mosad/';
const FB_DOMAINS='nihul-mosad.github.io\nfirestore.googleapis.com\nidentitytoolkit.googleapis.com\nsecuretoken.googleapis.com';
function newPin(){const a=new Uint32Array(1);crypto.getRandomValues(a);return String(100000+a[0]%900000);}
function newToken(){const a=new Uint8Array(15);crypto.getRandomValues(a);return Array.from(a).map(b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');}
function intlPhone(p){const d=String(p||'').replace(/\D/g,'');return d.indexOf('0')===0?'972'+d.slice(1):d;}
function credMsg(c){
  return 'שלום '+(c.teacher||c.user)+',\n\nמעכשיו מסמנים נוכחות ועוקבים אחרי התלמידים במערכת ניהול המוסד.\n\nקישור: '+SITE_URL+'\nקוד מוסד: '+S.inst+'\nשם משתמש: '+c.user+'\nקוד כניסה: '+c.pin+
    '\n\nאחרי הכניסה אפשר להחליף את הקוד לסיסמה משלכם (בתפריט: "החלפת סיסמה").\nכדאי לסמן "להישאר מחובר", וכך מקלידים את הפרטים רק פעם אחת. בטלפון אפשר להוסיף למסך הבית מהתפריט של כרום.\n\nמי שמסונן בנטפרי צריך לבקש לפתוח את הכתובות:\n'+FB_DOMAINS;
}
function teacherPhone(t){const x=S.staff.find(s=>s.name===t);return x?x.phone:'';}
function bulkForm(){
  const b=S.bulk;
  if(!b.list.length)return '<div class="card" style="margin-top:12px;background:var(--surface2)"><p class="note">לכל המורים במערכת השעות כבר יש משתמש.</p><div class="row" style="margin-top:8px"><button class="btn" data-act="bulk-close">סגירה</button></div></div>';
  return '<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:14px"><h3>יצירת משתמשים למורים</h3>'+
    '<p class="note" style="margin-bottom:10px">אלה המורים ממערכת השעות שעוד אין להם משתמש. לכל אחד ייווצר קוד כניסה בן 6 ספרות. אפשר לשנות את שם המשתמש לפני היצירה.</p>'+
    table(['','מורה','שם משתמש'],b.list.map((x,i)=>['<input type="checkbox" data-bk="'+i+'"'+(x.on?' checked':'')+' style="width:20px;height:20px">',esc(x.teacher),
      '<input class="inp" data-bku="'+i+'" value="'+esc(x.user)+'" style="width:100%;min-width:140px">']))+
    '<div class="row" style="margin-top:12px"><button class="btn" data-v="primary" data-act="bulk-run">יצירת '+b.list.filter(x=>x.on).length+' משתמשים</button><button class="btn" data-v="ghost" data-act="bulk-close">ביטול</button></div></div>';
}
function credsCard(){
  return '<div class="card" style="border-color:var(--gold)"><h3>פרטי כניסה לשליחה</h3><p class="note" style="margin-bottom:10px;color:var(--late)">הקודים מוצגים עכשיו בלבד ולא נשמרים בשום מקום. שלחו לכל אחד את הפרטים שלו לפני שסוגרים את החלון.</p>'+
    table(['מורה','שם משתמש','קוד',''],S.creds.map((c,i)=>{const ph=intlPhone(teacherPhone(c.teacher));
      return [esc(c.teacher||'—'),'<b>'+esc(c.user)+'</b>','<b class="ltr" style="font-size:16px;letter-spacing:.08em">'+esc(c.pin)+'</b>',
      '<a class="btn sm" target="_blank" rel="noreferrer" href="https://wa.me/'+(ph||'')+'?text='+encodeURIComponent(credMsg(c))+'">וואטסאפ</a> <button class="btn sm" data-act="cred-copy" data-i="'+i+'">העתקה</button>'];}))+
    '<div class="row" style="margin-top:12px"><button class="btn" data-act="cred-copyall">העתקת הכול</button><button class="btn" data-v="ghost" data-act="cred-close">סיימתי, סגירה</button></div></div>';
}
function joinCard(){
  const tk=S.config.joinToken,link=tk?SITE_URL+'?join='+tk:'';
  return '<div class="card"><h3>קישור הצטרפות לצוות</h3><p class="note" style="margin-bottom:10px">שולחים קישור אחד לקבוצת הצוות. כל מורה בוחר את שמו, קובע לעצמו סיסמה, ואתם מאשרים אותו כאן בלחיצה. מתאים במיוחד למורים חדשים במהלך השנה.</p>'+
    (tk?'<div class="row" style="margin-bottom:10px"><input class="inp" dir="ltr" readonly value="'+esc(link)+'" style="flex:1;min-width:220px"></div>'+
      '<div class="row"><button class="btn" data-act="join-copy">העתקת הקישור</button><a class="btn" target="_blank" rel="noreferrer" href="https://wa.me/?text='+encodeURIComponent('הצטרפות למערכת ניהול המוסד של '+S.config.name+':\n'+link+'\n\nבוחרים את השם שלכם, קובעים סיסמה, ואחרי אישור המנהל אפשר להיכנס.')+'">שליחה בוואטסאפ</a>'+
      '<button class="btn" data-act="join-new">קישור חדש</button><button class="btn" data-v="danger" data-act="join-off">ביטול הקישור</button></div>'+
      '<p class="note" style="margin-top:8px">קישור חדש מבטל את הקודם. אחרי שכל הצוות הצטרף, אפשר לבטל את הקישור.</p>'
      :'<button class="btn" data-v="primary" data-act="join-new">יצירת קישור הצטרפות</button>')+'</div>';
}
function requestsCard(){
  if(!S.joinReqs){S.joinReqs=[];FS.collection('insts/'+S.inst+'/requests').get().then(q=>{S.joinReqs=q.docs.map(d=>Object.assign({uid:d.id},d.data()));if(S.tab==='settings'&&S.joinReqs.length)render();}).catch(()=>{});}
  if(!S.joinReqs.length)return '';
  return '<div class="card" style="border-color:var(--accent)"><h3>בקשות הצטרפות ממתינות ('+S.joinReqs.length+')</h3>'+
    table(['שם','שם משתמש','מורה במערכת','הרשאה',''],S.joinReqs.map((r,i)=>[esc(r.name||r.teacher||''),'<b>'+esc(r.user)+'</b>',
      '<select class="inp" id="jr-t-'+i+'">'+opt('—','',r.teacher||'')+teachersList().map(t=>opt(t,t,r.teacher||'')).join('')+'</select>',
      '<select class="inp" id="jr-r-'+i+'">'+opt('מורה','teacher','teacher')+opt('מנהל','admin','teacher')+'</select>',
      '<button class="btn sm" data-v="primary" data-act="jr-ok" data-i="'+i+'">אישור</button> <button class="btn sm" data-v="ghost" data-act="jr-no" data-i="'+i+'">דחייה</button>']))+'</div>';
}
function logCard(){
  if(!S.instLog){S.instLog=[];FS.collection('insts/'+S.inst+'/log').orderBy('ts','desc').limit(60).get().then(q=>{S.instLog=q.docs.map(d=>d.data());if(S.tab==='settings')render();}).catch(()=>{S.instLog=[{err:1}];});}
  return '<div class="card"><h3>יומן פעולות</h3>'+(S.instLog.length&&!S.instLog[0].err?logTable(S.instLog,false):'<p class="note">'+(S.instLog[0]&&S.instLog[0].err?'היומן יופעל אחרי עדכון חוקי האבטחה.':'עוד אין פעולות ביומן.')+'</p>')+'</div>';
}
function tsLabel(ts){const d=new Date(ts),i=iso(d);return shortDate(i)+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function logTable(rows,withInst){
  return table(['מתי'].concat(withInst?['מוסד']:[]).concat(['מי','פעולה','פרטים']),rows.map(r=>['<span class="note" style="white-space:nowrap">'+tsLabel(r.ts)+'</span>'].concat(withInst?[esc(r.instName||r.inst||'')]:[]).concat([esc(r.user||''),'<b>'+esc(r.act||'')+'</b>','<span class="note">'+esc(r.info||'')+'</span>'])));
}
async function userAction(a,el){
  if(a==='bulk-open'){
    const linked={};S.config.users.forEach(u=>{if(u.teacher)linked[u.teacher]=1;});
    S.bulk={list:teachersList().filter(t=>!linked[t]).map(t=>({teacher:t,user:t,on:true}))};S.editUser=null;return render();
  }
  if(a==='bulk-close'){S.bulk=null;return render();}
  if(a==='bulk-run'){
    document.querySelectorAll('#main [data-bku]').forEach(inp=>{S.bulk.list[+inp.dataset.bku].user=inp.value.trim();});
    const todo=S.bulk.list.filter(x=>x.on&&x.user);if(!todo.length)return toast('לא נבחרו מורים');
    const taken={};S.config.users.forEach(u=>taken[ukey(u.user)]=1);
    for(const x of todo){if(taken[ukey(x.user)])return toast('שם המשתמש "'+x.user+'" כבר קיים');taken[ukey(x.user)]=1;}
    const out=[];let i=0;
    for(const x of todo){
      i++;toast('יוצר '+i+' מתוך '+todo.length+'…');
      try{
        const pin=newPin(),r=await createAuthUser(S.inst,x.user,pin),b=FS.batch();
        b.set(FS.doc('insts/'+S.inst+'/members/'+r.uid),{user:x.user,role:'teacher',cls:'',teacher:x.teacher,active:true});
        b.set(FS.doc('logins/'+S.inst+'_'+ukey(x.user)),{email:r.email,inst:S.inst,key:ukey(x.user)});
        await b.commit();out.push({teacher:x.teacher,user:x.user,pin:pin});
      }catch(e){toast(x.user+': '+fbErr(e));break;}
    }
    await reloadMembers();S.bulk=null;S.creds=out;logAct('יצירת משתמשים',out.length+' מורים');
    toast(out.length+' משתמשים נוצרו');return render();
  }
  if(a==='user-pin'){
    const u=S.config.users.find(x=>x.id===el.dataset.id);if(!u)return;
    if(!confirm('ליצור קוד כניסה חדש ל"'+u.user+'"? הקוד הקודם יפסיק לעבוד.'))return;
    try{
      const pin=newPin(),r=await createAuthUser(S.inst,u.user,pin),b=FS.batch();
      b.delete(FS.doc('insts/'+S.inst+'/members/'+u.id));
      b.set(FS.doc('insts/'+S.inst+'/members/'+r.uid),{user:u.user,role:u.role,cls:'',teacher:u.teacher||'',active:true});
      b.set(FS.doc('logins/'+S.inst+'_'+ukey(u.user)),{email:r.email,inst:S.inst,key:ukey(u.user)});
      await b.commit();await reloadMembers();S.creds=[{teacher:u.teacher,user:u.user,pin:pin}];logAct('קוד כניסה חדש',u.user);return render();
    }catch(e){return toast(fbErr(e));}
  }
  if(a==='cred-copy'){const c=S.creds[+el.dataset.i];try{await navigator.clipboard.writeText(credMsg(c));toast('הועתק');}catch(e){toast('ההעתקה לא הצליחה');}return;}
  if(a==='cred-copyall'){const t=S.creds.map(c=>(c.teacher||'')+' | '+c.user+' | '+c.pin).join('\n');try{await navigator.clipboard.writeText('קוד מוסד: '+S.inst+'\n'+t);toast('הועתק');}catch(e){toast('ההעתקה לא הצליחה');}return;}
  if(a==='cred-close'){if(!confirm('לסגור? אחרי הסגירה לא תוכלו לראות שוב את הקודים.'))return;S.creds=null;return render();}
  if(a==='join-new'){
    try{
      const old=S.config.joinToken,tk=newToken();
      await FS.doc('joins/'+tk).set({inst:S.inst,instName:S.config.name,active:true,teachers:teachersList(),created:Date.now()});
      if(old)FS.doc('joins/'+old).delete().catch(()=>{});
      S.config.joinToken=tk;await save(K.config,S.config);logAct('קישור הצטרפות חדש','');toast('הקישור מוכן');return render();
    }catch(e){return toast(fbErr(e));}
  }
  if(a==='join-off'){
    if(!confirm('לבטל את קישור ההצטרפות? מי שעוד לא נרשם לא יוכל להשתמש בו.'))return;
    try{if(S.config.joinToken)await FS.doc('joins/'+S.config.joinToken).delete();}catch(e){}
    S.config.joinToken='';await save(K.config,S.config);toast('הקישור בוטל');return render();
  }
  if(a==='join-copy'){try{await navigator.clipboard.writeText(SITE_URL+'?join='+S.config.joinToken);toast('הקישור הועתק');}catch(e){toast('ההעתקה לא הצליחה');}return;}
  if(a==='jr-ok'||a==='jr-no'){
    const i=+el.dataset.i,r=S.joinReqs[i];if(!r)return;
    try{
      if(a==='jr-no'){if(!confirm('לדחות את הבקשה של '+(r.name||r.user)+'?'))return;await FS.doc('insts/'+S.inst+'/requests/'+r.uid).delete();logAct('בקשת הצטרפות נדחתה',r.user);}
      else{
        const tch=document.getElementById('jr-t-'+i).value,role=document.getElementById('jr-r-'+i).value;
        if(role==='teacher'&&!tch)return toast('בחרו את המורה ממערכת השעות');
        if(S.config.users.some(u=>ukey(u.user)===ukey(r.user)))return toast('שם המשתמש הזה כבר קיים. דחו את הבקשה ובקשו להירשם בשם אחר.');
        const b=FS.batch();
        b.set(FS.doc('insts/'+S.inst+'/members/'+r.uid),{user:r.user,role:role,cls:'',teacher:tch,active:true});
        b.set(FS.doc('logins/'+S.inst+'_'+ukey(r.user)),{email:r.email,inst:S.inst,key:ukey(r.user)});
        b.delete(FS.doc('insts/'+S.inst+'/requests/'+r.uid));
        await b.commit();await reloadMembers();logAct('הצטרפות אושרה',r.user);toast(r.user+' אושר/ה');
      }
      S.joinReqs=null;return render();
    }catch(e){return toast(fbErr(e));}
  }
}

async function showJoin(tk){
  const box=document.querySelector('#login .box');
  document.getElementById('boot').style.display='none';document.getElementById('login').style.display='flex';
  box.innerHTML='<h1>הצטרפות לצוות</h1><p class="note" style="margin-bottom:16px">טוען…</p>';
  let j=null;try{const d=await FS.doc('joins/'+tk).get();if(d.exists)j=d.data();}catch(e){}
  if(!j||!j.active){box.innerHTML='<h1>הצטרפות לצוות</h1><p class="note" style="margin:10px 0 16px">הקישור הזה כבר לא בתוקף. בקשו מהמנהל קישור חדש.</p><a class="btn full" href="'+SITE_URL+'">למסך הכניסה</a>';return;}

function weekStart(){const d=new Date();d.setDate(d.getDate()-d.getDay());return iso(d);}
async function loadConsole(){
  const q=await FS.collection('insts').get(),list=[],today=iso(new Date()),ws=weekStart();
  const days=[];for(let d=new Date(ws+'T12:00:00');iso(d)<=today;d.setDate(d.getDate()+1))days.push(iso(d));
  for(const d of q.docs){
    const code=d.id,data=d.data()||{},o={code:code,name:data.name||code,disabled:!!data.disabled,students:0,users:0,pend:0,usage:null,log:[]};
    try{const cq=await FS.collection('insts/'+code+'/cls').get();o.students=cq.docs.reduce((a,x)=>a+Object.values((x.data()||{}).m||{}).filter(Boolean).length,0);
      if(!cq.docs.length){const st=await FS.doc('insts/'+code+'/store/students').get();o.students=st.exists?Object.values((st.data()||{}).m||{}).filter(Boolean).length:0;}}catch(e){}
    try{const mm=await FS.collection('insts/'+code+'/members').get();o.users=mm.docs.filter(x=>(x.data()||{}).active!==false).length;}catch(e){}
    try{const rq=await FS.collection('insts/'+code+'/requests').get();o.pend=rq.docs.length;}catch(e){}
    try{const lg=await FS.collection('insts/'+code+'/log').orderBy('ts','desc').limit(30).get();o.log=lg.docs.map(x=>Object.assign({inst:code,instName:o.name},x.data()));}catch(e){}
    try{
      const tt=await FS.doc('insts/'+code+'/store/timetable').get(),m=tt.exists?((tt.data()||{}).m||{}):{};
      const lessons=Object.values(m).filter(Boolean);
      if(lessons.length){
        const months=Array.from(new Set(days.map(x=>x.slice(0,7)))),marks={};
        const aq=await FS.collection('insts/'+code+'/att').get();
        aq.docs.forEach(a=>{if(!months.some(mo=>a.id.indexOf('L'+mo)===0))return;const dd=(a.data()||{}).d||{};Object.keys(dd).forEach(k=>marks[k]=Object.assign(marks[k]||{},dd[k]||{}));});
        let tot=0,done=0;
        days.forEach(function(day){const dw=new Date(day+'T12:00:00').getDay();if(dw>5)return;const mk=marks[day]||{};
          lessons.filter(l=>l.day===dw).forEach(l=>{tot++;if(Object.keys(mk).some(k=>k.indexOf(l.id+':')===0&&mk[k]))done++;});});
        o.usage=tot?Math.round(done/tot*100):null;
      }
    }catch(e){}
    o.last=o.log[0]?o.log[0].ts:null;list.push(o);
  }

}

function nameTokens(full,other){
  const a=String(full||'').replace(/['׳"״\-]/g,'').trim().split(/\s+/).filter(Boolean),b=String(other||'').replace(/['׳"״\-]/g,'').trim().split(/\s+/).filter(Boolean);
  let i=0;while(i<a.length-1&&i<b.length-1&&a[i]===b[i])i++;
  if(i===0){i=1;if(['בן','בר','אבו','אל','די','דה','ואן'].indexOf(a[0])>-1&&a.length>2)i=2;}
  return a.slice(i);
}
function genderOf(full,other){
  let sc=0;nameTokens(full,other).forEach(t=>{if(FEM.has(t))sc++;else if(MAL.has(t))sc--;else if(/ית$/.test(t))sc+=0.5;else if(/(אל|יהו)$/.test(t))sc-=0.5;});
  return sc>0?'f':sc<0?'m':'?';
}
function assignParents(p1,p2){
  const g1=genderOf(p1.name,p2.name),g2=genderOf(p2.name,p1.name);
  let swap=false,sure=true;
  if(g1==='f'&&g2!=='f')swap=true;
  else if(g2==='m'&&g1!=='m')swap=true;
  if(!p2.name)sure=(g1!=='?');
  else if(g1===g2||(g1==='?'&&g2==='?'))sure=false;
  const f=swap?p2:p1,m=swap?p1:p2;
  return {father:f,mother:m,sure:sure};
}
function alignedToExisting(m,r){return m&&r&&m.father&&r.father&&m.father===r.mother&&m.mother===r.father;}
function swapParents(o){const f=o.father,fp=o.fatherPhone;o.father=o.mother;o.fatherPhone=o.motherPhone;o.mother=f;o.motherPhone=fp;}

/* ===== ייבוא קובץ "מצבת" (שתי שורות לתלמיד, כיתות לפי גיליון) ===== */
const MZ_CLS=/^[א-ת]{1,2}\s*['׳]?\s*(-\s*)?\d*$/;
function mzPhone(v){const parts=String(v||'').split(/[,;\/]| {2,}/).map(x=>x.trim()).filter(Boolean);return {first:cleanPhone(parts[0]||''),more:parts.slice(1).map(cleanPhone).filter(Boolean)};}
function parseMazevet(wb,X){
  const sheets=wb.SheetNames.map(n=>({n:n.trim(),m:X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''})}));
  const isStu=r=>!!r&&MZ_CLS.test(String(r[2]||'').trim())&&!!String(r[2]||'').trim()&&!!String(r[5]||'').trim();
  if(!sheets.some(sh=>sh.m.filter(isStu).length>=3))return null;
  const per=n=>/^כי?תה/.test(n);
  sheets.sort((a,b)=>(per(b.n)?1:0)-(per(a.n)?1:0));
  const rows=[],seen={},labels={};
  sheets.forEach(function(sh){

function nmKey(n){return String(n||'').replace(/[\u200e\u200f]/g,'').replace(/[׳'״"\-]/g,'').replace(/\s+/g,' ').trim();}
function idOf(st){const x=st.extra||{};const k=Object.keys(x).find(k=>/ת\s*\.?\s*ז|תעודת\s*זהות|ת"ז|ת״ז|מספר\s*זהות/.test(k));return k?String(x[k]).replace(/\D/g,''):'';}
function mergePlan(rows){
  const byId={},byName={},used={};
  S.students.forEach(st=>{const i=idOf(st);if(i)byId[i]=st;const n=nmKey(st.name);(byName[n]=byName[n]||[]).push(st);});
  const plan=rows.map(function(r){
    let m=null;const i=idOf(r);
    if(i&&byId[i]&&!used[byId[i].id])m=byId[i];
    if(!m){m=(byName[nmKey(r.name)]||[]).find(st=>!used[st.id]&&(!r.cls||!st.cls||st.cls===r.cls))||(byName[nmKey(r.name)]||[]).find(st=>!used[st.id]);}
    if(m)used[m.id]=1;
    let changed=false;
    if(m&&alignedToExisting(m,r))swapParents(r);
    if(m){['name','cls','father','fatherPhone','mother','motherPhone','notes'].forEach(f=>{if(r[f]&&r[f]!==m[f])changed=true;});
      Object.keys(r.extra||{}).forEach(k=>{if(r.extra[k]&&(!m.extra||m.extra[k]!==r.extra[k]))changed=true;});}
    return {row:r,match:m,changed:changed};
  });
  const missing=S.students.filter(st=>!used[st.id]);
  return {plan:plan,upd:plan.filter(x=>x.match&&x.changed).length,same:plan.filter(x=>x.match&&!x.changed).length,add:plan.filter(x=>!x.match).length,missing:missing};
}
function applyMerge(removeMissing){
  const M=mergePlan(S.importPreview.rows);
  M.plan.forEach(function(x){
    if(!x.match){S.students.push(x.row);return;}
    const m=x.match,r=x.row;
    if(alignedToExisting(m,r))swapParents(r);
    const keepOk=!m.parentCheck;
    ['name','cls','father','fatherPhone','mother','motherPhone','notes'].forEach(f=>{if(r[f])m[f]=r[f];});
    if(r.extra&&Object.keys(r.extra).length){m.extra=Object.assign({},m.extra||{});Object.keys(r.extra).forEach(k=>{if(r.extra[k])m.extra[k]=r.extra[k];});}
    if(keepOk)delete m.parentCheck;else if(r.parentCheck)m.parentCheck=true;
  });
  if(removeMissing){const gone={};M.missing.forEach(st=>gone[st.id]=1);S.students=S.students.filter(st=>!gone[st.id]);}
  return M;
}

function homography(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){const x=src[i][0],y=src[i][1],u=dst[i][0],v=dst[i][1];
    A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}
  for(let c=0;c<8;c++){let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];if(Math.abs(A[c][c])<1e-12)return null;
    for(let r=0;r<8;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<8;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c];}}
  const h=b.map((v,i)=>v/A[i][i]);
  return (x,y)=>{const z=h[6]*x+h[7]*y+1;return [(h[0]*x+h[1]*y+h[2])/z,(h[3]*x+h[4]*y+h[5])/z];};
}
function makeSampler(g,W,H,Hm){return (x,y)=>{const p=Hm(x,y),u=Math.round(p[0]),v=Math.round(p[1]);return (u<0||v<0||u>=W||v>=H)?255:g[v*W+u];};}
function readPage(cv){
  const W=cv.width,H=cv.height,g=grayOf(cv),T=Math.min(otsu(g),170);
  const sq=findSquares(g,W,H,T);
  if(sq.length<4)return {error:'לא נמצאו ארבעת הריבועים השחורים בפינות הדף'};
  const corners=[[0,0],[W,0],[0,H],[W,H]],pick=[],used={};
  corners.forEach(c=>{let best=-1,bd=1e18;sq.forEach((s,i)=>{if(used[i])return;const d=(s.x-c[0])**2+(s.y-c[1])**2;if(d<bd){bd=d;best=i;}});used[best]=1;pick.push(sq[best]);});
  const F=[[FM.fx[0],FM.fy[0]],[FM.fx[1],FM.fy[0]],[FM.fx[0],FM.fy[1]],[FM.fx[1],FM.fy[1]]];
  const img=pick.map(s=>[s.x,s.y]);
  // ארבעה כיוונים אפשריים (דף הפוך/מסובב)
  const orders=[[0,1,2,3],[3,2,1,0],[1,3,0,2],[2,0,3,1]];
  for(const o of orders){
    const Hm=homography(F,o.map(i=>img[i]));if(!Hm)continue;
    const smp=makeSampler(g,W,H,Hm),G0=fmGeom(1,1),bits=[];
    for(let i=0;i<32;i++){const p=G0.bit(i);let s=0;for(let dx=-0.8;dx<=0.81;dx+=0.8)for(let dy=-0.8;dy<=0.81;dy+=0.8)s+=smp(p.x+dx,p.y+dy);bits.push(s/9<T?1:0);}
    const code=fmDecode(bits);
    if(code)return {smp:smp,T:T,code:code,cv:cv};
  }
  return {smp:null,error:'הדף זוהה, אבל לא הצלחתי לקרוא את קוד הזיהוי שלו. בחרו כיתה ותאריך ידנית.',retry:{g:g,W:W,H:H,T:T,img:img,F:F,cv:cv}};
}
function readMarks(R,L,pi){
  const rows=L.pages[pi],G=fmGeom(rows.length,L.cols.length),smp=R.smp,out=[];
  rows.forEach(function(s,r){
    const cells={};
    L.cols.forEach(function(c,ci){
      const l=L.lessonOf(s,c.n);if(!l)return;
      const p=G.box(r,ci),bgs=[];
      [-1,1].forEach(sx=>[-0.6,0,0.6].forEach(dy=>bgs.push(smp(p.x+sx*Math.min(4.5,G.W/2-0.6),p.y+dy))));
      bgs.sort((a,b)=>a-b);const bg=Math.max(bgs[Math.floor(bgs.length/2)],R.T+20),thr=Math.min(bg*0.72,(bg+R.T)/2);
      let dark=0,n=0;const inn=FM.box/2-1.3;
      for(let dx=-inn;dx<=inn+1e-6;dx+=inn/4)for(let dy=-inn;dy<=inn+1e-6;dy+=inn/4){n++;if(smp(p.x+dx,p.y+dy)<thr)dark++;}
      const f=dark/n;
      cells[c.n]={lid:l.id,f:f,v:f>0.09?'absent':'present',unsure:f>0.035&&f<=0.09};
    });
    out.push({sid:s.id,name:s.name,cells:cells});
  });
  return out;
}
function scanBuild(R,cls,date,pg){
  const L=fmLayout(cls,date);if(pg>=L.pages.length)pg=0;
  const thumb=(()=>{const c=document.createElement('canvas'),k=520/R.cv.width;c.width=520;c.height=Math.round(R.cv.height*k);c.getContext('2d').drawImage(R.cv,0,0,c.width,c.height);return c.toDataURL('image/jpeg',0.7);})();
  return {cls:cls,date:date,pg:pg,cols:L.cols,rows:readMarks(R,L,pg),thumb:thumb,R:R};
}
async function handleScanFiles(files){
  const clsOpts=isAdmin()?S.config.classes:myClasses();
  S.scan={loading:true,pages:[],errors:[]};render();
  for(const f of files){
    let cvs=[];try{cvs=await fileToCanvases(f);}catch(e){S.scan.errors.push(f.name+': '+(e&&e.message==='cdn'?'צריך חיבור לאינטרנט כדי לקרוא PDF':'לא הצלחתי לפתוח את הקובץ'));continue;}
    cvs.forEach(function(cv,i){
      const nm=f.name+(cvs.length>1?' · עמוד '+(i+1):'');
      const R=readPage(cv);
      if(!R.smp){
        if(R.retry)S.scan.pages.push({need:true,name:nm,retry:R.retry,cls:S.markCls||clsOpts[0]||'',date:S.markDate,pg:0,msg:R.error});
        else S.scan.errors.push(nm+': '+R.error);
        return;
      }
      const cls=S.config.classes[R.code.ci],date=dayFromNum(R.code.dn);
      if(!cls){S.scan.errors.push(nm+': הכיתה שבטופס כבר לא קיימת במערכת');return;}
      if(clsOpts.indexOf(cls)<0){S.scan.errors.push(nm+': אין לך הרשאה לכיתה '+cls);return;}
      const P=scanBuild(R,cls,date,R.code.pg);P.name=nm;S.scan.pages.push(P);
    });
  }
  S.scan.loading=false;render();
}
function scanRetry(i){
  const p=S.scan.pages[i],r=p.retry,Hm=homography(r.F,r.img);
  if(!Hm)return toast('לא הצלחתי ליישר את הדף');
  const R={smp:makeSampler(r.g,r.W,r.H,Hm),T:r.T,cv:r.cv};
  const P=scanBuild(R,p.cls,p.date,p.pg);P.name=p.name;P.manual=true;S.scan.pages[i]=P;render();
}

async function scanAction(a,el){
  const sc=S.scan,i=+el.dataset.i;
  if(a==='scan-print'||a==='scan-print-week'){
    const clsOpts=isAdmin()?S.config.classes:myClasses(),classes=S.markCls&&clsOpts.indexOf(S.markCls)>-1?[S.markCls]:clsOpts;
    if(!classes.length)return toast('אין כיתה להדפסה');
    let dates=[S.markDate];
    if(a==='scan-print-week'){const d0=new Date(S.markDate+'T12:00:00');d0.setDate(d0.getDate()-d0.getDay());dates=[];for(let k=0;k<6;k++){const d=new Date(d0);d.setDate(d0.getDate()+k);dates.push(iso(d));}}
    return printForms(classes,dates);
  }
  if(a==='scan-pick')return document.getElementById('scanFile').click();
  if(a==='scan-close'){if(sc&&sc.pages.some(p=>!p.need)&&!confirm('לסגור בלי לשמור?'))return;S.scan=null;return render();}
  if(a==='scan-drop'){sc.pages.splice(i,1);return render();}
  if(a==='scan-retry'){const p=sc.pages[i];document.querySelectorAll('#main [data-scn="'+i+'"]').forEach(inp=>{const k=inp.dataset.k;p[k]=k==='pg'?Math.max(0,(+inp.value||1)-1):inp.value;});return scanRetry(i);}
  if(a==='scan-tog'){const x=sc.pages[i].rows[+el.dataset.r].cells[el.dataset.p];x.v=x.v==='absent'?'present':'absent';x.unsure=false;return render();}
  if(a==='scan-save'){
    let n=0,ab=0;const by={};
    sc.pages.filter(p=>!p.need).forEach(function(p){
      const day=Object.assign({},S.latt[p.date]||{});
      p.rows.forEach(r=>Object.keys(r.cells).forEach(k=>{const x=r.cells[k];day[x.lid+':'+r.sid]=x.v;n++;if(x.v==='absent')ab++;}));
      S.latt[p.date]=day;by[p.cls+' '+shortDate(p.date)]=1;
    });
    LIDX=null;save(K.latt,S.latt);
    logAct('קליטת טופס סרוק',Object.keys(by).join(', ')+' · '+ab+' חיסורים מתוך '+n);
    S.scan=null;toast('הנוכחות נשמרה ('+n+' סימונים)');return render();
  }
}

async function evAction(a,el){
  const id=el.dataset.id;
  if(a==='goto-events'){S.evf={kind:'open',cls:'',days:'',q:''};return goTab('events');}
  if(a==='ev-new'){S.evc=evDefaults();window.scrollTo(0,0);return render();}
  if(a==='ev-for'){const st=studentById(id);S.evc=evDefaults({sids:[id],cls:st?st.cls:''});S.tab='events';window.scrollTo(0,0);return render();}
  if(a==='ev-lesson'){const l=S.timetable.find(x=>x.id===S.markLesson),st=studentById(id);
    const pp=l&&periods().find(x=>x.n===l.period),inNow=S.markDate===iso(new Date())&&pp&&pp.start<=nowHM()&&(!pp.end||nowHM()<pp.end);
    S.evc=evDefaults({sids:[id],cls:st?st.cls:'',date:S.markDate,period:l?l.period:'',time:inNow?nowHM():(pp&&pp.start)||nowHM()});S.evBack=S.markLesson;S.tab='events';window.scrollTo(0,0);return render();}
  if(a==='ev-cancel'){S.evc=null;if(S.evBack){S.tab='mark';S.evBack=null;}return render();}
  evCapture();
  if(a==='ev-cls'){S.evc.cls=el.dataset.c;return render();}
  if(a==='ev-stu'){const c=S.evc,i=c.sids.indexOf(id);if(i>-1)c.sids.splice(i,1);else c.sids.push(id);return render();}
  if(a==='ev-type'){S.evc.type=S.evc.type===el.dataset.t?'':el.dataset.t;return render();}
  if(a==='ev-save'){
    const c=S.evc,t=evType(c.type);if(!c.sids.length)return toast('בחרו תלמיד');if(!t)return toast('בחרו מה קרה');
    if(t.sev===3&&!c.note.trim()&&!confirm('אירוע חמור בלי תיאור. לשמור בכל זאת?'))return;
    const tk=evTk(),ts=Date.now(),time=c.time||(c.date===iso(new Date())?nowHM():'');
    c.sids.forEach(sid=>{const st=studentById(sid);if(!st)return;
      S.events.push({id:uid(),sid:sid,sname:st.name,cls:st.cls,type:t.id,typeName:t.name,kind:t.kind,sev:t.sev,date:c.date,time:time,period:c.period?+c.period:'',note:c.note.trim(),by:S.me.teacher||S.me.user,byUid:S.me.id,tk:tk,ts:ts});});
    await save(K.events,S.events);
    logAct('דיווח אירוע',t.name+' · '+c.sids.map(x=>(studentById(x)||{}).name).join(', '));
    toast('הדיווח נשמר');S.evc=null;
    if(S.evBack){S.tab='mark';S.evBack=null;}
    return render();
  }
  if(a==='ev-handle'){
    const e=S.events.find(x=>x.id===id);if(!e||!canHandle(e))return;
    const n=prompt('מה נעשה? (לא חובה)','');if(n===null)return;
    e.handled=true;e.hnote=n.trim();e.hby=S.me.teacher||S.me.user;e.hts=Date.now();
    await save(K.events,S.events);logAct('אירוע טופל',(studentById(e.sid)||{}).name||'');toast('סומן כטופל');return render();
  }
  if(a==='ev-del'){
    const e=S.events.find(x=>x.id===id);if(!e||!canDelEv(e))return;
    if(!confirm('למחוק את הדיווח?'))return;
    S.events=S.events.filter(x=>x.id!==id);await save(K.events,S.events);logAct('מחיקת אירוע',(studentById(e.sid)||{}).name||'');toast('נמחק');return render();
  }
  if(a==='evt-add'){
    const n=document.getElementById('evtName').value.trim();if(!n)return;
    S.config.evTypes=evTypes().concat([{id:uid(),name:n,kind:document.getElementById('evtKind').value,sev:+document.getElementById('evtSev').value}]);
    if(S.config.evTypes[S.config.evTypes.length-1].kind==='pos')S.config.evTypes[S.config.evTypes.length-1].sev=1;
    save(K.config,S.config);toast('נוסף');return render();
  }
  if(a==='evt-del'){if(!confirm('להסיר את הסוג? דיווחים קיימים לא יימחקו.'))return;S.config.evTypes=evTypes().filter(t=>t.id!==id);save(K.config,S.config);return render();}
}

function dow(date){return new Date(date+'T12:00:00').getDay();}
function lessonsOn(date){const d=dow(date);return d>5?[]:S.timetable.filter(l=>l.day===d);}
function markableLessons(date){
  const ls=lessonsOn(date);

  const mc=myClasses();
  return ls.filter(l=>(l.teacher&&l.teacher===S.me.teacher)||(l.classes||[]).some(c=>mc.indexOf(c)>-1));
}
function lessonStudents(l){
  if(l.type==='private'){const ids=l.students||[];return {list:S.students.filter(s=>ids.indexOf(s.id)>-1),away:[]};}
  const par=S.timetable.filter(o=>o.id!==l.id&&o.type==='private'&&o.day===l.day&&o.period===l.period);
  const inC=S.students.filter(s=>(l.classes||[]).indexOf(s.cls)>-1),list=[],away=[];
  inC.forEach(function(s){const pl=par.find(o=>(o.students||[]).indexOf(s.id)>-1);if(pl)away.push({s:s,l:pl});else list.push(s);});
  return {list:list,away:away};
}

function parseTimetable(m){
  let mode=null,dayCols=null,cur='';
  const lessons=[],seen={},per={},teachers={},classes={};let privNoStu=0;
  for(let r=0;r<m.length;r++){
    const row=m[r]||[],a=String(row[0]==null?'':row[0]).trim();
    let mm=a.match(/^כי?תה\s*:\s*(.+)$/);if(mm){mode='class';cur=mm[1].trim();dayCols=null;continue;}
    mm=a.match(/^מורה\s*:\s*(.+)$/);if(mm){mode='teacher';teachers[mm[1].trim()]=1;dayCols=null;continue;}
    const dc={};row.forEach((c,i)=>{const d=DAYS.indexOf(String(c==null?'':c).trim());if(d>-1)dc[i]=d;});
    if(Object.keys(dc).length>=3){dayCols=dc;continue;}
    if(mode!=='class'||!dayCols)continue;
    const pm=a.match(/^(\d+)\s*(?:(\d{1,2}:\d{2})\s*<?\s*(\d{1,2}:\d{2}))?/);if(!pm)continue;
    const pn=+pm[1];if(pm[2]&&!per[pn])per[pn]={n:pn,start:pm[2].padStart(5,'0'),end:pm[3].padStart(5,'0')};else if(!per[pn])per[pn]={n:pn,start:'',end:''};
    Object.keys(dayCols).forEach(function(ci){

/* התאמת שיעורים מיובאים לשיעורים הקיימים, כדי לשמור את המזהה (והנוכחות שנרשמה לפיו) */
function ttMatch(lessons){
  const k=(l,sub)=>[l.day,l.period,sub?l.subject:'',l.teacher,(l.classes||[]).slice().sort().join('+'),l.type||'class'].join('|');
  const used={},out={};
  [true,false].forEach(function(sub){
    const pool={};S.timetable.forEach(o=>{if(!used[o.id])(pool[k(o,sub)]=pool[k(o,sub)]||[]).push(o);});
    lessons.forEach(function(l,i){if(out[i])return;const c=pool[k(l,sub)];if(!c)return;const o=c.find(x=>!used[x.id]);if(o){used[o.id]=1;out[i]=o;}});
  });

}

/* "מה חדש": השוואה בין השבוע הנוכחי לשבוע הקודם, ומה קרה היום — מתעדכן עם כל יום נוכחות חדש */
function anFresh(cf){

  const p0=new Date(d0);p0.setDate(p0.getDate()-7);const pws=iso(p0),pwe=iso(new Date(d0.getTime()-864e5));
  const rec=attLogAll(pws,today).filter(r=>!cf||r.cls===cf),cur=rec.filter(r=>r.d>=ws),prev=rec.filter(r=>r.d<ws);
  const pct=a=>a.length?Math.round(a.filter(r=>r.v==='present'||r.v==='late').length/a.length*100):null;
  const cnt=(a,v)=>a.filter(r=>r.v===v).length,out=[];
  const arrow=(x,y,good)=>{if(x===null||y===null)return '';const d=x-y;if(!d)return ' (ללא שינוי)';return ' ('+(d>0?'▲':'▼')+Math.abs(d)+(good?'':'')+')';};

  if(pc!==null)out.push({tone:pp!==null&&pc<pp-2?'bad':pp!==null&&pc>pp+2?'good':'',t:'נוכחות השבוע: '+pc+'%'+(pp!==null?' לעומת '+pp+'% בשבוע שעבר':'')});
  const lc=cnt(cur,'late'),lp=cnt(prev,'late');if(lc||lp)out.push({tone:lc>lp*1.3&&lc>=5?'bad':'',t:'איחורים השבוע: '+lc+(prev.length?' לעומת '+lp+' בשבוע שעבר':'')});

  const drops=Object.keys(byC).map(c=>({c:c,a:pct(byC[c].c),b:pct(byC[c].p)})).filter(x=>x.a!==null&&x.b!==null&&x.b-x.a>=5).sort((x,y)=>(y.b-y.a)-(x.b-x.a));
  if(drops.length)out.push({tone:'bad',t:'ירידה בנוכחות השבוע: '+drops.slice(0,2).map(x=>x.c+' ('+x.b+'% ← '+x.a+'%)').join(', ')});
  // תלמידים שחסרו לפחות שני ימים השבוע
  const abs={};cur.filter(r=>r.v==='absent').forEach(r=>{(abs[r.sid]=abs[r.sid]||{n:r.name,c:r.cls,d:{}}).d[r.d]=1;});
  const many=Object.values(abs).filter(x=>Object.keys(x.d).length>=2);
  if(many.length)out.push({tone:'bad',t:many.length+' תלמידים חסרו יומיים ומעלה השבוע: '+many.slice(0,6).map(x=>x.n+' ('+x.c+')').join(', ')+(many.length>6?' ועוד':'')});
  // אירועים לשיפור השבוע מול שבוע שעבר
  const ev=S.events.filter(e=>e.kind==='neg'&&(!cf||e.cls===cf)),ec=ev.filter(e=>e.date>=ws).length,ep=ev.filter(e=>e.date>=pws&&e.date<=pwe).length;
  if(ec||ep)out.push({tone:ec>ep+2?'bad':ec<ep?'good':'',t:'אירועים לשיפור השבוע: '+ec+' לעומת '+ep+' בשבוע שעבר'});
  // סימון נוכחות השבוע לפי מורה
  const tm={};Object.keys(S.latt).filter(d=>d>=ws&&d<=today).forEach(function(d){const day=S.latt[d]||{},done={};Object.keys(day).forEach(k=>{const i=k.indexOf(':');if(i>0)done[k.slice(0,i)]=1;});
    const hm=d===today?nowHM():'99:99';
    lessonsOn(d).forEach(function(l){if(cf&&(l.classes||[]).indexOf(cf)<0)return;if(l.type==='private'&&!(l.students||[]).length)return;const pp=periods().find(x=>x.n===l.period);if(!pp||!pp.end||pp.end>hm)return;
      const t=l.teacher||'ללא מורה',o=tm[t]=tm[t]||{n:0,m:0};o.n++;if(done[l.id])o.m++;});});
  const weak=Object.keys(tm).filter(t=>tm[t].n>=3&&tm[t].m/tm[t].n<0.8).sort((a,b)=>tm[a].m/tm[a].n-tm[b].m/tm[b].n);
  if(weak.length)out.push({tone:'bad',t:'סימנו פחות מ-80% מהשיעורים השבוע: '+weak.slice(0,5).map(t=>t+' ('+Math.round(tm[t].m/tm[t].n*100)+'%)').join(', ')});
