@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700&family=Noto+Sans:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#E9EDF2;--surface:#FFFFFF;--surface2:#F4F6F9;--ink:#16243B;--muted:#5C6B80;--line:#D6DDE6;
--accent:#8A2E3F;--accent-soft:#F6EAEC;--present:#2F7A4F;--late:#B0801F;--absent:#AF3A2E;--excused:#5C6B80;
--green:#2F7A4F;--yellow:#C9911C;--red:#AF3A2E}
body{margin:0;font-family:'Assistant',system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-weight:700;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
a{color:var(--accent)}
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
#login .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px;width:100%;max-width:360px}
#login h1{font-size:24px;margin-bottom:4px}
#login .logo{max-height:70px;max-width:200px;display:block;margin:0 auto 16px}
.shell{display:none;min-height:100vh}
.shell.on{display:flex}
.side{width:210px;flex:0 0 210px;background:var(--surface);border-left:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
.brand{padding:0 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand img{max-height:52px;max-width:100%;display:block;margin-bottom:8px}
.brand h1{font-size:19px;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{text-align:right;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600;transition:background .12s,color .12s}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[data-on="1"]{background:var(--accent-soft);color:var(--accent)}
.who{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.who b{display:block;color:var(--ink);font-size:14px}
main{flex:1;min-width:0;padding:24px 28px 80px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h2{font-size:26px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.hebdate{font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:17px;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 18px}
.exrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--surface2);padding:5px 0}
.exrow input{width:84px;text-align:center}
.rchead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--line);padding-bottom:10px}
.rcgrp{margin:12px 0 4px}
.dmi{border-bottom:1px solid var(--surface2);padding:10px 0}
.asfile{border-bottom:1px solid var(--surface2);padding:10px 0}
.asdrop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
body.asdrag .asdrop{border-color:var(--accent);background:var(--accent-soft)}
.asmsgs{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.asm{border-bottom:1px solid var(--surface2);padding:8px 0}
.asb{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.asx{background:none;border:0;color:var(--muted);cursor:pointer;float:left;font-size:12px;opacity:.5}
.asx:hover{opacity:1;color:var(--absent)}
.asm[data-a="1"]{border-right:3px solid var(--present);padding-right:8px}
.asm[data-a="0"]{border-right:3px solid var(--late);padding-right:8px}
.acstep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}
.acprop{border-bottom:1px solid var(--surface2);padding:12px 0}
.acprop .row{flex-wrap:wrap}
.acsrc{margin-top:6px;padding:6px 10px;border-right:3px solid var(--line);background:var(--surface2);border-radius:6px}
.acq{font-size:13.5px;overflow-wrap:anywhere}
.acin{min-width:0;width:min(520px,100%)}
.acitem{padding:8px 0;border-bottom:1px solid var(--surface2)}
.actopic{margin-top:14px}
.acsel{width:auto;padding:3px 6px;font-size:13px}
.acks{font-weight:700;color:var(--accent)}
.acurg{font-size:13px}
.acurg:has(input:checked){color:var(--absent);font-weight:700}
.nbadge{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:6px;border-radius:99px;background:var(--absent);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
#dmPill{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:9000;background:var(--accent);color:#fff;border:0;border-radius:99px;padding:11px 20px;font:inherit;font-weight:700;box-shadow:0 8px 24px rgba(20,27,52,.3);cursor:pointer;animation:remIn .35s ease;white-space:nowrap}
@media print{#dmPill{display:none}}
.rct tr.rcw td{background:var(--surface2);padding-top:9px}
.rct tr.rcwa td{font-size:13px;color:var(--muted)}
.rct tr.rcm td{background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-weight:700;border-top:2px solid var(--accent)}
@media print{.rct tr.rcw td,.rct tr.rcm td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.rcsign{display:flex;gap:24px;margin-top:40px}
.rcsign div{flex:1;border-top:1px solid var(--ink);padding-top:4px;text-align:center;font-size:13px;color:var(--muted)}
.rcpage{margin-bottom:34px}
@media print{.rcpage{break-after:page;margin:0}.rcpage:last-child{break-after:auto}}
.hmt td.hm{text-align:center;font-weight:600;min-width:58px;border-radius:6px;font-variant-numeric:tabular-nums}
.hmt th{white-space:nowrap}
.ains{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--surface))}
.afresh .alert[data-tone="bad"]{color:var(--absent)}
.afresh .alert[data-tone="good"]{color:var(--present)}
#remBox{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;width:min(440px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px}
.remp{background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:14px 16px;box-shadow:0 12px 40px rgba(20,27,52,.28);animation:remIn .35s ease;transition:opacity .3s,transform .3s}
.remp.out{opacity:0;transform:translateY(-12px)}
.remh{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--accent);font-size:15px}
.remx{background:none;border:0;font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px}
.remt{font-size:16px;margin:8px 0 4px;white-space:pre-wrap}
.remb{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:8px}
.remb i{display:block;height:100%;background:var(--gold);animation:remBar 120s linear forwards}
@keyframes remIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes remBar{from{width:100%}to{width:0}}
.dhero{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.dnow{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13.5px}
.dquick .btn{white-space:nowrap}
.dcls{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--surface2)}
.dcls b{min-width:70px}
.dtrend{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:4px}
.dtrend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.dtrend i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--present)}
.dtrend i[data-low="1"]{background:var(--late)}.dtrend i[data-low="2"]{background:var(--absent)}
.dtrend em{font-style:normal;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.dtrend .note{font-size:11px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:31px;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600;transition:background .12s;text-decoration:none;display:inline-block}
.btn:hover{background:var(--surface2)}
.btn[data-v="primary"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[data-v="primary"]:hover{background:#75252f}
.btn[data-v="ghost"]{border-color:transparent;background:transparent;color:var(--muted)}
.btn[data-v="ghost"]:hover{color:var(--accent);background:var(--accent-soft)}
.btn[data-v="danger"]{color:var(--absent);border-color:#E7C6C1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sm{padding:5px 10px;font-size:13px}
.big{padding:12px 22px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.full{width:100%;text-align:center}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface)}
.field textarea{min-height:90px;resize:vertical;line-height:1.6}
.inp{width:auto}
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:12.5px;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--surface2)}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.ltr{direction:ltr;text-align:right;display:inline-block}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:right}
.link:hover{text-decoration:underline}
.mark{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--surface2)}
.mark-name{flex:1;min-width:0;font-weight:600}
.mark-name em{display:block;font-style:normal;font-weight:400;font-size:12.5px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:var(--surface);padding:8px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-left:1px solid var(--line);min-width:52px}
.seg button:last-child{border-left:0}
.seg button:hover{background:var(--surface2)}
.seg button[data-on="1"]{color:#fff}
.seg button[data-on="1"][data-s="present"]{background:var(--present)}
.seg button[data-on="1"][data-s="late"]{background:var(--late)}
.seg button[data-on="1"][data-s="absent"]{background:var(--absent)}
.seg button[data-on="1"][data-s="excused"]{background:var(--excused)}
.savebar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 -2px 12px rgba(22,36,59,.06)}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12.5px;font-weight:700}
.tag[data-s="present"]{background:#E4F0E9;color:var(--present)}
.tag[data-s="late"]{background:#F7EFDC;color:var(--late)}
.tag[data-s="absent"]{background:#F7E4E1;color:var(--absent)}
.tag[data-s="excused"],.tag[data-s="teacher"]{background:var(--surface2);color:var(--muted)}
.tag[data-s="admin"]{background:var(--accent-soft);color:var(--accent)}
.tag[data-s="green"]{background:#E4F0E9;color:var(--green)}
.tag[data-s="yellow"]{background:#F9F0DA;color:var(--yellow)}
.tag[data-s="red"]{background:#F7E4E1;color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip b{width:7px;height:7px;border-radius:50%;background:var(--absent)}
.chip[data-done="1"] b{background:var(--present)}
.chip[data-done="1"]{color:var(--muted);font-weight:400}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.warn{background:#FBF3E3;border:1px solid #EBD9AE;color:#7A5B14;border-radius:8px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.bar{height:6px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--present)}
.bar i[data-low="1"]{background:var(--late)}
.bar i[data-low="2"]{background:var(--absent)}
#toast{position:fixed;bottom:18px;left:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:50;display:none}
.printhead{display:none}.onlyprint{display:none}
/* תמונת מצב */
.rev-wrap{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}
.rev-name{font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:30px;font-weight:700;line-height:1.15}
.lights{display:flex;gap:10px;margin:14px 0 18px}
.lights button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 8px;cursor:pointer;font-weight:700;font-size:16px;color:var(--muted)}
.lights button:hover{background:var(--surface2)}
.lights button[data-on="1"]{color:#fff}
.lights button[data-on="1"][data-l="green"]{background:var(--green);border-color:var(--green)}
.lights button[data-on="1"][data-l="yellow"]{background:var(--yellow);border-color:var(--yellow)}
.lights button[data-on="1"][data-l="red"]{background:var(--red);border-color:var(--red)}
.dom{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--surface2)}
.dom-label{flex:1;font-weight:600}
.dom-label i{font-style:normal;color:var(--muted);font-weight:400;font-size:12.5px;margin-right:6px}
.scale{display:flex;gap:5px}
.scale button{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-weight:700;color:var(--muted)}
.scale button:hover{background:var(--surface2)}
.scale button[data-on="1"]{background:var(--ink);border-color:var(--ink);color:#fff}
.prev{background:var(--surface2);border-radius:8px;padding:12px 14px;font-size:13.5px}
.prev h4{margin:0 0 8px;font-size:14px;font-family:'Noto Sans Hebrew';font-weight:700}
.dots{display:flex;gap:4px}
.dots i{width:11px;height:11px;border-radius:50%;display:inline-block;background:var(--line)}
.dots i[data-l="green"]{background:var(--green)}
.dots i[data-l="yellow"]{background:var(--yellow)}
.dots i[data-l="red"]{background:var(--red)}
.prog{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--accent)}
.tl{border-right:2px solid var(--line);padding:0 0 4px 0;margin-right:6px}
.tl-item{position:relative;padding:0 18px 16px 0}
.tl-item::before{content:'';position:absolute;right:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--line);border:2px solid var(--surface)}
.tl-item[data-l="green"]::before{background:var(--green)}
.tl-item[data-l="yellow"]::before{background:var(--yellow)}
.tl-item[data-l="red"]::before{background:var(--red)}
.tl-date{font-size:12.5px;color:var(--muted);font-weight:700}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--surface2)}
.task-body{flex:1;min-width:0}
.task-body b{display:block;font-weight:600}
.task[data-done="1"] .task-body b{text-decoration:line-through;color:var(--muted)}
.tick{width:24px;height:24px;border:2px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;flex:0 0 auto;margin-top:2px;font-weight:700;color:transparent}
.task[data-done="1"] .tick{background:var(--present);border-color:var(--present);color:#fff}
.alert{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--surface2);font-size:14px}
.alert:last-child{border-bottom:0}
.alert b{flex:0 0 auto}
@media(max-width:900px){.rev-wrap{grid-template-columns:1fr}}
@media(max-width:820px){
.shell.on{flex-direction:column}
.side{width:auto;flex:none;border-left:0;border-bottom:1px solid var(--line);padding:14px}
.brand{border-bottom:0;margin-bottom:8px;padding-bottom:8px}
.nav{flex-direction:row;overflow-x:auto;gap:4px}
.nav button{white-space:nowrap;padding:7px 12px}
.who{margin-top:10px;padding-top:10px}
main{padding:18px 14px 70px}
.mark{flex-wrap:wrap}
.seg{width:100%}
.seg button{flex:1}
.rev-name{font-size:24px}
.scale button{width:34px;height:34px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.side,.savebar,#toast,.btn{display:none}main{padding:0}.card{break-inside:avoid;border:0;padding:0}
.printhead{display:block;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}.printhead img{max-height:50px}
.noprint{display:none!important}.onlyprint{display:block}.card.brk{break-inside:auto}.lgday{break-after:avoid;margin-top:14px}}

/* ===== מובייל, מגע ואפליקציה ===== */
html{-webkit-text-size-adjust:100%;height:100%}
body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent;min-height:100%}
button,.btn,.chip,.link,a,label,[data-act],[data-tab]{touch-action:manipulation}
.btn:active,.chip:active,.seg button:active,.lights button:active,.scale button:active,.tick:active,.nav button:active,.bnav button:active{transform:scale(.96)}
.btn,.chip,.seg button,.lights button,.scale button,.tick,.bnav button{transition:background .12s,transform .08s}
.topbar,.bnav,.backdrop{display:none}
#login{padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(hover:none){
  .btn:hover{background:var(--surface)}
  .btn[data-v="primary"]:hover{background:var(--accent)}
  .btn[data-v="ghost"]:hover{background:transparent;color:var(--muted)}
  .nav button:hover,.seg button:hover,.lights button:hover,.scale button:hover{background:inherit}
}
@media(pointer:coarse){
  .btn{min-height:44px;padding:10px 16px}
  .btn.sm,.sm{min-height:38px;padding:8px 12px}
  .field input,.field select,.field textarea,.inp,input,select,textarea{font-size:16px;min-height:44px}
  .field textarea,textarea{min-height:100px}
  .seg button{min-height:46px;font-size:14px}
  .scale{gap:7px;flex-wrap:wrap}
  .scale button{width:44px;height:44px;font-size:16px}
  .lights button{padding:18px 8px;font-size:17px}
  .tick{width:32px;height:32px}
  .chip{padding:9px 15px;font-size:14.5px}
  .link{padding:6px 0;min-height:32px}
  .nav button{padding:12px 12px;font-size:16px}
  td{padding:12px 8px}
  input[type="checkbox"],input[type="radio"]{width:22px;height:22px;min-height:0}
}
@media(max-width:820px){
  .shell.on{flex-direction:column}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
    padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;min-height:56px}
  .topbar .menu{width:44px;height:44px;border:0;background:none;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .topbar .menu:active{background:var(--surface2)}
  .topbar .menu i,.topbar .menu i::before,.topbar .menu i::after{display:block;width:20px;height:2px;background:var(--ink);border-radius:2px;position:relative}
  .topbar .menu i::before,.topbar .menu i::after{content:'';position:absolute;left:0}
  .topbar .menu i::before{top:-6px}.topbar .menu i::after{top:6px}
  .topbar .t{flex:1;min-width:0}
  .topbar .t b{display:block;font-family:'Noto Sans Hebrew','Noto Sans',sans-serif;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ================= עיצוב: אינדיגו וזהב ================= */
:root{--bg:#F2F4F9;--surface:#FFFFFF;--surface2:#F5F7FC;--ink:#141B34;--muted:#636C86;--line:#E1E5EF;
--accent:#2E3E9E;--accent-dark:#232F7E;--accent-soft:#E9ECFA;--gold:#F2B530;--side:#1A2357;--side2:#232D6A;
--present:#1E9E6A;--late:#D08A0B;--absent:#DB4537;--excused:#7A839C;--green:#1E9E6A;--yellow:#D9A10F;--red:#DB4537}
body{background:var(--bg);font-size:15px;font-family:'Noto Sans Hebrew','Noto Sans',system-ui,'Segoe UI',sans-serif}
h1,h2,h3,.stat b,.rev-name,.hebdate,.topbar .t b{font-family:'Noto Sans Hebrew','Noto Sans',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
.head h2{font-size:30px;line-height:1.15}
.card h3{font-size:18px}
.sub{font-size:13.5px}
.hebdate{color:var(--accent)}
::selection{background:var(--gold);color:var(--ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

/* סרגל צד כהה */
.side{background:var(--side);border-left:0;color:#C3CAEC}
.brand{border-bottom:1px solid rgba(255,255,255,.1)}
.brand h1{color:#fff;font-size:21px}
.brand span{color:#97A1D2}
.nav button{color:#C3CAEC;border-radius:10px;padding:10px 12px;font-size:15px}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button[data-on="1"]{background:var(--side2);color:#fff;box-shadow:inset -3px 0 0 var(--gold)}
.who{border-top:1px solid rgba(255,255,255,.1);color:#97A1D2}
.who b{color:#fff}
.who .btn{background:transparent;border-color:rgba(255,255,255,.22);color:#E4E8FA}
.who .btn:hover{background:rgba(255,255,255,.08)}
#installBtn{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* כרטיסים */
.card,.stat{border-radius:16px;border-color:var(--line);box-shadow:0 1px 2px rgba(20,27,52,.04)}
.card{padding:20px}
.stat{padding:16px 18px}
.stat b{font-size:36px;line-height:1.05;margin-bottom:2px}

/* כפתורים */
.btn{border-radius:10px;padding:9px 16px;border-color:var(--line);transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--surface2);border-color:#CDD3E3}
.btn[data-v="primary"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[data-v="primary"]:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn[data-v="ghost"]:hover{color:var(--accent);background:var(--accent-soft)}
.btn[data-v="danger"]{color:var(--absent);border-color:#F2CFCB}
.btn[data-v="danger"]:hover{background:#FDF1EF}
.link{color:var(--accent)}
a{color:var(--accent)}

/* שדות */
.field span{color:var(--ink);font-size:13.5px}
.field input,.field select,.field textarea,.inp{border-radius:10px;border-color:#D5DAE7;padding:9px 12px;transition:border-color .12s,box-shadow .12s}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* בורר מקטעים */
.seg{border:0;background:#EAEDF5;border-radius:12px;padding:3px;gap:3px}
.seg button{border:0!important;border-radius:9px;background:transparent;color:var(--muted)}
.seg button:hover{background:rgba(255,255,255,.7)}
.seg button[data-on="1"]{box-shadow:0 1px 2px rgba(20,27,52,.12)}
.seg button[data-on="1"]:not([data-s]){background:#fff;color:var(--accent)}

/* תגיות ושבבים */
.tag[data-s="present"],.tag[data-s="green"]{background:#E2F5EC;color:#14794F}
.tag[data-s="late"],.tag[data-s="yellow"]{background:#FCF1D9;color:#946208}
.tag[data-s="absent"],.tag[data-s="red"]{background:#FCE6E3;color:#B4362A}
.tag[data-s="admin"]{background:var(--accent-soft);color:var(--accent)}
.chip{border-radius:999px;border-color:#D5DAE7}
.chip:hover{border-color:var(--accent)}
.chip[data-on="1"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* טבלאות */
th{color:var(--muted);font-size:12.5px;padding:8px;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid #EEF1F7}
tbody tr:hover td{background:#FAFBFE}

/* שונות */
.savebar{border-radius:14px;box-shadow:0 6px 24px rgba(20,27,52,.10);border-color:var(--line)}
#toast{background:var(--side);border-radius:12px;box-shadow:0 8px 24px rgba(20,27,52,.25)}
.lights button{border-radius:14px}
.mark{padding:11px 4px}
.lrow{border-radius:14px;padding:12px 14px}
.lrow:hover{border-color:#CDD3E3}
.lsn{background:#EEF1FB;border-radius:9px}
table.tt td{border-color:#E6EAF3}
table.tt td.pc{background:#F7F8FC}
.warn{border-radius:12px}
.bar{height:7px;border-radius:99px}

/* משקלים לנוטו */
.nav button,.btn,.chip,.seg button,.field span,.mark-name,.link,.lights button{font-weight:500}
.btn[data-v="primary"]{font-weight:600}
.tag{font-weight:600}
th{font-weight:600}
.head h2{font-size:28px}
/* מסך כניסה */
#login{background:var(--side);background-image:radial-gradient(circle at 85% 10%,rgba(242,181,48,.16),transparent 40%),radial-gradient(circle at 10% 95%,rgba(255,255,255,.06),transparent 45%)}
#login .box{border:0;border-radius:22px;padding:34px 30px;box-shadow:0 24px 60px rgba(5,10,40,.35)}
#login h1{font-size:30px;color:var(--side)}
#login .box::before{content:'';display:block;width:44px;height:5px;border-radius:9px;background:var(--gold);margin-bottom:18px}
#boot{background:var(--bg)}

/* מובייל */
@media(max-width:820px){
  .topbar{background:var(--side);border-bottom:0;color:#fff}
  .topbar .t span{color:#A9B2DD}
  .topbar .menu:active{background:rgba(255,255,255,.1)}
  .topbar .menu i,.topbar .menu i::before,.topbar .menu i::after{background:#fff}
  .side{box-shadow:-10px 0 40px rgba(5,10,40,.35)}
  .bnav{border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(20,27,52,.06)}

  .stat{padding:12px 14px}
  .stat b{font-size:30px}
}

@media screen {#main:has([data-ch="markDate"], [data-act="lm-back"]){min-width: 0px; font-family: "AURA Heebo", "Noto Sans Hebrew", sans-serif; font-synthesis: none; --line: color-mix(in srgb, var(--au-ring) 70%, transparent); --au-shadow: 0 12px 32px -26px color-mix(in srgb, var(--ink) 24%, transparent);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) > .head{display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; padding: 26px 28px; margin-bottom: 20px; border-radius: var(--au-r-hero); border: 1px solid var(--line); background: linear-gradient(115deg,var(--surface2),var(--accent-soft)); box-shadow: none;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) > .head > div{min-width: 0px; flex: 1 1 0%;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) > .head h2{font-size: 34px; font-weight: 550; letter-spacing: -0.015em; margin: 0px 0px 8px; overflow-wrap: anywhere; color: var(--au-title);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .sub{font-size: 14px; line-height: 1.7; color: var(--au-sub);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) > .card{min-width: 0px; padding: 22px; border-radius: var(--au-r-hero); box-shadow: var(--au-shadow);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .field > span{color: var(--au-sub); font-size: 14px; line-height: 1.6; margin-bottom: 8px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) :is(.field, input, select){min-width: 0px; max-width: 100%;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) :is(.field input, .field select){min-height: 46px; border-radius: 12px; color: var(--au-sub); font-size: 15px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) :is(.btn, .evb){min-height: 44px; border-radius: 12px; font-size: 14px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) :is(button, input, select):focus-visible{outline: 2px solid var(--accent); outline-offset: 3px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .note{color: var(--au-mute); font-size: 14px; line-height: 1.6;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .tag{font-size: 13px; line-height: 1.5; padding: 5px 10px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .seg{padding: 4px; gap: 4px; border-radius: 14px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .seg button{font-weight: 450; min-height: 44px; padding: 8px 12px; border-radius: 10px; line-height: 1.5; font-size: 14px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .seg button[data-act="mark-view"][data-on="1"]{background: var(--accent); color: white;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .lrow{padding: 16px 18px; margin-bottom: 10px; gap: 14px; border-radius: 16px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .lrow:last-child{margin-bottom: 0px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .lrow:has(.tag[data-s="absent"]){border-inline-start: 2px solid var(--tag-r-ink);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .lrow:has(.tag[data-s="present"]){border-inline-start: 2px solid var(--tag-g-ink);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .lr-main b{font-size: 17px; font-weight: 550; line-height: 1.5; color: var(--au-title); overflow-wrap: anywhere;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .lr-main span{margin-top: 4px; font-size: 14px; line-height: 1.6; color: var(--au-mute);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark{display: grid; grid-template-columns: minmax(140px, 1fr) minmax(300px, auto) auto; gap: 12px; padding: 16px 0px; border-bottom: 1px solid var(--line); align-items: center;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark:last-child{border-bottom: 0px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark-name{font-size: 17px; font-weight: 550; line-height: 1.6; color: var(--au-title); overflow-wrap: anywhere;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark-name em{margin-top: 3px; font-size: 14px; line-height: 1.5; color: var(--au-mute);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark .seg button[data-on="1"]{font-weight: 650; box-shadow: currentcolor 0px 0px 0px 1px inset;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark .seg button[data-on="1"][data-s="present"]{background: var(--tag-g); color: var(--tag-g-ink);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark .seg button[data-on="1"][data-s="late"]{background: var(--tag-y); color: var(--tag-y-ink);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark .seg button[data-on="1"][data-s="absent"]{background: var(--tag-r); color: var(--tag-r-ink);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark .seg button[data-on="1"][data-s="excused"]{background: var(--accent-soft); color: var(--au-sub);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .savebar{display: grid; grid-template-columns: minmax(0px, 1fr) auto; padding: 12px 16px; border-radius: 18px; gap: 12px; box-shadow: var(--au-shadow);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .savebar .note{color: var(--au-sub);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .scroll{max-width: 100%; border: 1px solid var(--line); border-radius: 14px; scrollbar-color: var(--au-mute) var(--surface2);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .scroll table{min-width: 540px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .scroll th{background: var(--surface2); color: var(--au-sub); padding: 12px; font-size: 14px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .scroll td{padding: 12px; line-height: 1.6;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) :is(.gaptab, .stat){--present: var(--tag-g-ink); --absent: var(--tag-r-ink);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .stat{border-radius: var(--au-r-card); box-shadow: var(--au-shadow);}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .stat span{font-size: 14px; line-height: 1.5;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .empty{padding: 40px 16px; color: var(--au-mute); font-size: 15px; line-height: 1.7;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) :is(button, input, select, h2, h3, .stat b, .hebdate){font-family: inherit;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) > .head > div::before{content: ""; display: block; width: 32px; height: 2px; margin-bottom: 14px; background: linear-gradient(90deg,var(--hw-gold),var(--hw-gold2)); border-radius: 2px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .field > span{font-weight: 500;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .evb{border-style: solid;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .tag{font-weight: 550;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .btn[data-v="primary"]{background: var(--accent); box-shadow: none;}
@media (max-width: 820px) {#main:has([data-ch="markDate"], [data-act="lm-back"]) :is(.lrow, .mark, button, input, select){scroll-margin-block: calc(76px + env(safe-area-inset-top,0px)) calc(204px + env(safe-area-inset-bottom,0px));}}
@media (max-width: 650px) {#main:has([data-ch="markDate"], [data-act="lm-back"]) > .head{padding: 20px 16px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) > .head h2{font-size: 29px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) > .head > div{flex-basis: 100%;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) > .head > .btn{width: 100%;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) > .card{padding: 14px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .seg{min-width: 0px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .seg button{min-width: 0px; padding-inline: 6px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .lrow{padding: 14px 12px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark{grid-template-columns: minmax(0px, 1fr) auto; gap: 10px 8px; padding-block: 18px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark-name{grid-area: 1 / 1;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark > .evb{grid-area: 1 / 2;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark .seg{grid-area: 2 / 1 / auto / -1; display: grid; grid-template-columns: repeat(4, minmax(0px, 1fr));}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .mark .seg button{font-size: 14px;}
#main:has([data-ch="markDate"], [data-act="lm-back"]) .savebar{padding: 12px;}}}
/* Adapted from aura-student360-refined; CSS only. */
@media screen {#main:has(.s360){font-family: "AURA Heebo", "Noto Sans Hebrew", sans-serif; font-synthesis: none;}
#main .s360{--au-sep: color-mix(in srgb,var(--au-ring) 70%,transparent); --au-shadow: 0 12px 32px -26px color-mix(in srgb,var(--ink) 24%,transparent);}
#main .s360 :is(button, h2, h3, .s3-trend text, .s3-evs text){font-family: inherit;}
#main .s3-id h2{font-weight: 550; font-size: 34px; line-height: 1.35; overflow-wrap: anywhere;}
#main .s3-chips > span{font-weight: 500; line-height: 1.6;}
#main .s3-par{line-height: 1.7;}
#main .s3-par > span{min-width: 0px; max-width: 100%; overflow-wrap: anywhere;}
#main .s3-acts .btn{min-height: 44px; font-weight: 500; box-shadow: none;}
#main .s3-acts .btn[data-v="primary"]{background: var(--accent);}
#main .s3-acts .btn:focus-visible{outline: 2px solid var(--accent); outline-offset: 3px;}
#main .s3-av{font-weight: 550; box-shadow: 0 8px 22px -14px var(--accent),0 0 0 2px var(--au-ring);}
#main .s3-kpis .au-kpi b{font-weight: 600;}
#main .s3-kpis .au-kpi :is(em, small){font-weight: 500;}
#main .s3-row > .au-c > h3{white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.5; font-weight: 550;}
#main .s3-insl{max-height: 260px; gap: 12px;}
#main .s3-in{padding: 12px;}
#main .s3-in > div, #main .s3-t > div{min-width: 0px; overflow-wrap: anywhere;}
#main .s3-in b{font-weight: 550; line-height: 1.6;}
#main .s3-in b span{font-weight: 500; line-height: 1.5;}
#main .s3-in p{margin-top: 6px; font-size: 15px; line-height: 1.7;}
#main .s3-in p u{font-weight: 600;}
#main .s3-in[data-lv="risk"] b span{background: var(--surface); color: var(--tag-r-ink);}
#main .s3-in[data-lv="warn"] b span{background: var(--surface); color: var(--tag-y-ink);}
#main .s3-t{padding-block: 12px;}
#main .s3-t b{font-weight: 550; line-height: 1.6;}
#main .s3-t small{margin-top: 4px; font-size: 14px; line-height: 1.7;}
#main .s3-d :is(b, em){font-weight: 550;}
#main .s3-d .tr{height: 10px;}
@media (max-width: 820px) {#main .s3-id h2{font-size: 28px;}
#main .s3-insl, #main .s3-tll{max-height: none; overflow: visible;}
#main .s360 :is(button, a, .s3-in, .s3-t){scroll-margin-block: 76px 104px;}}}
/* Adapted from aura-review-refined; CSS only. */
@media screen {#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]){font-family: "AURA Heebo", "Noto Sans Hebrew", sans-serif; font-synthesis: none; --line: color-mix(in srgb,var(--au-ring) 70%,transparent); --au-shadow: 0 12px 32px -26px color-mix(in srgb,var(--ink) 24%,transparent);}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) :is(h2, h3, button, input, select, textarea, .rev-name){font-family: inherit;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) > .head{padding: 24px 26px; border: 1px solid var(--line); border-radius: 22px; background: linear-gradient(115deg,var(--surface2),var(--accent-soft)); box-shadow: none; gap: 16px; flex-wrap: wrap;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) > .head h2{font-size: 32px; font-weight: 550; line-height: 1.4;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) .sub{font-size: 14px; line-height: 1.7; color: var(--au-sub);}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) :is(.card, .prev){border-radius: 18px;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) .card{min-width: 0px; padding: 20px; box-shadow: var(--au-shadow);}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) h3{font-weight: 550; line-height: 1.6;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) .note{font-size: 14px; line-height: 1.7; color: var(--au-mute);}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) .btn{min-height: 44px; font-weight: 500; border-radius: 12px;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) .btn[data-v="primary"]{background: var(--accent); box-shadow: none;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) .field > span{font-size: 14px; color: var(--au-sub); line-height: 1.6;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) :is(input, select, textarea){font-size: 16px; min-width: 0px; max-width: 100%; border-radius: 12px; min-height: 44px;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) textarea{min-height: 120px; line-height: 1.8;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) :is(button, input, select, textarea):focus-visible{outline: 2px solid var(--accent); outline-offset: 3px;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) .scroll{max-width: 100%; border: 1px solid var(--line); border-radius: 14px;}
#main:has([data-ch="revCls"]) table{min-width: 620px;}
#main:has([data-ch="revCls"]) :is(th, td){padding: 12px; line-height: 1.7;}
#main .rev-wrap{gap: 18px;}
#main .rev-name{font-weight: 550; font-size: 30px; line-height: 1.5; overflow-wrap: anywhere;}
#main .rev-wrap .lights{gap: 8px; margin-block: 20px 24px;}
#main .rev-wrap .lights button{border-width: 1px; min-width: 0px; min-height: 50px; font-size: 16px; font-weight: 500;}
#main .rev-wrap .lights button[data-on="1"]{font-weight: 650; box-shadow: currentcolor 0px 0px 0px 1px inset;}
#main .rev-wrap .lights button[data-on="1"][data-l="green"]{background: var(--tag-g); color: var(--tag-g-ink); border-color: var(--tag-g-ink);}
#main .rev-wrap .lights button[data-on="1"][data-l="yellow"]{background: var(--tag-y); color: var(--tag-y-ink); border-color: var(--tag-y-ink);}
#main .rev-wrap .lights button[data-on="1"][data-l="red"]{background: var(--tag-r); color: var(--tag-r-ink); border-color: var(--tag-r-ink);}
#main .rev-wrap .dom{display: grid; grid-template-columns: minmax(0px, 1fr) minmax(244px, auto); gap: 12px; padding-block: 16px; border-bottom-color: var(--line);}
#main .rev-wrap .dom-label{font-size: 16px; font-weight: 550; line-height: 1.6; overflow-wrap: anywhere;}
#main .rev-wrap .dom-label i{font-size: 13px; color: var(--au-mute);}
#main .rev-wrap .scale{display: grid; grid-template-columns: repeat(5, minmax(44px, 1fr)); gap: 6px;}
#main .rev-wrap .scale button{width: 100%; height: 46px; font-size: 16px; font-weight: 500; border-radius: 10px;}
#main .rev-wrap .scale button[data-on="1"]{background: var(--accent-soft); color: var(--au-title); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 650;}
#main .rev-wrap .prev{padding: 16px; font-size: 14px; line-height: 1.8; overflow-wrap: anywhere;}
@media (max-width: 820px) {#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) :is(button, input, select, textarea){scroll-margin-block: 76px 104px;}}
@media (max-width: 650px) {#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) > .head{padding: 20px 16px;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) > .head h2{font-size: 28px;}
#main:has([data-ch="revCls"], .rev-wrap, [data-act="rev-exit"]) .card{padding: 14px;}
#main .rev-name{font-size: 26px;}
#main .rev-wrap .dom{grid-template-columns: minmax(0px, 1fr); gap: 10px;}
#main .rev-wrap .scale{width: 100%;}}}
/* Adapted from aura-tasks-refined; CSS only. */
@media screen {#main:has(#taskText){font-family: "AURA Heebo", "Noto Sans Hebrew", sans-serif; font-synthesis: none; --line: color-mix(in srgb,var(--au-ring) 70%,transparent); --au-shadow: 0 12px 32px -26px color-mix(in srgb,var(--ink) 24%,transparent); --absent: var(--tag-r-ink);}
#main:has(#taskText) :is(h2, h3, button, input, select){font-family: inherit;}
#main:has(#taskText) > .head{padding: 24px 26px; border-radius: 22px; border: 1px solid var(--line); background: linear-gradient(115deg,var(--surface2),var(--accent-soft)); box-shadow: none;}
#main:has(#taskText) > .head h2{font-size: 32px; font-weight: 550; line-height: 1.4; margin-bottom: 8px;}
#main:has(#taskText) > .head h2::before{content: ""; display: block; width: 32px; height: 2px; margin-bottom: 14px; border-radius: 2px; background: linear-gradient(90deg,var(--hw-gold),var(--hw-gold2));}
#main:has(#taskText) .sub{font-size: 14px; line-height: 1.7; color: var(--au-sub);}
#main:has(#taskText) .card{min-width: 0px; padding: 20px; border-radius: 20px; box-shadow: var(--au-shadow);}
#main:has(#taskText) .card:has(#taskText) > .row{display: grid; grid-template-columns: minmax(0px, 1fr) minmax(150px, 190px) auto; gap: 12px;}
#main:has(#taskText) #taskText{grid-area: 1 / 1;}
#main:has(#taskText) #taskDue{grid-area: 1 / 2;}
#main:has(#taskText) [data-act="task-add"]{grid-area: 1 / 3;}
#main:has(#taskText) .card:has(#taskText) > .row > .hd{grid-area: 2 / 2; font-size: 12px; line-height: 1.5; color: var(--au-mute);}
#main:has(#taskText) :is(input, select){min-height: 46px; border-radius: 12px; font-size: 16px; max-width: 100%;}
#main:has(#taskText) .btn{min-height: 44px; border-radius: 12px; font-size: 14px; font-weight: 450;}
#main:has(#taskText) .btn[data-v="primary"]{background: var(--accent); box-shadow: none;}
#main:has(#taskText) [data-act="task-filter"][data-v="primary"]{background: var(--accent-soft); border-color: var(--accent); color: var(--au-title); font-weight: 550;}
#main:has(#taskText) :is(button, input, select):focus-visible{outline: 2px solid var(--accent); outline-offset: 3px;}
#main:has(#taskText) .task{display: grid; grid-template-columns: 44px minmax(0px, 1fr) auto; gap: 12px; padding: 18px 0px; border-bottom-color: var(--line); align-items: start;}
#main:has(#taskText) .task:last-child{border-bottom: 0px;}
#main:has(#taskText) .task-body > b{font-size: 17px; font-weight: 500; line-height: 1.7; overflow-wrap: anywhere;}
#main:has(#taskText) .task-body .note{display: block; margin-top: 6px; font-size: 14px; line-height: 1.7; color: var(--au-mute); overflow-wrap: anywhere;}
#main:has(#taskText) .task-body .note b{display: inline; font-weight: 450; text-decoration: none; color: var(--au-mute);}
#main:has(#taskText) .tick{width: 44px; height: 44px; margin-top: 0px; border-width: 1px; border-radius: 12px; font-size: 18px;}
#main:has(#taskText) .task[data-done="1"] .tick{background: var(--tag-g); border-color: var(--tag-g-ink); color: var(--tag-g-ink);}
#main:has(#taskText) .empty{padding: 36px 12px; color: var(--au-mute); font-size: 15px; line-height: 1.7;}
@media (max-width: 820px) {#main:has(#taskText) :is(button, input, select){scroll-margin-block: 76px 104px;}}
@media (max-width: 650px) {#main:has(#taskText) > .head{padding: 20px 16px;}
#main:has(#taskText) > .head h2{font-size: 28px;}
#main:has(#taskText) .card{padding: 14px;}
#main:has(#taskText) .card:has(#taskText) > .row{grid-template-columns: minmax(0px, 1fr) auto; gap: 10px;}
#main:has(#taskText) #taskText{grid-area: 1 / 1 / auto / -1;}
#main:has(#taskText) #taskDue{grid-area: 2 / 1;}
#main:has(#taskText) [data-act="task-add"]{grid-area: 2 / 2;}
#main:has(#taskText) .card:has(#taskText) > .row > .hd{grid-area: 3 / 1 / auto / -1;}
#main:has(#taskText) .card:has([data-act="task-filter"]) > .row{display: grid; grid-template-columns: repeat(3, minmax(0px, 1fr)); gap: 8px;}
#main:has(#taskText) [data-ch="taskOwner"]{grid-column: 1 / -1;}
#main:has(#taskText) .task{gap: 10px;}
#main:has(#taskText) .task-body > b{font-size: 16px;}}}

/* Bind the approved visual language to current main markup; no new UI or behaviour. */
body,button,input,select,textarea { font-family: "AURA Heebo","Noto Sans Hebrew",sans-serif; }
h1,h2,h3,h4,.stat b,.rev-name,.hebdate,.topbar .t b { font-family: inherit; font-weight: 550; }
body { font-weight: 400; }
main { padding-top: 26px; }
.head h2 { font-size: 30px; line-height: 1.4; }
.card { border-radius: 20px; box-shadow: 0 12px 32px -26px rgba(28,42,95,.22); }
.card h3 { line-height: 1.5; }
.sub,.note { line-height: 1.65; }
.field > span { font-size: 14px; line-height: 1.6; }
.btn { min-height: 44px; font-weight: 450; border-radius: 12px; }
.btn[data-v="primary"] { box-shadow: none; }
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.nav button { height: auto; min-height: 46px; padding: 10px 14px; font-size: 16px; font-weight: 500; line-height: 1.5; white-space: normal; }
.nav { gap: 6px; }
.nav button::before { content: ''; display: block; flex: 0 0 20px; width: 20px; height: 20px; background: currentColor; mask: var(--nav-icon) center/contain no-repeat; -webkit-mask: var(--nav-icon) center/contain no-repeat; }
.nav button:not([data-tab])::before { display: none; }
.seg button[data-on="1"][data-s="present"] { background: var(--tag-g); color: var(--tag-g-ink); box-shadow: inset 0 0 0 1px currentColor; }
.seg button[data-on="1"][data-s="late"] { background: var(--tag-y); color: var(--tag-y-ink); box-shadow: inset 0 0 0 1px currentColor; }
.seg button[data-on="1"][data-s="absent"] { background: var(--tag-r); color: var(--tag-r-ink); box-shadow: inset 0 0 0 1px currentColor; }
.seg button[data-on="1"][data-s="excused"] { background: var(--surface2); color: var(--au-sub); box-shadow: inset 0 0 0 1px currentColor; }
#main .s360,#main .s3-more { --au-card: inherit; --au-card-b: inherit; --au-ring: inherit; --au-title: inherit; --au-sub: inherit; --au-mute: inherit; --au-track: inherit; --au-gap: inherit; --au-r-hero: inherit; --au-r-panel: inherit; --au-panel: inherit; --au-panel-b: inherit; --hw-base: inherit; --hw-fade: inherit; --tag-g: inherit; --tag-g-ink: inherit; --tag-y: inherit; --tag-y-ink: inherit; --tag-r: inherit; --tag-r-ink: inherit; --ch-4: inherit; --ch-bar-a: inherit; --ch-bar-b: inherit; --ch-line: inherit; }
#main .dhero { border-radius: 22px; border-color: var(--line); background: linear-gradient(115deg,var(--surface2),var(--accent-soft)); }
#main .dhero h2 { font-size: 30px; font-weight: 550; }
#main .stat { border-radius: 18px; box-shadow: 0 10px 28px -24px rgba(28,42,95,.2); }
#main .stat b { font-weight: 550; }
#main .scroll { max-width: 100%; }
#sumDlg :is(h2,h3,.sum-sub) { font-weight: 550; }
@media (min-width:821px) and (max-width:1179px) {
  html:not(.nav-x) .side { width: 210px; flex-basis: 210px; }
  html:not(.nav-x) .brand { grid-template-columns: 52px auto; padding: 0 12px; }
  html:not(.nav-x) .brand h1,html:not(.nav-x) .brand::after { display: block; }
  html:not(.nav-x) .nav button { justify-content: flex-start; padding: 10px 12px; gap: 10px; }
  html:not(.nav-x) .nav button span { display: inline; }
  main { padding-top: 20px; }
}
@media (max-width:820px) {
  main { padding-top: 14px; }
  input,select,textarea { font-size: 16px; }
  .field input,.field select,.inp { min-width: 0; max-width: 100%; }
  .head h2,#main .dhero h2 { font-size: 27px; }
  .head,.row { min-width: 0; }
  .stat { min-width: 0; }
  .nav button { min-height: 44px; }
}
@media (prefers-color-scheme:dark) {
  .card { box-shadow: 0 12px 32px -26px rgba(0,0,0,.45); }
  #sumDlg .sum-error { color: var(--tag-r-ink); }
}

<script>
const K={config:'tt:config',students:'tt:students',staff:'tt:staff',att:'tt:attendance',reviews:'tt:reviews',tasks:'tt:tasks',timetable:'tt:timetable',latt:'tt:latt',events:'tt:events'};
/* ===== אחסון: מאגר משותף בענן (כשפתוח מהקישור) או הדפדפן (כקובץ) ===== */
let DB=null;
const LAST={};const WQ={};
const ARRKEYS={'tt:students':'students','tt:staff':'staff','tt:tasks':'tasks','tt:timetable':'timetable','tt:events':'events'};
const month=d=>String(d||'').slice(0,7)||'none';
const clone=o=>JSON.parse(JSON.stringify(o));
/* ===== Firebase ===== */
const FB_CONFIG={apiKey:"AIzaSyC1T3SBl84VJ9iMhXTgxpO2N0Vcw5VJpdk",authDomain:"nihul-mosad.firebaseapp.com",projectId:"nihul-mosad",
  storageBucket:"nihul-mosad.firebasestorage.app",messagingSenderId:"930039998457",appId:"1:930039998457:web:8d22bbc56c2feec9b2ff28"};
const OWNER_UID='OPqeXR8eV9fR5Js5TmaEwTyjlZ82',OWNER_EMAIL='admin@nihul-mosad.app',MAIL_DOMAIN='nihul-mosad.app';
let FS=null,AUTH=null;
function ukey(u){
  const t=String(u||'').trim().replace(/\s+/g,' ').replace(/[׳']/g,"'").replace(/[״"]/g,'"'),l=t.toLowerCase();
  if(/^[a-z0-9._-]+$/.test(l))return l;
  return 'h'+Array.from(new TextEncoder().encode(t)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function fsAdapter(base){
  const wrap=x=>({id:x.id,exists:x.exists,data:()=>x.data()});
  return {
    doc:p=>{const r=FS.doc(base+'/'+p);return{get:async()=>wrap(await r.get()),set:d=>r.set(d),update:d=>r.set(d,{merge:true})};},
    collection:p=>({get:async()=>{const q=await FS.collection(base+'/'+p).get();return{docs:q.docs.map(wrap)};}})
  };
}
function fbErr(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c))return 'שם משתמש או סיסמה שגויים';
  if(/too-many-requests/.test(c))return 'יותר מדי ניסיונות. נסו שוב בעוד כמה דקות';
  if(/network-request-failed|unavailable/.test(c))return 'אין חיבור לשרת. בדקו את האינטרנט (או חסימה בנטפרי)';
  if(/weak-password/.test(c))return 'הסיסמה חלשה מדי — לפחות 6 תווים';
  if(/requires-recent-login/.test(c))return 'כדי להחליף סיסמה צריך להתנתק ולהיכנס מחדש, ואז לנסות שוב';
  if(/permission-denied/.test(c))return 'אין הרשאה לפעולה הזו';
  if(/email-already-in-use/.test(c))return 'שם המשתמש כבר קיים במערכת';
  return 'שגיאה: '+(c||(e&&e.message)||'לא ידועה');
}
async function createAuthUser(inst,u,pass){
  const app2=firebase.apps.find(a=>a.name==='second')||firebase.initializeApp(FB_CONFIG,'second');
  const a2=app2.auth();
  try{await a2.setPersistence(firebase.auth.Auth.Persistence.NONE);}catch(e){}
  const email=ukey(u).slice(0,40)+'.'+Math.random().toString(36).slice(2,7)+'@'+inst+'.'+MAIL_DOMAIN;
  const c=await a2.createUserWithEmailAndPassword(email,pass);
  const id=c.user.uid;try{await a2.signOut();}catch(e){}
  return {uid:id,email:email};
}
async function reloadMembers(){
  if(!isAdmin()){S.config.users=[];return;}
  const q=await FS.collection('insts/'+S.inst+'/members').get();
  S.config.users=q.docs.map(d=>Object.assign({id:d.id},d.data())).filter(m=>m.active!==false)
    .map(m=>({id:m.id,user:m.user,role:m.role==='admin'?'admin':'teacher',cls:m.cls||'',teacher:m.teacher||'',rem:!!m.rem,_sync:JSON.stringify([(m.classes||[]).slice().sort(),(m.tclasses||[]).slice().sort(),(m.lclasses||[]).slice().sort(),m.tk||''])}));
}
async function createInst(code,name,adminUid,adminUser,adminEmail,classes){
  const b=FS.batch();
  b.set(FS.doc('insts/'+code),{name:name,created:firebase.firestore.FieldValue.serverTimestamp()});
  b.set(FS.doc('insts/'+code+'/members/'+adminUid),{user:adminUser,role:'admin',cls:'',active:true});
  b.set(FS.doc('logins/'+code+'_'+ukey(adminUser)),{email:adminEmail,inst:code,key:ukey(adminUser)});
  b.set(FS.doc('insts/'+code+'/store/config'),{v:{name:name,classes:classes||[],logo:'',domains:SEED_DOMAINS}});
  await b.commit();
}
function logAct(act,info){
  try{if(!FS||!S.inst||!S.me)return;
    FS.collection('insts/'+S.inst+'/log').add({ts:Date.now(),uid:S.me.id,user:S.me.user||'',act:act,info:String(info||'').slice(0,240)}).catch(()=>{});}catch(e){}
}
function enterSystem(user){
  S.inst=null;S.owner=true;S.instList=null;DB=null;
  S.config={name:'מסוף המערכת',classes:[],logo:'',users:[],domains:SEED_DOMAINS};
  S.students=[];S.staff=[];S.att={};S.latt={};S.reviews=[];S.tasks=[];S.timetable=[];S.events=[];S.evRoster=[];S.meetings=[];S.mtEdit=null;S.duty=null;S.dutyEdit=null;S.rem=null;S.remOpen=null;S.remDraft=null;S.remDirty=false;S.exams=[];S.exEdit=null;S.rc=null;S.daylog={};S.dm={};S.dlDate='';S.as=null;LIDX=null;
  S.me={id:user.uid,user:'בעל המערכת',role:'admin',cls:'',teacher:'',mustChange:false};
  S.tab='console';S.console=null;
  try{localStorage.setItem('tt:inst','system');localStorage.setItem('tt:instName','מסוף המערכת');}catch(e){}
  document.getElementById('login').style.display='none';document.getElementById('shell').classList.add('on');
  render();startProbe();return true;
}
async function enterInst(inst,user,typed){
  const owner=user.uid===OWNER_UID;
  if(inst==='system'){if(owner)return enterSystem(user);await AUTH.signOut();throw {code:'no-inst'};}
  let mem=null;
  try{mem=await FS.doc('insts/'+inst+'/members/'+user.uid).get();}catch(e){mem=null;}
  const isMem=mem&&mem.exists&&mem.data().active!==false;
  if(!isMem&&!owner){
    let pend=false;try{const rq=await FS.doc('insts/'+inst+'/requests/'+user.uid).get();pend=rq.exists;}catch(e){}
    await AUTH.signOut();throw {code:pend?'pending':'no-member'};
  }
  let isnap=await FS.doc('insts/'+inst).get();
  if(isnap.exists&&(isnap.data()||{}).disabled&&!owner){await AUTH.signOut();throw {code:'disabled'};}
  if(!isnap.exists){
    if(!owner){await AUTH.signOut();throw {code:'no-inst'};}
    if(!confirm('המוסד "'+inst+'" עוד לא קיים במערכת. ליצור אותו עכשיו?'))return false;
    await createInst(inst,'תלמוד תורה',user.uid,typed||'admin',OWNER_EMAIL,SEED_CLASSES.slice());
    isnap=await FS.doc('insts/'+inst).get();
    mem=await FS.doc('insts/'+inst+'/members/'+user.uid).get();
  }
  const m=(mem&&mem.exists)?mem.data():{user:'בעל המערכת',role:'admin',cls:''};
  S.inst=inst;S.owner=owner;S.instList=null;S.joinReqs=null;S.instLog=null;S.creds=null;S.bulk=null;
  DB=fsAdapter('insts/'+inst);
  Object.keys(LAST).forEach(k=>delete LAST[k]);
  let cfg=await load(K.config,null);
  if(!cfg){cfg={name:(isnap.data()||{}).name||'המוסד',classes:[],logo:'',domains:SEED_DOMAINS};await save(K.config,cfg);}
  S.config=cfg;
  if(!S.config.domains||!S.config.domains.length)S.config.domains=SEED_DOMAINS;
  if(!S.config.classes)S.config.classes=[];
  S.me={id:user.uid,user:m.user,role:m.role==='admin'?'admin':'teacher',cls:m.cls||'',teacher:m.teacher||'',rem:!!m.rem,mustChange:false};
  await reloadMembers();
  S.timetable=await load(K.timetable,[]);
  const sec=await loadSec();
  if(sec){remListen();setTimeout(function(){try{missCheck();}catch(e){}},8000);setTimeout(function(){try{dutyCheck();}catch(e){}},4000);}
  DATA_AT=Date.now();
  if(!sec){
    S.students=await load(K.students,[]);S.att=await load(K.att,{});S.reviews=await load(K.reviews,[]);S.tasks=await load(K.tasks,[]);S.latt=await load(K.latt,{});S.events=await load(K.events,[]);LIDX=null;
  }
  S.staff=isAdmin()?await load(K.staff,[]):[];S.markLesson=null;S.markView='lessons';S.ttInit=0;S.ttMode='class';S.ttTeacher='';
  try{localStorage.setItem('tt:inst',inst);localStorage.setItem('tt:instName',S.config.name||'');}catch(e){}
  S.tab=(isAdmin()||myClasses().length)?'dash':'mark';S.markCls=myClasses()[0]||'';S.revCls=myClasses()[0]||'';S.filter='';S.repCls='';S.revIdx=null;
  S.draft=Object.assign({},S.att[S.markDate]||{});S.dirty=!!UNSAVED[K.att];
  document.getElementById('login').style.display='none';
  document.getElementById('shell').classList.add('on');
  render();startProbe();
  return true;
}
function queued(path,fn){const p=(WQ[path]||Promise.resolve()).then(fn);WQ[path]=p.catch(()=>{});return p;}
async function dbMerge(path,body){
  return queued(path,async function(){
    const ref=DB.doc(path);
    for(let tries=0;tries<2;tries++){
      try{
        const snap=await ref.get();
        if(snap.exists)await ref.update(body);else await ref.set(body);
        return;
      }catch(e){
        if(e&&e.code==='unavailable'&&tries===0){await new Promise(r=>setTimeout(r,700+Math.random()*900));continue;}
        throw e;
      }
    }
  });
}
async function dbSet(path,body){
  return queued(path,async function(){
    try{await DB.doc(path).set(body);}
    catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800));await DB.doc(path).set(body);}else throw e;}
  });
}
function saveFailed(e){
  const c=e&&e.code;
  toast((c==='quota_exceeded'?'המאגר מלא — לא נשמר':c==='revoked'||c==='not_granted'||c==='permission-denied'?'אין הרשאה לשמור — השינוי לא נשמר':'השמירה נכשלה — בדקו את החיבור ונסו שוב'),1,7000);
}

/* ===== אחסון מופרד: כל מורה מקבל מהשרת רק את מה שמותר לו ===== */
const LD={};const SECKEYS={'tt:students':1,'tt:attendance':1,'tt:latt':1,'tt:reviews':1,'tt:tasks':1,'tt:events':1};
function hexs(t){return Array.from(new TextEncoder().encode(t)).map(b=>b.toString(16).padStart(2,'0')).join('');}
function keyify(x){const t=String(x||'').trim().replace(/\s+/g,' ');if(!t)return '0';const l=t.toLowerCase();if(/^[a-z0-9-]+$/.test(l))return l;return 'h'+hexs(t);}
const ckOf=c=>keyify(c||'');
const tkOf=t=>t?keyify(t):'';
function schoolMonths(){const n=new Date();const y=n.getFullYear(),m=n.getMonth()+1,sy=m>=8?y:y-1,out=[];let yy=sy,mm=8;
  while(yy<y||(yy===y&&mm<=m)){out.push(yy+'-'+String(mm).padStart(2,'0'));mm++;if(mm>12){mm=1;yy++;}}return out;}
const IB=()=>'insts/'+S.inst+'/';
function nn(m){const o={};Object.keys(m||{}).forEach(k=>{if(m[k]!=null)o[k]=m[k];});return o;}
function nn2(d){const o={};Object.keys(d||{}).forEach(k=>{const x=nn(d[k]);if(Object.keys(x).length)o[k]=x;});return o;}
async function fsGet(p){const d=await FS.doc(IB()+p).get();return d.exists?(d.data()||{}):null;}
async function fsList(c){const q=await FS.collection(IB()+c).get();return q.docs.map(d=>({id:d.id,data:d.data()||{}}));}
async function inChunks(items,fn,n){for(let i=0;i<items.length;i+=n)await Promise.all(items.slice(i,i+n).map(fn));}
function teachClasses(t){t=t===undefined?S.me.teacher:t;const o={};S.timetable.forEach(l=>{if(t&&l.teacher===t)(l.classes||[]).forEach(c=>o[c]=1);});return Object.keys(o);}
async function writeDoc(path,field,depth,newMap,order){
  const prev=LD[path]||{},pairs=[],J=JSON.stringify,DEL=firebase.firestore.FieldValue.delete();
  const keys=Array.from(new Set(Object.keys(prev).concat(Object.keys(newMap))));
  if(depth===1)keys.forEach(k=>{const a=prev[k],b=newMap[k];if(b===undefined){if(a!==undefined)pairs.push([[field,k],DEL]);}else if(J(a)!==J(b))pairs.push([[field,k],b]);});

const HMONTHS=[['תשרי'],['חשוון','חשון','מרחשוון','מרחשון'],['כסלו','כסליו'],['טבת'],['שבט'],['אדר א׳',"אדר א'",'אדר א','אדר ראשון'],['אדר ב׳',"אדר ב'",'אדר ב','אדר שני'],['אדר'],['ניסן'],['אייר'],['סיוון','סיון'],['תמוז'],['אב','מנחם אב'],['אלול']];
function hmNorm(m){m=String(m||'').trim().replace(/^ב(?=[^ ]{2,})/,'');const f=HMONTHS.find(v=>v.some(x=>x===m));return f?f[0]:m;}
function gemVal(t){const V={א:1,ב:2,ג:3,ד:4,ה:5,ו:6,ז:7,ח:8,ט:9,י:10,כ:20,ך:20,ל:30,מ:40,ם:40,נ:50,ן:50,ס:60,ע:70,פ:80,ף:80,צ:90,ץ:90,ק:100,ר:200,ש:300,ת:400};
  return String(t).split('').reduce((a,c)=>a+(V[c]||0),0);}
function birthRaw(s){const x=s.extra||{};const k=Object.keys(x).find(k=>/לידה/.test(k));return k?String(x[k]==null?'':x[k]).trim():'';}
function birthIso(t){
  const mk=(y,mo,d)=>{if(mo<1||mo>12||d<1||d>31||y<1900)return '';const o=new Date(y,mo-1,d,12);return o.getMonth()===mo-1?iso(o):'';};
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return mk(+m[1],+m[2],+m[3]);
  m=t.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2,4})$/);
  if(m){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=y>40?1900:2000;return a<=12&&b>12?mk(y,a,b):mk(y,b,a);}
  if(/^\d{5}$/.test(t)){const o=new Date(Date.UTC(1899,11,30)+(+t)*864e5);return mk(o.getUTCFullYear(),o.getUTCMonth()+1,o.getUTCDate());}
  return '';
}
const HBC={};
function hebBirth(s){
  const raw=birthRaw(s);if(!raw)return null;if(HBC[s.id]&&HBC[s.id].raw===raw)return HBC[s.id].v;
  let v=null;const g=birthIso(raw);
  if(g){const p=hebParts(g);if(p&&p.d)v={d:p.d,m:hmNorm(p.m),y:p.y};}
  else if(/[א-ת]/.test(raw)){ // תאריך עברי שנכתב בכרטיס, למשל ב' חשוון תשע"ו
    const w=raw.replace(/["'׳״]/g,'').split(/\s+/).filter(Boolean),d=gemVal(w[0]);
    for(let i=w.length;i>1;i--){const mm=hmNorm(w.slice(1,i).join(' '));if(HMONTHS.some(x=>x[0]===mm)&&d>=1&&d<=30){v={d:d,m:mm,y:null};break;}}
  }
  HBC[s.id]={raw:raw,v:v};return v;
}

function birthdaysAhead(list,days){
  const out=[],cand=[];
  for(let i=0;i<=days;i++){const dt=new Date();dt.setDate(dt.getDate()+i);const d=iso(dt);const pv=new Date(dt);pv.setDate(pv.getDate()-1);
    const p=hebParts(d),q=hebParts(iso(pv));if(p&&p.d)cand.push({i:i,d:d,p:{d:p.d,m:hmNorm(p.m),y:p.y},q:q&&q.d?{d:q.d,m:hmNorm(q.m)}:null});}
  list.forEach(function(s){const b=hebBirth(s);if(!b)return;
    const c=cand.find(c=>(c.p.d===b.d&&hbMonthEq(b.m,c.p.m))||(b.d===30&&c.p.d===1&&c.q&&c.q.d===29&&hbMonthEq(b.m,c.q.m)));
    if(c)out.push({s:s,b:b,i:c.i,d:c.d,age:b.y?c.p.y-b.y:null});});
  return out.sort((a,b)=>a.i-b.i||a.s.name.localeCompare(b.s.name,'he'));
}

  try{REM_UNSUB=FS.doc(IB()+'tasks/'+S.me.id).onSnapshot(function(sn){
    const n=((sn.exists&&sn.data())||{}).n||{},now=Date.now(),upd=[];
    Object.keys(n).forEach(function(id){const r=n[id];if(!r)return;
      if(!r.ts||r.ts<now-7*864e5){upd.push(new firebase.firestore.FieldPath('n',id),firebase.firestore.FieldValue.delete());return;}
      if(!r.seen&&r.ts>now-864e5&&!REM_SHOWN[id]){REM_SHOWN[id]=1;remPopup(r);upd.push(new firebase.firestore.FieldPath('n',id,'seen'),now);}

    const dm=((sn.exists&&sn.data())||{}).dm||{};let ch=false;S.dm=S.dm||{};
    Object.keys(dm).forEach(k=>{if(dm[k]&&!S.dm[k]){S.dm[k]=dm[k];ch=true;}});

function dashNow(){
  const hm=nowHM(),P=periods().filter(p=>p.start);if(!P.length)return '';
  const cur=P.find(p=>p.start<=hm&&(!p.end||hm<p.end));
  if(cur)return 'עכשיו: שיעור '+cur.n+' · עד '+cur.end;
  const next=P.find(p=>p.start>hm);
  if(next)return hm<P[0].start?'יום הלימודים מתחיל ב־'+P[0].start:'הפסקה · שיעור '+next.n+' מתחיל ב־'+next.start;
  return 'יום הלימודים הסתיים';
}
/* תלמידים במעקב: נוכחות נמוכה, אדום בתמונת מצב, אירועים לשיפור */
function dashWatch(list,today){
  const from=daysAgo(30),out=[];
  list.forEach(function(s){
    const a=attStats(s.id,from,today),r=lastReview(s.id),why=[];let sc=0;
    if(a.total>=6&&a.pct!==null&&a.pct<90){why.push(['absent',a.pct+'% נוכחות']);sc+=(90-a.pct)/5;}
    if(r&&r.light==='red'){why.push(['red','אדום בתמונת מצב']);sc+=4;}
    const ne=S.events.filter(e=>e.sid===s.id&&e.kind==='neg'&&e.date>=from);
    if(ne.length){const w=ne.reduce((x,e)=>x+(e.sev||1),0);if(w>=2){why.push(['late',ne.length+' אירועים לשיפור']);sc+=w;}}
    if(why.length)out.push({s:s,why:why,sc:sc});
  });
  return out.sort((a,b)=>b.sc-a.sc);
}
function dashTrend(list){
  const ids={};list.forEach(s=>ids[s.id]=1);
  const dates=Array.from(new Set(Object.keys(S.att).concat(Object.keys(S.latt)))).filter(d=>d<=iso(new Date())).sort().slice(-12);
  return dates.map(function(d){let p=0,n=0;list.forEach(s=>{const v=dayStatus(s.id,d);if(!v)return;n++;if(v==='present'||v==='late')p++;});return {d:d,n:n,pct:n?Math.round(p/n*100):null};}).filter(x=>x.n);
}

/* ================= כרטיס תלמיד ================= */
/* כללי התובנות של כרטיס התלמיד (לוגיקה בלבד, מועתק מענף העיצוב) — משמשים את סיכום התלמיד */
const S360_RULES={lowAtt:90,attDrop:5,lates14:3,neg14:3,pos14:2,staleDays:21,domDrop:2};
function s360Insights(s,ctx){
  const R=S360_RULES,out=[];const c=ctx;
  if(c.a30.pct!==null&&c.a30.pct<R.lowAtt)out.push({lv:'risk',t:'נוכחות נמוכה',why:'נוכחות של '+c.a30.pct+'% ב-30 הימים האחרונים — מתחת לסף '+R.lowAtt+'%.'});
  if(c.a30.pct!==null&&c.a30p.pct!==null&&c.a30p.pct-c.a30.pct>=R.attDrop)out.push({lv:'warn',t:'ירידה בנוכחות',why:c.a30.pct+'% ב-30 הימים האחרונים לעומת '+c.a30p.pct+'% ב-30 הימים שלפניהם (ירידה של '+(c.a30p.pct-c.a30.pct)+' נקודות; סף: '+R.attDrop+').'});
  if(c.a14.late>=R.lates14)out.push({lv:'warn',t:'דפוס איחורים',why:c.a14.late+' איחורים לשיעורים ב-14 הימים האחרונים (סף: '+R.lates14+').'});
  if(c.neg14>=R.neg14)out.push({lv:'risk',t:'ריבוי אירועים לשיפור',why:c.neg14+' אירועים לשיפור ב-14 הימים האחרונים (סף: '+R.neg14+').'});
  if(c.sevOpen)out.push({lv:'risk',t:'אירוע חמור שלא טופל',why:c.sevOpen+' אירועים בחומרה גבוהה עדיין לא סומנו כמטופלים.'});
  if(!c.last)out.push({lv:'info',t:'אין תמונת מצב',why:'עוד לא נרשמה תמונת מצב לתלמיד.'});
  else{
    const age=Math.round((new Date(iso(new Date())+'T12:00:00')-new Date(c.last.date+'T12:00:00'))/864e5);
    if(age>R.staleDays)out.push({lv:'info',t:'תמונת מצב לא עדכנית',why:'תמונת המצב האחרונה נרשמה לפני '+age+' ימים (סף: '+R.staleDays+').'});
    if(c.last.light==='red')out.push({lv:'risk',t:'רמזור אדום',why:'בתמונת המצב האחרונה ('+shortDate(c.last.date)+') סומן רמזור אדום.'});
    if(c.prev)domains().forEach(function(d){const a=c.prev.scores&&c.prev.scores[d.id],b=c.last.scores&&c.last.scores[d.id];
      if(a&&b&&a-b>=R.domDrop)out.push({lv:'warn',t:'ירידה ב'+d.name,why:'הציון ירד מ-'+a+' ל-'+b+' בין שתי תמונות המצב האחרונות (סף: ירידה של '+R.domDrop+').'});
      if(a&&b&&b-a>=R.domDrop)out.push({lv:'good',t:'שיפור ב'+d.name,why:'הציון עלה מ-'+a+' ל-'+b+' בין שתי תמונות המצב האחרונות.'});});
  }
  if(c.pos14>=R.pos14)out.push({lv:'good',t:'מגמה חיובית',why:c.pos14+' אירועים לשבח ב-14 הימים האחרונים (סף: '+R.pos14+').'});
  if(!out.some(x=>x.lv==='risk'||x.lv==='warn'))out.push({lv:'good',t:'אין חריגות',why:'נבדקו כללי נוכחות, איחורים, אירועים ותמונת מצב — לא נמצאה חריגה.'});
  const ord={risk:0,warn:1,info:2,good:3};return out.sort((a,b)=>ord[a.lv]-ord[b.lv]);
}
/* ===== סיכום תלמיד להורים (AI) — רק למנהל =====
   1. החבילה נבנית כאן: בלי שם התלמיד, בלי שמות הורים ובלי טלפונים. שמות שמופיעים בהערות מוחלפים,
      וטלפונים / מספרי זהות נמחקים. לפני השליחה נבדק שוב שאין בחבילה שם או מספר.
   2. הפונקציה studentSummary בשרת בודקת הרשאה, מנקה שוב ושולחת ל-Claude (המפתח רק בשרת).
   3. התשובה היא טיוטה לעריכה. המערכת מחליפה את {{שם}} בשם התלמיד רק כאן, במחשב.
   4. שמירה: PDF לתיקייה "סיכומי תלמידים" במחשב (Chrome/Edge — בחירת מיקום פעם אחת); בדפדפן אחר — הורדה רגילה.
   ה-PDF נבנה בלי ספריות חיצוניות: כל עמוד מצויר כתמונה (לכן הטקסט בקובץ אינו ניתן לסימון). */
const SUM_DIR='סיכומי תלמידים',SUM_TOKEN='{{שם}}';
let SUMS=null;
const SUM_HB='\\u0590-\\u05FFA-Za-z0-9';
function sumRx(w){return new RegExp('(^|[^'+SUM_HB+'])([ובכלמשה]{0,2})'+String(w).trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'(?=$|[^'+SUM_HB+'])','g');}
function sumNames(s){
  const other=S.students.concat(S.evRoster||[]).filter(x=>x.id!==s.id).map(x=>x.name);
  const staff=[].concat(S.staff.map(x=>x.name),S.timetable.map(l=>l.teacher),Object.values(S.config.homeroom||{}),(S.config.users||[]).map(u=>u.teacher||u.user),[S.me.teacher,S.me.user]);
  const L=(a,by)=>a.filter(n=>n&&String(n).trim().length>1).map(n=>[String(n).trim(),by]);
  const own=String(s.name||'').trim();
  // מהארוך לקצר, כדי ששם מלא יוחלף לפני חלק ממנו
  return L(other,'תלמיד אחר').concat(L([s.father,s.mother],'ההורה'),L(staff,'המורה'),L(own?[own]:[],'התלמיד'),L(own.split(/\s+/).filter(w=>w.length>2),'התלמיד'))
    .sort((a,b)=>b[0].length-a[0].length);
}
function sumScrub(t,names){
  let x=String(t||'');
  x=x.replace(/(?:\+?972[-\s]?|0)(?:[23489]|5\d|7\d)[-\s]?\d{3}[-\s]?\d{4}/g,'[מספר הוסר]').replace(/(?<!\d)\d{9}(?!\d)/g,'[מספר הוסר]');
  names.forEach(function(p){x=x.replace(sumRx(p[0]),'$1$2'+p[1]);});
  return x;
}
function sumSchoolYear(){const d=new Date(),y=d.getMonth()>=8?d.getFullYear():d.getFullYear()-1;return y+'-09-01';}
function sumPacket(s){
  const today=iso(new Date()),names=sumNames(s),revs=reviewsOf(s.id),last=revs[revs.length-1]||null,prev=revs[revs.length-2]||null;
  const a30=attStats(s.id,daysAgo(29),today),a30p=attStats(s.id,daysAgo(59),daysAgo(30)),a14=attStats(s.id,daysAgo(13),today),aY=attStats(s.id,sumSchoolYear(),today);
  const ev=S.events.filter(e=>e.sid===s.id);
  const pos14=ev.filter(e=>e.date>=daysAgo(13)&&e.kind==='pos').length,neg14=ev.filter(e=>e.date>=daysAgo(13)&&e.kind!=='pos').length,sevOpen=ev.filter(e=>e.kind!=='pos'&&e.sev>=3&&!e.handled).length;
  const ins=s360Insights(s,{a30:a30,a30p:a30p,a14:a14,neg14:neg14,pos14:pos14,sevOpen:sevOpen,last:last,prev:prev});
  const dn={};domains().forEach(d=>{dn[d.id]=d.name;});
  const A=a=>({pct:a.pct,present:a.present,late:a.late,absent:a.absent,excused:a.excused,total:a.total});
  return {
    cls:s.cls||'',period:{from:daysAgo(29),to:today},
    attendance:{last30:A(a30),prev30:A(a30p),year:A(aY)},
    events:ev.filter(e=>e.date>=daysAgo(90)).sort((a,b)=>(b.date+(b.time||''))>(a.date+(a.time||''))?1:-1).slice(0,30)
      .map(e=>({date:e.date,kind:e.kind==='pos'?'pos':'neg',type:e.typeName||'',severity:e.sev||null,handled:!!e.handled,note:sumScrub(e.note,names)})),
    snapshots:revs.slice(-4).map(r=>{const sc={};Object.keys(r.scores||{}).forEach(k=>{if(dn[k]&&typeof r.scores[k]==='number')sc[dn[k]]=r.scores[k];});
      return {date:r.date,light:LIGHTNAME[r.light]||'',scores:sc,note:sumScrub(r.note,names)};}),
    scale:'1 (נמוך) עד 5 (גבוה)',
    insights:ins.map(i=>({level:i.lv,title:i.t,why:sumScrub(i.why,names)}))
  };
}
// בדיקה אחרונה לפני שליחה: אין שם של התלמיד או של הוריו, ואין טלפון או מספר זהות
function sumLeak(p,s){
  const j=JSON.stringify(p),bad=[];
  [s.name].concat(String(s.name||'').split(/\s+/).filter(w=>w.length>2),s.father,s.mother).filter(Boolean).forEach(n=>{if(sumRx(n).test(j))bad.push(n);});
  if(/(?:\+?972[-\s]?|0)(?:[23489]|5\d|7\d)[-\s]?\d{3}[-\s]?\d{4}/.test(j)||/(?<!\d)\d{9}(?!\d)/.test(j))bad.push('מספר');
  return bad;
}
function sumFacts(p){
  const a=p.attendance.last30,pos=p.events.filter(e=>e.kind==='pos').length,neg=p.events.length-pos,l=p.snapshots[p.snapshots.length-1];
  return [['נוכחות · 30 יום',a.pct===null?'אין רישומים':a.pct+'% ('+(a.present+a.late)+' מתוך '+a.total+' סימונים)'],
    ['אירועים · 90 יום',p.events.length?pos+' לשבח · '+neg+' לשיפור':'אין'],
    ['תמונות מצב',p.snapshots.length?p.snapshots.length+' (האחרונה '+l.date.slice(8,10)+'.'+l.date.slice(5,7)+(l.light?' · '+l.light:'')+')':'אין'],
    ['תובנות',p.insights.map(i=>i.title).join(' · ')||'—']];
}

async function sumClick(e){
  const b=e.target.closest('[data-sum]');if(!b||!SUMS)return;const a=b.dataset.sum;
  if(a==='close'){if(SUMS.phase!=='busy')sumClose();return;}

  if(a==='pick')return sumSave(true);
  if(a==='share')return sumShare();
