  {let f={n:0,l:0},o={n:0,l:0};recs.forEach(r=>{if(!(r.per>0&&r.per<99))return;const x=r.per===PN[0]?f:o;x.n++;if(r.v==='late')x.l++;});

/* פירוט לפי שבועות: כל מבחן בשורה, ממוצע שבועי, נוכחות השבוע, וסיכום לכל חודש עברי */
function rcWeeks(s,ex,from,to){
  const today=iso(new Date()),end=to<today?to:today,W={},wk=[];
  const wsOf=d=>{const o=new Date(d+'T12:00:00');o.setDate(o.getDate()-o.getDay());return iso(o);};
  const addW=ws=>{if(!W[ws]){W[ws]={ws:ws,ex:[]};wk.push(ws);}return W[ws];};
  ex.forEach(x=>addW(wsOf(x.date)).ex.push(x));
  // שבועות שנרשמה בהם נוכחות
  const ids={};Object.keys(S.latt).concat(Object.keys(S.att)).forEach(d=>{if(d<from||d>end)return;const L=S.latt[d]||{},D=S.att[d]||{};
    if(D[s.id]||Object.keys(L).some(k=>k.slice(k.indexOf(':')+1)===s.id))ids[wsOf(d)]=1;});
  Object.keys(ids).forEach(addW);
  wk.sort();if(!wk.length)return '<div class="empty">אין רישומים בתקופה הזו.</div>';
  const mOf=ws=>{const p=hebParts(ws);return p?p.m+' '+gem(p.y%1000):ws.slice(0,7);};
  const M={},mo=[];wk.forEach(ws=>{const m=mOf(ws);if(!M[m]){M[m]=[];mo.push(m);}M[m].push(ws);});
  const pct=x=>grPct(x,x.g[s.id]);
  const sc=x=>{const v=x.g[s.id],p=pct(x);return p===null?'<span class="note">'+esc(v)+'</span>':'<b style="color:'+grColor(p)+'">'+esc(v)+'</b>'+((+x.max||100)!==100?' <span class="note">/'+x.max+'</span>':'');};
  const attTxt=a=>a.total?(a.pct+'% נוכחות'+(a.absent?' · '+a.absent+' חיסורים':'')+(a.late?' · '+a.late+' איחורים':'')):'לא נרשמה נוכחות';
  let rows='';
  mo.forEach(function(m){
    const mex=[];
    M[m].forEach(function(ws){
      const w=W[ws],we=(()=>{const o=new Date(ws+'T12:00:00');o.setDate(o.getDate()+5);return iso(o);})();
      const a=attStats(s.id,ws<from?from:ws,we>end?end:we),par=Array.from(new Set(w.ex.map(x=>x.parasha).filter(Boolean)));
      const xs=w.ex.slice().sort((p,q)=>String(p.date).localeCompare(String(q.date)));mex.push(...xs);
      rows+='<tr class="rcw"><td colspan="4"><b>שבוע '+esc(hebShort(ws))+' – '+esc(hebShort(we))+'</b> <span class="note">('+esc(ws.slice(8,10)+'.'+ws.slice(5,7))+'–'+esc(we.slice(8,10)+'.'+we.slice(5,7))+')</span>'+
        (par.length?' · פרשת '+esc(par.join(', ')):'')+'</td><td class="note">'+esc(attTxt(a))+'</td></tr>';
      rows+=xs.length?xs.map(x=>'<tr><td>'+esc(shortDate(x.date))+'</td><td><b>'+esc(x.subject)+'</b></td><td>'+esc(x.title||'')+(x.parasha&&par.length>1?' <span class="note">('+esc(x.parasha)+')</span>':'')+'</td><td>'+sc(x)+'</td><td></td></tr>').join('')+
          (xs.length>1?'<tr class="rcwa"><td colspan="3">ממוצע שבועי</td><td><b style="color:'+grColor(avg(xs.map(pct)))+'">'+(avg(xs.map(pct))===null?'—':avg(xs.map(pct)))+'</b></td><td></td></tr>':'')
        :'<tr><td colspan="5" class="note">לא היו מבחנים השבוע</td></tr>';
    });
    const mf=M[m][0]<from?from:M[m][0],ml=(()=>{const o=new Date(M[m][M[m].length-1]+'T12:00:00');o.setDate(o.getDate()+5);const x=iso(o);return x>end?end:x;})();
    const ma=attStats(s.id,mf,ml),mv=avg(mex.map(pct));
    rows+='<tr class="rcm"><td colspan="3">סיכום חודש '+esc(m)+' · '+mex.length+' מבחנים</td><td>'+(mv===null?'—':'<b>'+mv+'</b>')+'</td><td>'+esc(attTxt(ma))+'</td></tr>';
  });
  return '<div class="scroll"><table class="rct"><thead><tr><th>תאריך</th><th>מקצוע</th><th>נושא</th><th>ציון</th><th>נוכחות</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

  const clsRows=S.config.classes.map(function(c){
    const st=S.students.filter(s=>s.cls===c);if(!st.length)return '';
    const ab=[],lt=[];let m=0,p=0;st.forEach(s=>{const v=dayStatus(s.id,d);if(!v)return;m++;if(v==='present'||v==='late')p++;if(v==='absent')ab.push(s.name);else if(v==='late')lt.push(s.name);});

  const missT={};miss.forEach(l=>{const t=l.teacher||'ללא מורה';(missT[t]=missT[t]||[]).push(l.period);});
  const exs=S.exams.filter(e=>e.date===d);

/* ================= עוזר אישי: שיחות וואטסאפ (אבן דרך B) =================
   ייבוא ידני של קובצי ייצוא (TXT / MD) בלבד. אין AI, אין מייל, אין חיבור לוואטסאפ.
   אחסון: insts/{מוסד}/assist/{uid}/... — לפי חוקי האבטחה רק המשתמש עצמו (ורק אם הוא מנהל) קורא וכותב.
     convs/{convId}    שיחה: שם תצוגה, שמות מקור שנקלטו, מונים
     chunks/{chunkId}  מקטע הודעות של שיחה: מחרוזת JSON אחת (עד ~900KB), כדי לא לעבור את מגבלת 1MB
                       ואת מגבלת מספר השדות/האינדקסים של Firestore
     imports/{id}      דוח לכל ייבוא: נוספו, כפולות, כפולות אפשריות, שגיאות */
const AS_CHUNK_BYTES=900000;
const AS_BIDI=/[‎‏‪-‮⁦-⁩﻿]/g;
const AS_MONTHS={'בינואר':1,'בפברואר':2,'במרץ':3,'במרס':3,'באפריל':4,'במאי':5,'ביוני':6,'ביולי':7,'באוגוסט':8,'בספטמבר':9,'באוקטובר':10,'בנובמבר':11,'בדצמבר':12};
function asBase(){return IB()+'assist/'+S.me.id+'/';}
function asId(){const a=new Uint8Array(9);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(36).padStart(2,'0')).join('').slice(0,14);}
const asBytes=s=>new TextEncoder().encode(s).length;
async function asRetry(fn,tries){let e;for(let i=0;i<(tries||3);i++){try{return await fn();}catch(x){e=x;if(/permission|invalid/.test((x&&x.code)||''))break;await new Promise(r=>setTimeout(r,600*Math.pow(2,i)));}}throw e;}
async function asHash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b).slice(0,10),x=>x.toString(16).padStart(2,'0')).join('');}

/* ---------- ניתוח קבצים ---------- */
function asNormSender(s){return String(s||'').replace(AS_BIDI,'').replace(/\s+/g,' ').trim().normalize('NFC');}
function asNormBody(b){
  let t=String(b||'').replace(/\r/g,'').replace(AS_BIDI,'').normalize('NFC');
  t=t.replace(/\\([*_`~\[\]#>|-])/g,'$1');                          // סימני markdown מוברחים בייצוא MD
  t=t.replace(/\s*<(?:This message was edited|ההודעה נערכה|הודעה זו נערכה)>\s*$/i,'');
  t=t.split('\n').map(x=>x.trim()).join('\n').replace(/\n+$/,'').replace(/^\n+/,'');
  const one=t.replace(/\s+/g,' ').trim();
  if(one.length<60&&/^<?[^<>]*(omitted|הושמט|הושמטה|הושמטו)[^<>]*>?$/i.test(one))return '<מדיה>';
  return one;
}
function asTxtParse(text){
  const re=/^\[?(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp]\.?\s?[Mm]\.?|לפנה["״׳']?צ|אחה["״׳']?צ)?\]?\s*(?:[-–]\s*)?(.*)$/;
  const lines=text.replace(/\r/g,'').split('\n'),hits=[];let dmy=0,mdy=0;
  lines.forEach((ln,i)=>{const m=ln.replace(AS_BIDI,'').match(re);if(m){hits.push([i,m]);if(+m[1]>12)dmy++;if(+m[2]>12)mdy++;}});
  const order=mdy>dmy?'mdy':'dmy',out=[],bad=[];let cur=null,sys=0;
  const at={};hits.forEach(h=>at[h[0]]=h[1]);
  lines.forEach(function(ln,i){
    const m=at[i];
    if(!m){if(cur)cur.b+='\n'+ln;else if(ln.trim())bad.push(i+1);return;}
    if(cur){out.push(cur);cur=null;}
    let d=+m[1],mo=+m[2],y=+m[3],h=+m[4];if(order==='mdy'){const x=d;d=mo;mo=x;}if(y<100)y+=2000;
    const ap=(m[7]||'').toLowerCase();if(ap){const pm=/^p|אחה/.test(ap);h=h%12+(pm?12:0);}
    if(mo<1||mo>12||d<1||d>31||h>23){bad.push(i+1);return;}
    const p=m[8].match(/^(.{1,120}?):\s([\s\S]*)$/)||m[8].match(/^(.{1,120}?):()$/);
    if(!p){sys++;return;}                                                 // הודעות מערכת (הצטרפות, הצפנה וכו')
    cur={day:y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'),hm:String(h).padStart(2,'0')+':'+m[5],sec:m[6]||'',n:p[1],b:p[2]};
  });
  if(cur)out.push(cur);
  return {msgs:out,bad:bad,sys:sys,order:order,prec:hits.some(h=>h[1][6])?'sec':'min'};
}
function asMdParse(text){
  const out=[],bad=[];let day='',cur=null,sys=0,title='';
  text.replace(/\r/g,'').split('\n').forEach(function(raw,i){
    const ln=raw.replace(AS_BIDI,'');
    let m=ln.match(/^#\s+(.+)$/);if(m&&!/^##/.test(ln)){const t=m[1].match(/WhatsApp:?\s*(.+)$/);title=(t?t[1]:m[1]).trim();return;}
    m=ln.match(/^##\s+.*?(\d{1,2})\s+(ב\S+)\s+(\d{4})/);
    if(m){if(cur){out.push(cur);cur=null;}const mo=AS_MONTHS[m[2]];day=mo?m[3]+'-'+String(mo).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'):'';if(!mo)bad.push(i+1);return;}
    m=ln.match(/^\s*\[(\d{1,2}):(\d{2})(?::(\d{2}))?\]\s+\*\*(.+?):\*\*\s?(.*)$/);
    if(m&&day){if(cur)out.push(cur);cur={day:day,hm:String(+m[1]).padStart(2,'0')+':'+m[2],sec:m[3]||'',n:m[4],b:m[5]};return;}
    if(/^\s*\[(\d{1,2}):(\d{2})/.test(ln)&&day){if(cur){out.push(cur);cur=null;}sys++;return;}
    if(cur)cur.b+='\n'+raw;else if(ln.trim()&&!/^---+$/.test(ln.trim()))bad.push(i+1);
  });
  if(cur)out.push(cur);
  return {msgs:out,bad:bad,sys:sys,order:'',prec:out.some(x=>x.sec)?'sec':'min',title:title};
}
function asSourceName(fname,title){
  if(title)return title;
  return String(fname||'').replace(/\.(txt|md)$/i,'').replace(/^WhatsApp Chat (with|-)\s*/i,'').replace(/^צ['׳]אט (WhatsApp )?עם\s*/,'').replace(/_/g,' ').trim()||'שיחה ללא שם';
}
async function asParseFile(file){
  const raw=await file.text(),md=/\.md$/i.test(file.name)||/^\s*#\s/.test(raw);
  const r=md?asMdParse(raw):asTxtParse(raw);
  r.fmt=md?'md':'txt';r.file=file.name;r.source=asSourceName(file.name,r.title);
  r.msgs=r.msgs.map(x=>Object.assign(x,{n:asNormSender(x.n),b:String(x.b).replace(/\n+$/,'')})).filter(x=>x.n&&asNormBody(x.b));
  r.msgs.forEach(x=>x.t=x.day+'T'+x.hm);
  const ts=r.msgs.map(x=>x.t).sort();r.first=ts[0]||'';r.last=ts[ts.length-1]||'';
  return r;
}
/* מפתח יציב להודעה: שיחה + דקה מדויקת + דובר + תוכן מנורמל + מספר מופע.
   "מספר מופע" מבדיל בין הודעות זהות לגיטימיות באותה דקה, ונשמר זהה בייצוא חוזר של אותה שיחה (TXT או MD) */
async function asKeys(conv,msgs){
  const occ={};
  for(const x of msgs){const base=x.t+'|'+asNormSender(x.n)+'|'+asNormBody(x.b);x.o=occ[base]=(occ[base]===undefined?0:occ[base]+1);x.k=await asHash(conv+'|'+base+'|'+x.o);x.sb=asNormSender(x.n)+'|'+asNormBody(x.b);}
  return msgs;
}
const asMin=t=>Math.round(Date.parse(t+':00Z')/60000);

/* ---------- טעינה ושמירה ---------- */
async function asLoadMeta(){
  S.as=S.as||{};S.as.err='';
  try{
    const c=await FS.collection(asBase()+'convs').get(),im=await FS.collection(asBase()+'imports').get();
    S.as.convs=c.docs.map(d=>Object.assign({id:d.id},d.data()));
    S.as.imports=im.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(b.at||0)-(a.at||0));
    S.as.loaded=true;
  }catch(e){S.as.err=/permission/.test((e&&e.code)||'')?'אין הרשאה. צריך לעדכן את חוקי האבטחה ב-Firebase (החלק של assist).':fbErr(e);S.as.convs=S.as.convs||[];S.as.imports=S.as.imports||[];}
}
async function asLoadConv(cid){
  S.as.msgs=S.as.msgs||{};S.as.chunks=S.as.chunks||{};
  const q=await asRetry(()=>FS.collection(asBase()+'chunks').where('c','==',cid).get());
  const ch=[],all=[];
  q.docs.forEach(function(d){const v=d.data()||{};let arr=[];try{arr=JSON.parse(v.d||'[]');}catch(e){}ch.push({id:d.id,seq:v.q||0,arr:arr});arr.forEach(m=>all.push(m));});
  ch.sort((a,b)=>a.seq-b.seq);
  S.as.chunks[cid]=ch;S.as.msgs[cid]=all.sort((a,b)=>(a.t+(a.s||'')).localeCompare(b.t+(b.s||''))||a.o-b.o);
  return all;
}
/* כתיבת מקטעים: ממלאים את המקטע האחרון עד הגבול ופותחים חדשים לפי הצורך. נכתב ב-batch (אטומי) כשאפשר */
async function asWriteConv(cid,convPatch,newMsgs,extraWrites){
  const ch=S.as.chunks[cid]||[],dirty={};
  let last=ch[ch.length-1];
  if(last&&last.bytes===undefined)last.bytes=asBytes(JSON.stringify(last.arr));
  for(const m of newMsgs){
    const mb=asBytes(JSON.stringify(m))+1;
    if(!last||last.bytes+mb>AS_CHUNK_BYTES){last={id:cid+'_'+asId(),seq:ch.length?ch[ch.length-1].seq+1:0,arr:[],bytes:2};ch.push(last);}
    last.arr.push(m);last.bytes+=mb;dirty[last.id]=last;
  }
  S.as.chunks[cid]=ch;
  const ops=Object.values(dirty).map(c=>({p:asBase()+'chunks/'+c.id,v:{c:cid,q:c.seq,n:c.arr.length,d:JSON.stringify(c.arr),u:Date.now()}}));
  ops.push({p:asBase()+'convs/'+cid,v:convPatch,merge:true});
  (extraWrites||[]).forEach(w=>ops.push(w));
  // batch עד ~8MB לבקשה
  let batch=FS.batch(),bytes=0,n=0;const commits=[];
  for(const o of ops){const b=asBytes(JSON.stringify(o.v));if(n&&(bytes+b>8e6||n>=450)){commits.push(batch);batch=FS.batch();bytes=0;n=0;}
    if(o.del)batch.delete(FS.doc(o.p));else batch.set(FS.doc(o.p),o.v,o.merge?{merge:true}:undefined);bytes+=b;n++;}
  commits.push(batch);
  for(const b of commits)await asRetry(()=>b.commit());
}
function asConvStats(cid){const a=S.as.msgs[cid]||[];return {count:a.length,first:a.length?a[0].t:'',last:a.length?a[a.length-1].t:''};}

/* ---------- ייבוא ---------- */
async function asImport(p,cid,newName){
  const now=Date.now(),isNew=!cid;
  if(isNew)cid=asId();
  const existing=isNew?[]:await asLoadConv(cid);
  S.as.msgs=S.as.msgs||{};S.as.chunks=S.as.chunks||{};S.as.convs=S.as.convs||[];S.as.imports=S.as.imports||[];
  if(isNew){S.as.msgs[cid]=[];S.as.chunks[cid]=[];}
  await asKeys(cid,p.msgs);
  const have={},bySB={};existing.forEach(m=>{have[m.k]=1;(bySB[m.n+'|'+m.nb]=bySB[m.n+'|'+m.nb]||[]).push(asMin(m.t));});
  const iid=asId(),add=[],dup=[],maybe=[],seen={},shifts={};let longN=0;
  const exact={};existing.forEach(m=>exact[m.n+'|'+m.nb+'|'+asMin(m.t)]=1);
  p.msgs.forEach(function(x){
    if(have[x.k]||seen[x.k]){dup.push(x);return;}seen[x.k]=1;
    const nb=asNormBody(x.b),mx=asMin(x.t);let hit=0;
    (bySB[x.n+'|'+nb]||[]).forEach(t=>{const d=mx-t,ad=Math.abs(d);if(ad>0&&ad<=180&&[0,1,59].indexOf(ad%60)>-1){hit=d;}});
    if(nb.length>=6&&nb!=='<מדיה>'){longN++;if(hit){shifts[Math.round(hit/60)*60]=(shifts[Math.round(hit/60)*60]||0)+1;maybe.push(x);return;}}   // כנראה אותה הודעה עם הפרש שעון/אזור זמן
    add.push(x);
  });

/* כתיבה מחדש של כל המקטעים של שיחה (אחרי הסרה/העברה של הודעות) */

  await asWriteConv(cid,Object.assign({updated:Date.now(),count:msgs.length,analyzed:msgs.filter(m=>m.a).length,first:msgs[0]?msgs[0].t:'',last:msgs.length?msgs[msgs.length-1].t:''},convPatch||{}),msgs,dels.concat(extra||[]));

/* תיקון שיוך שגוי: העברת כל ההודעות של ייבוא לשיחה אחרת (או חדשה) */
async function asMoveImport(iid,target,newName){
  const im=S.as.imports.find(x=>x.id===iid);if(!im)return;
  const from=im.conv,src=await asLoadConv(from),moving=src.filter(m=>m.i===iid),stay=src.filter(m=>m.i!==iid);
  let to=target,isNew=!to;if(isNew)to=asId();
  const dest=isNew?[]:await asLoadConv(to);if(isNew){S.as.chunks[to]=[];S.as.msgs[to]=[];}
  const raw=moving.map(m=>({t:m.t,day:m.t.slice(0,10),hm:m.t.slice(11),sec:m.s,n:m.n,b:m.b}));
  await asKeys(to,raw);

  raw.forEach((x,i)=>{if(have[x.k]){dupN++;return;}have[x.k]=1;moved++;addRecs.push({k:x.k,t:x.t,s:x.sec||'',n:x.n,b:x.b,nb:asNormBody(x.b),o:x.o,i:iid,f:moving[i].f});});
  const all=dest.concat(addRecs);all.sort((a,b)=>(a.t+(a.s||'')).localeCompare(b.t+(b.s||'')));

  const patchTo={updated:Date.now(),count:all.length,first:all[0]?all[0].t:'',last:all.length?all[all.length-1].t:'',aliases:Array.from(new Set((toConv.aliases||[]).concat([im.source||''].filter(Boolean))))};
  if(isNew)Object.assign(patchTo,{name:(newName||im.source||'שיחה').trim(),created:Date.now()});
  await asWriteConv(to,patchTo,addRecs,[{p:asBase()+'imports/'+iid,v:{conv:to,movedFrom:from,movedAt:Date.now()},merge:true}]);
  S.as.msgs[to]=all;
  const srcAliases=Array.from(new Set(S.as.imports.filter(x=>x.conv===from&&x.id!==iid).map(x=>x.source).filter(Boolean)));
  await asRewriteConv(from,stay,{aliases:srcAliases.length?srcAliases:(fromConv.aliases||[])});
  await asLoadMeta();
  return {moved:moved,dup:dupN,to:to};
}

async function asAction(a,el,id){
  const A=S.as=S.as||{};
  const busy=async(msg,fn)=>{A.busy=msg;render();try{return await fn();}catch(e){toast(fbErr(e));}finally{A.busy='';render();}};
  if(a==='as-pick'){const f=document.getElementById('asFiles');if(f)f.click();return;}
  if(a==='as-cancel'){A.pending=null;return render();}
  if(a==='as-close-report'){A.report=null;return render();}
  if(a==='as-run'){
    const P=A.pending||[];document.querySelectorAll('#main [data-asn]').forEach(i=>P[+i.dataset.asn].newName=i.value);
    document.querySelectorAll('#main [data-asf]').forEach(s=>P[+s.dataset.asf].target=s.value);
    for(const p of P)if(!p.target&&!String(p.newName===undefined?p.source:p.newName).trim())return toast('כתבו שם לשיחה החדשה');
    A.pending=null;const rep=[];
    await busy('מייבא…',async function(){
      for(const p of P){
        try{A.busy='מייבא את '+p.file+' ('+p.msgs.length+' הודעות)…';render();
          // שני קבצים חדשים באותו ייבוא עם אותו שם שיחה חדש → אותה שיחה
          let t=p.target;if(!t){const same=rep.find(r=>r._new&&r._name===String(p.newName===undefined?p.source:p.newName).trim());if(same)t=same.conv;}
          const r=await asImport(p,t,p.newName===undefined?p.source:p.newName);r._new=!p.target;r._name=String(p.newName===undefined?p.source:p.newName).trim();rep.push(r);}
        catch(e){rep.push({file:p.file,error:fbErr(e)});}
      }
    });
    A.report=rep;logAct('ייבוא שיחות וואטסאפ',rep.length+' קבצים');return render();
  }
  if(a==='as-open'){A.cur=id;A.q='';A.day='';A.page=0;render();if(!(A.msgs&&A.msgs[id]))await busy('טוען הודעות…',()=>asLoadConv(id));return render();}

async function asFilesChosen(files){

/* ================= עוזר אישי: ניתוח שיחות (אבן דרך C) =================
   מנגנון אחד לשני המסלולים: (1) העתקה-הדבקה לדף "מסכם וואטסאפ" ב-Claude, (2) ניתוח דרך Claude Code.
   שניהם משתמשים באותה "חבילת ניתוח" ובאותו פורמט תוצאה, וכל תוצאה עוברת בדיקת תקינות ותיבת אישורים.
   אחסון (תחת insts/{מוסד}/assist/{uid}/, לפי החוקים רק המשתמש עצמו):
     packs/{id}   חבילה שנשלחה לניתוח: אילו הודעות, מיפוי הפניות (m1→מפתח הודעה), מיפוי כינויים
     props/{id}   הצעות שחזרו מהניתוח וממתינות לאישור (נשמרות גם אחרי אישור/דחייה, לתיעוד)
     topics/{id}  נושאים מאושרים (הזיכרון)
     items/{id}   משימות, תזכורות, התחייבויות, דיונים וכו' מאושרים (הזיכרון)
   הודעה שנותחה מסומנת ב-a (מזהה החבילה) בתוך מקטע ההודעות. */
const AC_VER=1,AC_NEW_BYTES=140000,AC_CTX_BYTES=30000,AC_MEM_BYTES=25000;
const AC_KINDS={task:'משימה',reminder:'תזכורת',commitment:'התחייבות שלי',request:'בקשה מאחרים',waiting:'ממתין למענה',discussion:'נושא לדיון',question:'שאלה פתוחה',done:'טופל'};
const AC_ST={open:'פתוח',waiting:'ממתין',done:'טופל'};
const AC_TASKY={task:1,reminder:1,commitment:1,request:1};
const AC_STOP=new Set(['של','את','על','עם','זה','זו','גם','אני','אתה','הוא','היא','אנחנו','לא','כן','מה','מי','אם','כי','או','רק','עוד','כל','יש','אין','היה','היום','מחר','תודה','שלום','בוקר','טוב','ערב','אפשר','צריך','אבל','כבר','עכשיו','שם','פה','לך','לי','לו','לה','להם','שלי','שלך','אחרי','לפני','בסדר','אוקיי','בבקשה']);
const acNorm=s=>String(s||'').replace(AS_BIDI,'').replace(/[“”"״׳'`]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
function acWords(s){return new Set((acNorm(s).match(/[֐-׿a-z0-9]{3,}/g)||[]).filter(w=>!AC_STOP.has(w)));}
function acSim(a,b){const A=acWords(a),B=acWords(b);if(!A.size||!B.size)return 0;let n=0;A.forEach(w=>{if(B.has(w))n++;});return n/Math.min(A.size,B.size);}
/* צמצום מידע מזהה: טלפונים, מיילים, מספרי זהות ומספרים ארוכים, ושמות המשתתפים מוחלפים בכינוי */
function acMask(text,al){
  let t=String(text||'');
  t=t.replace(/\[איש קשר:[\s\S]*?END:VCARD\]?/g,'[איש קשר]').replace(/BEGIN:VCARD[\s\S]*?END:VCARD/g,'[איש קשר]');
  t=t.replace(/https?:\/\/(?:docs|drive|forms)\.google\.com\/\S+|https?:\/\/forms\.gle\/\S+/g,'[קישור למסמך]');
  t=t.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'[מייל]');
  t=t.replace(/(?:\+?972[-\s]?|\b0)(?:[2-9]\d?)[-\s]?\d{3}[-\s]?\d{4}\b/g,'[טלפון]');
  t=t.replace(/\b\d{9}\b/g,'[מספר מזהה]').replace(/\b\d{8,}\b/g,'[מספר]');
  Object.keys(al||{}).filter(n=>n.length>=3).sort((a,b)=>b.length-a.length).forEach(n=>{t=t.split(n).join(al[n]);});
  return t;
}
function acUnalias(text,al){let t=String(text||'');Object.keys(al||{}).sort((a,b)=>al[b].length-al[a].length).forEach(n=>{t=t.split(al[n]).join(n);});return t;}
function acConv(cid){return (S.as.convs||[]).find(c=>c.id===cid)||{};}

/* ---------- טעינת הזיכרון ---------- */
async function acLoad(){
  const A=S.as;const get=async c=>(await FS.collection(asBase()+c).get()).docs.map(d=>Object.assign({id:d.id},d.data()));
  try{const [t,i,p,k]=await Promise.all([get('topics'),get('items'),get('props'),get('packs')]);A.topics=t;A.items=i;A.props=p;A.packs=k;A.acLoaded=true;}
  catch(e){A.acErr=fbErr(e);}
}
const acPending=cid=>((S.as.msgs||{})[cid]||[]).filter(m=>!m.a);
function acOutPack(cid){return (S.as.packs||[]).find(p=>p.conv===cid&&p.status==='out');}

/* ---------- כינויים למשתתפים (נשמרים קבועים לכל שיחה) ---------- */
async function acAliases(cid,msgs){
  const c=acConv(cid),al=Object.assign({},c.al||{}),me=(c.me&&c.me.length?c.me:Array.from(new Set(msgs.map(m=>m.n))).filter(n=>/^(את\/ה|אתה|You)$/.test(n)));let n=Object.values(al).filter(a=>/^\[משתתף \d+\]$/.test(a)).length,ch=false;
  me.forEach(x=>{if(al[x]!=='[אני]'){al[x]='[אני]';ch=true;}});
  msgs.forEach(m=>{if(!al[m.n]){n++;al[m.n]='[משתתף '+n+']';ch=true;}});
  if(ch){await asRetry(()=>FS.doc(asBase()+'convs/'+cid).set({al:al},{merge:true}));c.al=al;}
  return al;
}

/* ---------- בניית חבילת ניתוח ---------- */
const AC_INSTR=`אתה עוזר ניהולי של מנהל תלמוד תורה. לפניך הודעות וואטסאפ חדשות מתוך שיחה אחת, יחד עם "זיכרון" של נושאים ועניינים פתוחים מניתוחים קודמים, והודעות ישנות שעשויות להיות רלוונטיות (הקשר).
המשימה: לזהות מתוך ההודעות החדשות בלבד:
- task (משימה שצריך לבצע), reminder (משהו עם תאריך/מועד), commitment (המנהל [אני] התחייב לעשות), request (מישהו ביקש מהמנהל),
  waiting (המנהל ממתין לתשובה ממישהו), discussion (נושא שדורש דיון/החלטה), question (שאלה שלא נענתה), done (דבר שטופל/הושלם).
- נושאים (topics): קבץ את הממצאים לנושאים. אם הנושא כבר קיים בזיכרון — השתמש במזהה הקיים (op:"update") ואל תפתח נושא חדש.
- אם הודעה חדשה מעדכנת עניין קיים מהזיכרון (למשל הושלם, נדחה, השתנה מועד) — החזר op:"update" עם המזהה הקיים, ולא פריט חדש.
כללים מחייבים:
1. לכל ממצא חובה לצרף sources: הפניה (ref) להודעה מהרשימה, וציטוט קצר מדויק (quote) שמופיע מילה במילה בהודעה. אין ממצא בלי מקור.
2. אל תמציא. אל תקבע שמשהו הושלם בלי הודעה שמראה זאת. שאלה שכבר נענתה בהמשך ההודעות אינה "question". ברכות ושיחת נימוס אינן ממצאים. הקשר והזיכרון רק עוזרים להבין — ממצאים חדשים רק מהודעות החדשות (ref שמתחיל ב-m).
3. שמות אנשים מופיעים ככינויים בסוגריים מרובעים ([אני] הוא המנהל). השתמש בכינויים כפי שהם בשדות owner, title ו-details.
4. אל תכלול פרטים אישיים שאינם נחוצים. כתוב בעברית, קצר וברור. title עד 12 מילים.
5. due בפורמט YYYY-MM-DD רק אם נאמר מועד מפורש; אחרת null. urgent:true רק אם יש דחיפות מפורשת.
6. אם אין ממצאים — החזר מערכים ריקים.
החזר JSON בלבד, במבנה הזה בדיוק:
{"pack":"<מזהה החבילה>","summary":"2-4 משפטים: מה קרה בהודעות החדשות",
 "topics":[{"op":"new","ref":"T1","title":"...","summary":"...","status":"open"},{"op":"update","id":"<מזהה נושא קיים>","summary":"...","status":"open|closed"}],
 "items":[{"op":"new","kind":"task|reminder|commitment|request|waiting|discussion|question|done","title":"...","details":"...","owner":"[אני]|[משתתף 2]|null","due":"YYYY-MM-DD|null","urgent":false,"topic":"T1 או מזהה נושא קיים","sources":[{"ref":"m12","quote":"..."}]},
          {"op":"update","id":"<מזהה פריט קיים>","status":"open|waiting|done","due":"YYYY-MM-DD|null","note":"מה השתנה","sources":[{"ref":"m30","quote":"..."}]}]}`;
function acLine(ref,m,al){return ref+' | '+m.t.slice(0,10)+' '+m.t.slice(11,16)+' | '+(al[m.n]||'[?]')+': '+acMask(m.b,al).replace(/\n+/g,' ⏎ ');}
async function acBuildPack(cid,route){
  const A=S.as;const all=await asLoadConv(cid);const old=acOutPack(cid);
  if(old)await acCancelPack(old.id);
  const pend=all.filter(m=>!m.a);if(!pend.length)return null;
  const al=await acAliases(cid,all),refs={},lines=[];let bytes=0,i=0;
  for(const m of pend){const ln=acLine('m'+(i+1),m,al),b=asBytes(ln)+1;if(i&&bytes+b>AC_NEW_BYTES)break;refs['m'+(i+1)]=m.k;lines.push(ln);bytes+=b;i++;}
  const newKeys=new Set(Object.values(refs)),first=all.find(m=>m.k===refs.m1),lastK=refs['m'+i],last=all.find(m=>m.k===lastK);
  // זיכרון: נושאים ופריטים פתוחים של השיחה
  const tps=(A.topics||[]).filter(t=>(t.conv||[]).indexOf(cid)>-1&&t.status!=='closed');
  const its=(A.items||[]).filter(x=>x.conv===cid&&x.status!=='done').sort((a,b)=>(b.updated||0)-(a.updated||0));
  let mem=[];let mb=0;
  tps.forEach(t=>{const s='נושא '+t.id+': '+acMask(t.title,al)+(t.summary?' — '+acMask(t.summary,al):'');if(mb+asBytes(s)<AC_MEM_BYTES*0.4){mem.push(s);mb+=asBytes(s);}});
  its.forEach(x=>{const s='פריט '+x.id+' ['+x.kind+', '+(AC_ST[x.status]||x.status)+(x.due?', עד '+x.due:'')+(x.topic?', נושא '+x.topic:'')+']: '+acMask(x.title,al)+(x.owner?' (אחראי: '+acMask(x.owner,al)+')':'');if(mb+asBytes(s)<AC_MEM_BYTES){mem.push(s);mb+=asBytes(s);}});
  // הקשר: הודעות שכבר נותחו, שקשורות למילים בהודעות החדשות או למקורות של עניינים פתוחים
  const kw=new Set();pend.slice(0,i).forEach(m=>acWords(m.b).forEach(w=>kw.add(w)));
  const srcK=new Set();its.forEach(x=>(x.sources||[]).forEach(s=>srcK.add(s.k)));
  const hist=all.filter(m=>m.a&&!newKeys.has(m.k)).map(m=>{let sc=srcK.has(m.k)?3:0;acWords(m.b).forEach(w=>{if(kw.has(w))sc++;});return {m:m,sc:sc};}).filter(x=>x.sc>=2).sort((a,b)=>b.sc-a.sc);
  const ctx=[];let cb=0,ci=0;
  for(const h of hist){const ln=acLine('c'+(ci+1),h.m,al),b=asBytes(ln)+1;if(cb+b>AC_CTX_BYTES)break;ctx.push({ln:ln,t:h.m.t});refs['c'+(ci+1)]=h.m.k;cb+=b;ci++;}
  ctx.sort((a,b)=>a.t.localeCompare(b.t));
  const id='P'+asId().slice(0,8),remain=pend.length-i;
  const text='[[חבילת-ניתוח v'+AC_VER+' id='+id+']]\n'+AC_INSTR.replace('<מזהה החבילה>',id)+
    '\n\n=== זיכרון ('+mem.length+') ===\n'+(mem.join('\n')||'(ריק — זו הקליטה הראשונה)')+
    '\n\n=== הודעות קודמות להקשר בלבד ('+ctx.length+') ===\n'+(ctx.map(x=>x.ln).join('\n')||'(אין)')+
    '\n\n=== הודעות חדשות לניתוח ('+i+') ===\n'+lines.join('\n')+'\n\n[[סוף החבילה '+id+']]';
  const pack={conv:cid,created:Date.now(),route:route||'paste',status:'out',refs:refs,count:i,ctx:ci,first:first?first.t:'',last:last?last.t:'',remain:remain,bytes:asBytes(text)};
  await asRetry(()=>FS.doc(asBase()+'packs/'+id).set(pack));
  A.packs=(A.packs||[]).filter(p=>p.id!==id).concat([Object.assign({id:id},pack)]);
  return {id:id,text:text,count:i,ctx:ci,remain:remain,bytes:pack.bytes,first:pack.first,last:pack.last};
}
async function acCancelPack(pid){
  await asRetry(()=>FS.doc(asBase()+'packs/'+pid).set({status:'cancelled',cancelled:Date.now()},{merge:true}));
  const p=(S.as.packs||[]).find(x=>x.id===pid);if(p)p.status='cancelled';
}

/* ---------- קליטת תוצאה: בדיקת תקינות, מניעת כפילויות, יצירת הצעות לאישור ---------- */
function acParse(text){
  const s=String(text||'').trim();try{return JSON.parse(s);}catch(e){}
  const f=s.match(/```(?:json)?\s*([\s\S]*?)```/);if(f){try{return JSON.parse(f[1]);}catch(e){}}
  const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a>-1&&b>a){try{return JSON.parse(s.slice(a,b+1));}catch(e){}}
  return null;
}
const acDate=d=>d&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d))?d:null;
async function acImportResult(text,route){
  const A=S.as,R={ok:false,errors:[],props:0,dropped:[],merged:0,invalidSrc:0};
  const j=acParse(text);if(!j||typeof j!=='object'){R.errors.push('לא נמצא JSON תקין בתוצאה.');return R;}
  const pid=String(j.pack||'');const pk=(A.packs||[]).find(p=>p.id===pid);
  if(!pk){R.errors.push('מזהה החבילה ('+(pid||'חסר')+') לא מוכר. ייתכן שהתוצאה שייכת לחבילה אחרת.');return R;}
  if(pk.status==='returned'){R.errors.push('התוצאות של החבילה הזו כבר נקלטו. קליטה חוזרת הייתה יוצרת כפילויות.');return R;}
  if(pk.status==='cancelled'){R.errors.push('החבילה הזו בוטלה (נוצרה חבילה חדשה יותר לאותה שיחה). צריך לנתח את החבילה החדשה.');return R;}
  const cid=pk.conv,all=await asLoadConv(cid),byK={};all.forEach(m=>byK[m.k]=m);
  const al=acConv(cid).al||{};
  // מקור תקין: הפניה מהחבילה + ציטוט שמופיע בהודעה (אחרי אותה הסתרת פרטים)
  const srcs=(arr,onlyNew)=>{const out=[];(Array.isArray(arr)?arr:[]).forEach(s=>{const ref=String(s&&s.ref||''),k=pk.refs[ref],m=k&&byK[k];
    if(!m||(onlyNew&&ref.charAt(0)!=='m')){R.invalidSrc++;return;}
    const body=acNorm(acMask(m.b,al)),q=String(s.quote||'').replace(/⏎/g,' ');
    const parts=q.split(/…|\.\.\./).map(acNorm).filter(x=>x.length>=3);
    if(!parts.length||!parts.every(p=>body.indexOf(p)>-1)){R.invalidSrc++;return;}
    out.push({k:m.k,t:m.t,s:m.s||'',n:m.n,q:acUnalias(q,al).slice(0,300),ref:ref});});return out;};
  const props=[],now=Date.now(),tref={};
  const openItems=(A.items||[]).filter(x=>x.conv===cid&&x.status!=='done'),topics=(A.topics||[]).filter(t=>(t.conv||[]).indexOf(cid)>-1);
  const pendingSame=(A.props||[]).filter(p=>p.conv===cid&&p.state==='pending');
  (Array.isArray(j.topics)?j.topics:[]).forEach(function(t){
    if(!t||!t.title&&t.op!=='update')return;
    if(t.op==='update'){const ex=topics.find(x=>x.id===t.id);if(!ex){R.dropped.push('עדכון לנושא לא קיים ('+t.id+')');return;}
      props.push({type:'topic',op:'update',target:ex.id,data:{summary:acUnalias(String(t.summary||'').slice(0,800),al),status:t.status==='closed'?'closed':'open'},sources:[]});return;}
    const title=acUnalias(String(t.title).slice(0,160),al),dup=topics.find(x=>acSim(x.title,title)>=0.7);
    if(dup){tref[t.ref]=dup.id;R.merged++;props.push({type:'topic',op:'update',target:dup.id,merged:true,data:{summary:acUnalias(String(t.summary||'').slice(0,800),al),status:'open'},sources:[]});return;}
    tref[t.ref]={ref:t.ref};props.push({type:'topic',op:'new',tref:String(t.ref||''),data:{title:title,summary:acUnalias(String(t.summary||'').slice(0,800),al),status:'open'},sources:[]});
  });
  const resolveTopic=x=>{if(!x)return '';const s=String(x);if(tref[s])return typeof tref[s]==='string'?tref[s]:'#'+s;return topics.some(t=>t.id===s)?s:'';};
  (Array.isArray(j.items)?j.items:[]).forEach(function(it){
    if(!it||typeof it!=='object')return;
    if(it.op==='update'){
      const ex=openItems.find(x=>x.id===it.id)||(A.items||[]).find(x=>x.id===it.id&&x.conv===cid);
      if(!ex){R.dropped.push('עדכון לפריט לא קיים ('+it.id+')');return;}
      const so=srcs(it.sources,true);if(!so.length){R.dropped.push('עדכון בלי מקור תקין: '+ex.title);return;}
      props.push({type:'item',op:'update',target:ex.id,data:{status:AC_ST[it.status]?it.status:ex.status,due:acDate(it.due)||ex.due||null,note:acUnalias(String(it.note||'').slice(0,500),al)},sources:so});return;}
    const kind=AC_KINDS[it.kind]?it.kind:null,title=acUnalias(String(it.title||'').trim().slice(0,200),al);
    if(!kind||!title){R.dropped.push('פריט בלי סוג או כותרת תקינים');return;}
    const so=srcs(it.sources,true);if(!so.length){R.dropped.push('בלי מקור תקין: '+title);return;}
    const data={kind:kind,title:title,details:acUnalias(String(it.details||'').slice(0,1500),al),owner:it.owner&&it.owner!=='null'?acUnalias(String(it.owner).slice(0,80),al):'',
      due:acDate(it.due),urgent:!!it.urgent,status:kind==='done'?'done':kind==='waiting'?'waiting':'open',topic:resolveTopic(it.topic)};
    // אותו עניין כבר קיים (בזיכרון או בהצעה שממתינה) → עדכון ולא כפילות
    const dupI=openItems.find(x=>acSim(x.title,title)>=0.75||(x.sources||[]).some(s=>so.some(o=>o.k===s.k)&&acSim(x.title,title)>=0.4));
    if(dupI){R.merged++;props.push({type:'item',op:'update',target:dupI.id,merged:true,data:{status:data.status,due:data.due||dupI.due||null,note:title+(data.details?' — '+data.details:'')},sources:so});return;}
    const dupP=pendingSame.find(p=>p.type==='item'&&p.op==='new'&&acSim(p.data.title,title)>=0.75)||props.find(p=>p.type==='item'&&p.op==='new'&&acSim(p.data.title,title)>=0.8);
    if(dupP){R.merged++;(dupP.sources=dupP.sources||[]).push(...so.filter(o=>!dupP.sources.some(s=>s.k===o.k)));if(dupP.id)dupP._dirty=true;return;}
    props.push({type:'item',op:'new',data:data,sources:so});
  });
  // שמירה: הצעות, סטטוס החבילה, וסימון ההודעות שנותחו
  const b=FS.batch();
  props.forEach(p=>{p.id='Q'+asId().slice(0,9);Object.assign(p,{pack:pid,conv:cid,state:'pending',created:now,route:route||pk.route||'paste'});b.set(FS.doc(asBase()+'props/'+p.id),p);});
  pendingSame.filter(p=>p._dirty).forEach(p=>{delete p._dirty;b.set(FS.doc(asBase()+'props/'+p.id),{sources:p.sources},{merge:true});});
  b.set(FS.doc(asBase()+'packs/'+pid),{status:'returned',returned:now,summary:acUnalias(String(j.summary||''),al).slice(0,1500),props:props.length,dropped:R.dropped.length,merged:R.merged,invalidSrc:R.invalidSrc},{merge:true});
  await asRetry(()=>b.commit());
  const nk=new Set(Object.keys(pk.refs).filter(r=>r.charAt(0)==='m').map(r=>pk.refs[r]));
  all.forEach(m=>{if(nk.has(m.k))m.a=pid;});
  await asRewriteConv(cid,all);
  Object.assign(pk,{status:'returned',returned:now,summary:acUnalias(String(j.summary||''),al).slice(0,1500)});
  A.props=(A.props||[]).concat(props);
  await asLoadMeta();
  R.ok=true;R.props=props.length;R.pack=pid;R.analyzed=nk.size;return R;
}

/* ---------- אישור / דחייה ---------- */
async function acApprove(pid,opt){
  const A=S.as,p=(A.props||[]).find(x=>x.id===pid);if(!p||p.state!=='pending')return;
  opt=opt||{};const now=Date.now(),d=Object.assign({},p.data,opt.edit||{});let created='';
  if(p.type==='topic'&&p.op==='new'){
    created='T'+asId().slice(0,9);const t={title:d.title,summary:d.summary||'',status:'open',conv:[p.conv],created:now,updated:now,pack:p.pack};
    await asRetry(()=>FS.doc(asBase()+'topics/'+created).set(t));A.topics=(A.topics||[]).concat([Object.assign({id:created},t)]);
  }else if(p.type==='topic'){
    const t=(A.topics||[]).find(x=>x.id===p.target);if(t){const ch={updated:now};if(d.summary)ch.summary=d.summary;if(d.status)ch.status=d.status;
      await asRetry(()=>FS.doc(asBase()+'topics/'+t.id).set(ch,{merge:true}));Object.assign(t,ch);}
  }else if(p.op==='new'){
    let topic=d.topic||'';
    if(topic.charAt(0)==='#'){const tp=(A.props||[]).find(x=>x.pack===p.pack&&x.type==='topic'&&x.op==='new'&&x.tref===topic.slice(1));
      if(tp&&tp.state==='pending')await acApprove(tp.id);topic=tp&&tp.created?tp.created:'';}
    created='I'+asId().slice(0,9);
    const it={kind:d.kind,title:d.title,details:d.details||'',owner:d.owner||'',due:d.due||null,urgent:!!d.urgent,status:d.status||'open',topic:topic,conv:p.conv,sources:p.sources,
      created:now,updated:now,pack:p.pack,log:[{at:now,what:'נוצר מהניתוח ואושר'+(opt.edit?' (עם עריכה)':'')}]};
    if(opt.task&&d.status!=='done'){
      const tk={id:uid(),text:d.title+(d.owner&&d.owner!=='[אני]'?' ('+d.owner+')':''),due:d.due||'',status:'open',by:S.me.user,uid:S.me.id,src:'wa',item:created};
      S.tasks.push(tk);await save(K.tasks,S.tasks);it.taskId=tk.id;it.log.push({at:now,what:'נוספה משימה ביומן המשימות'});
    }
    await asRetry(()=>FS.doc(asBase()+'items/'+created).set(it));A.items=(A.items||[]).concat([Object.assign({id:created},it)]);
  }else{
    const it=(A.items||[]).find(x=>x.id===p.target);if(it){
      const ch={updated:now,status:d.status||it.status,due:d.due||it.due||null,sources:(it.sources||[]).concat((p.sources||[]).filter(s=>!(it.sources||[]).some(o=>o.k===s.k))),
        log:(it.log||[]).concat([{at:now,what:'עודכן: '+(AC_ST[d.status]||'')+(d.note?' — '+d.note:'')}])};
      if(d.note)ch.details=(it.details?it.details+'\n':'')+'• '+d.note;
      if(opt.closeTask&&ch.status==='done'&&it.taskId){S.tasks=S.tasks.map(t=>t.id===it.taskId?Object.assign({},t,{status:'done'}):t);await save(K.tasks,S.tasks);ch.log.push({at:now,what:'המשימה ביומן סומנה כבוצעה'});}
      await asRetry(()=>FS.doc(asBase()+'items/'+it.id).set(ch,{merge:true}));Object.assign(it,ch);
    }
  }
  const st={state:'approved',decided:now};if(created)st.created=created;if(opt.edit)st.edited=opt.edit;
  await asRetry(()=>FS.doc(asBase()+'props/'+pid).set(st,{merge:true}));Object.assign(p,st);
}
async function acReject(pid){
  const p=(S.as.props||[]).find(x=>x.id===pid);if(!p)return;const st={state:'rejected',decided:Date.now()};
  await asRetry(()=>FS.doc(asBase()+'props/'+pid).set(st,{merge:true}));Object.assign(p,st);
}

async function acEditItem(id,field,val){
  const it=(S.as.items||[]).find(x=>x.id===id);if(!it)return;const now=Date.now(),ch={updated:now};let what='';
  if(field==='kind'&&AC_KINDS[val]&&val!==it.kind){ch.kind=val;what='קטגוריה: '+(AC_KINDS[it.kind]||it.kind)+' ← '+AC_KINDS[val];if(val==='done')ch.status='done';}
  else if(field==='urgent'){ch.urgent=!!val;what=val?'סומן כדחוף':'הוסר מהדחופים';}
  else if(field==='status'&&AC_ST[val]&&val!==it.status){ch.status=val;what='סטטוס: '+(AC_ST[it.status]||'')+' ← '+AC_ST[val];}
  if(!what)return;ch.log=(it.log||[]).concat([{at:now,what:what+' (ידני)'}]);
  try{await asRetry(()=>FS.doc(asBase()+'items/'+id).set(ch,{merge:true}));Object.assign(it,ch);toast('עודכן');}catch(e){toast(fbErr(e));}
  render();
}

/* ================= תורנויות חצר =================
   נשמר בתוך store/config (שדה duty), שכל הצוות קורא ורק ההנהלה כותבת; בממשק, העריכה רק למי שיצר את הלוח — duty.ed הוא ה-uid שלו.
   תזכורת: 5 דקות לפני תורנות, חלונית צפה אצל המורה התורן (כשהאפליקציה פתוחה אצלו). */
const DUTY_DAYS=['יום א׳','יום ב׳','יום ג׳','יום ד׳','יום ה׳','יום ו׳'];
const DUTY_LEAD=5;
function dutyEmpty(){return {slots:[],cells:{}};}
async function loadDuty(){
  S.dutyErr=false;
  try{const d=await fsGet('store/config');const v=d&&d.v&&d.v.duty;if(v){S.duty=v;S.config.duty=v;}else S.duty=S.config.duty||dutyEmpty();}
  catch(e){S.duty=S.config.duty||S.duty||dutyEmpty();}
  if(!S.duty.slots)S.duty.slots=[];if(!S.duty.cells)S.duty.cells={};
}
const canDuty=()=>isAdmin()&&!!S.me&&(!S.duty||!S.duty.ed||S.duty.ed===S.me.id);
async function saveDuty(v){
  const rec={slots:v.slots,cells:v.cells,ed:(S.duty&&S.duty.ed)||S.me.id,by:S.me.user||'',at:Date.now()};
  const prev=S.config.duty;S.config.duty=rec;
  const cv=Object.assign({},S.config);delete cv.users;
  try{await queued('store/config',async()=>{await FS.doc(IB()+'store/config').set({v:cv});});LAST[K.config]=JSON.stringify(cv);S.duty=rec;return true;}
  catch(e){S.config.duty=prev;saveFailed(e);return false;}
}
/* זיהוי שמות: "הרב ברוד" ↔ "שמואל ברוד" — בלי תארים, לפי מילה משותפת */
const DUTY_TITLES=/^(הרב|הר׳|הר'|ר׳|ר'|רב|המורה|מורה|הגב׳|הגב'|גב׳|גב'|מר|הגננת)$/;
function dutyToks(s){return String(s||'').replace(/["״.,()\-]/g,' ').trim().split(/\s+/).filter(t=>t&&!DUTY_TITLES.test(t)).map(t=>t.replace(/['׳]/g,'')).filter(Boolean);}
function dutyNameMatch(a,b){const A=dutyToks(a),B=dutyToks(b);if(!A.length||!B.length)return false;return A.every(t=>t.length>1&&B.indexOf(t)>-1)||B.every(t=>t.length>1&&A.indexOf(t)>-1);}
function dutyIsMe(c){
  if(!c||!S.me)return false;if(c.u)return c.u===S.me.id;
  return [S.me.teacher,S.me.user].some(n=>n&&dutyNameMatch(c.n,n));
}
function dutyUsers(){return (S.config.users||[]).map(u=>({id:u.id,name:u.teacher||u.user||''})).filter(u=>u.name);}
function dutyAutoUser(name){const m=dutyUsers().filter(u=>dutyNameMatch(name,u.name));return m.length===1?m[0].id:'';}
function dutyUserName(id){const u=(S.config.users||[]).find(x=>x.id===id);return u?(u.teacher||u.user||''):'';}
function dutyHM(s){const m=String(s||'').match(/(\d{1,2})[:.](\d{2})/);return m?String(+m[1]).padStart(2,'0')+':'+m[2]:'';}
function dutyTimes(s){const all=String(s||'').match(/\d{1,2}[:.]\d{2}/g)||[];return {start:dutyHM(all[0]),end:dutyHM(all[1])};}
const dutySpan=sl=>sl.start?(sl.end?sl.start+'–'+sl.end:sl.start):'';
const dutySpanH=sl=>'<bdi dir="ltr">'+esc(dutySpan(sl))+'</bdi>';
/* פענוח טבלה מהגיליון (הדבקה מ-Google Sheets / CSV / אקסל) */
function dutyParseRows(rows){
  rows=rows.map(r=>(r||[]).map(x=>String(x==null?'':x).trim()));
  const hi=rows.findIndex(r=>r.filter(x=>/^יום\s*[אבגדהו]/.test(x)).length>=3);
  if(hi<0)return {err:'לא מצאתי שורת כותרת עם הימים (יום א׳, יום ב׳…).'};
  const L='אבגדהו',dcol={};
  rows[hi].forEach((x,i)=>{const m=x.match(/^יום\s*([אבגדהו])/);if(m)dcol[L.indexOf(m[1])]=i;});
  const tcol=rows[hi].findIndex(x=>/שעה|שעות/.test(x));
  const slots=[],cells={};
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r],name=row[0]||'';
    if(!name&&row.every(x=>!x))break;
    if(!name)continue;
    const tm=dutyTimes(tcol>-1?row[tcol]:row[1]);
    const id='d'+uid();slots.push({id:id,name:name,start:tm.start,end:tm.end});cells[id]={};
    Object.keys(dcol).forEach(d=>{const n=row[dcol[d]];if(n)cells[id][d]={n:n,u:dutyAutoUser(n)};});
  }
  if(!slots.length)return {err:'לא מצאתי שורות תורנות מתחת לכותרת.'};
  return {slots:slots,cells:cells};
}
function dutyParseText(t){
  const lines=String(t||'').replace(/\r/g,'').split('\n');
  const sep=lines.some(l=>l.indexOf('\t')>-1)?'\t':',';
  return dutyParseRows(lines.map(l=>sep==='\t'?l.split('\t'):dutyCsvLine(l)));
}
function dutyCsvLine(l){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];
  if(q){if(ch==='"'&&l[i+1]==='"'){cur+='"';i++;}else if(ch==='"')q=false;else cur+=ch;}
  else if(ch==='"')q=true;else if(ch===','){out.push(cur);cur='';}else cur+=ch;}out.push(cur);return out;}
async function dutyFile(f){
  try{
    if(/\.csv$/i.test(f.name)){S.dutyEdit=dutyImported(dutyParseText(await f.text()));return render();}
    const X=await loadSheetJS(),wb=X.read(await f.arrayBuffer(),{type:'array'});
    let res=null;for(const n of wb.SheetNames){res=dutyParseRows(X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}));if(!res.err)break;}
    S.dutyEdit=dutyImported(res);render();
  }catch(e){toast('לא הצלחתי לקרוא את הקובץ');}
}
function dutyImported(res){
  if(res.err){toast(res.err);return S.dutyEdit;}
  toast('נקראו '+res.slots.length+' תורנויות. בדקו ושמרו.');
  return {slots:res.slots,cells:res.cells,paste:false,imported:true};
}
/* התורנות הבאה שלי */
function dutyMine(){
  const out=[];if(!S.duty)return out;
  S.duty.slots.forEach(sl=>{const row=S.duty.cells[sl.id]||{};Object.keys(row).forEach(d=>{if(dutyIsMe(row[d]))out.push({d:+d,sl:sl});});});
  return out.sort((a,b)=>a.d-b.d||String(a.sl.start).localeCompare(String(b.sl.start)));
}
function dutyNext(){
  const mine=dutyMine();if(!mine.length)return null;
  const now=new Date(),wd=now.getDay(),hm=nowHM();
  for(let k=0;k<7;k++){const d=(wd+k)%7;
    const list=mine.filter(x=>x.d===d&&(k>0||(x.sl.end||x.sl.start)>hm));
    if(list.length){const dt=new Date(now);dt.setDate(now.getDate()+k);return Object.assign({k:k,date:iso(dt)},list[0]);}}
  return null;
}
/* תזכורת 5 דקות לפני */
const DUTY_SHOWN={};
function dutyCheck(){
  if(!S.duty||!S.me||!S.inst)return;
  const now=new Date(),wd=now.getDay(),today=iso(now),mins=now.getHours()*60+now.getMinutes();
  S.duty.slots.forEach(sl=>{
    if(!sl.start)return;const c=(S.duty.cells[sl.id]||{})[wd];if(!dutyIsMe(c))return;
    const st=+sl.start.slice(0,2)*60+ +sl.start.slice(3,5),left=st-mins;
    if(left<0||left>DUTY_LEAD)return;
    const key='tt:dutyShown:'+S.inst+':'+today+':'+sl.id;
    if(DUTY_SHOWN[key])return;DUTY_SHOWN[key]=1;
    try{if(localStorage.getItem(key))return;localStorage.setItem(key,'1');}catch(e){}
    dutyPopup(sl,left);
  });
}

    '<div class="remt"><b>'+esc(sl.name)+'</b> · '+dutySpanH(sl)+'<br>אתה התורן היום.</div><div class="remb"><i></i></div>'+

}

function dutyCapture(){
  const E=S.dutyEdit;if(!E)return;const cells={};
  document.querySelectorAll('tr[data-slot]').forEach(tr=>{
    const id=tr.dataset.slot,sl=E.slots.find(x=>x.id===id);if(!sl)return;
    tr.querySelectorAll('[data-dk]').forEach(i=>sl[i.dataset.dk]=i.value.trim());
    cells[id]={};tr.querySelectorAll('[data-dd]').forEach(s=>{const v=s.value;if(!v)return;
      if(v.slice(0,2)==='u:'){const u=v.slice(2),old=(E.cells[id]||{})[s.dataset.dd];cells[id][s.dataset.dd]={n:(old&&old.u===u&&old.n)?old.n:(dutyUserName(u)||(old&&old.n)||''),u:u};}
      else cells[id][s.dataset.dd]={n:v.slice(2),u:''};});
  });
  if(document.querySelector('tr[data-slot]')||!E.slots.length)E.cells=cells;
}
async function dutyAct(a,id){
  if(a==='duty-print'){window.print();return true;}
  if(!canDuty())return a.indexOf('duty-')===0;
  if(a==='duty-edit'){S.dutyEdit=clone(S.duty&&S.duty.slots.length?{slots:S.duty.slots,cells:S.duty.cells}:{slots:[{id:'d'+uid(),name:'הפסקה 1',start:'',end:''}],cells:{}});render();return true;}
  if(a==='duty-cancel'){S.dutyEdit=null;render();return true;}
  if(!S.dutyEdit)return false;
  dutyCapture();const E=S.dutyEdit;
  if(a==='duty-add'){E.slots.push({id:'d'+uid(),name:'',start:'',end:''});render();return true;}
  if(a==='duty-rm'){const sl=E.slots[+id];if(sl&&confirm('למחוק את השורה "'+(sl.name||'ללא שם')+'"?')){E.slots.splice(+id,1);delete E.cells[sl.id];render();}return true;}
  if(a==='duty-up'){const i=+id;if(i>0){const t=E.slots[i];E.slots[i]=E.slots[i-1];E.slots[i-1]=t;render();}return true;}
  if(a==='duty-pick'){const f=document.getElementById('dutyFile');if(f)f.click();return true;}
  if(a==='duty-paste'){const t=(document.getElementById('dutyPaste')||{}).value||'';if(!t.trim()){toast('הדביקו קודם את הטבלה');return true;}S.dutyEdit=dutyImported(dutyParseText(t));render();return true;}
  if(a==='duty-save'){
    const bad=E.slots.find(sl=>!sl.name);if(bad){toast('לכל שורה צריך שם (למשל: הפסקה 1)');return true;}
    const nost=E.slots.find(sl=>!sl.start);if(nost&&!confirm('לשורה "'+nost.name+'" אין שעת התחלה, ולכן לא תקפוץ עליה תזכורת. לשמור בכל זאת?'))return true;
    if(!(await saveDuty({slots:E.slots,cells:E.cells})))return true;
    logAct('תורנויות','עדכון לוח התורנויות ('+E.slots.length+' שורות)');S.dutyEdit=null;toast('לוח התורנויות נשמר');render();return true;
  }
  return false;
}

const mtYear=d=>{const y=+String(d).slice(0,4),m=+String(d).slice(5,7);return m>=8?y:y-1;};
function mtYears(){const n=new Date(),cur=n.getMonth()+1>=8?n.getFullYear():n.getFullYear()-1,out=[];for(let y=2025;y<=cur;y++)out.push(y);return out;}
async function loadMeetings(){

    try{const d=await fsGet(p);if(d){const m=nn(d.m);LD[p]=clone(m);out=out.concat(Object.values(m));}}catch(e){S.mtErr=true;}}));

}
async function saveMeetings(){

}

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  text=text.replace(/^\ufeff/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur='';}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
    else if(c!=='\r')cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()));
}
const IMP_TARGETS=[['first','שם פרטי'],['last','שם משפחה'],['full','שם מלא'],['cls','כיתה'],['father','שם האב'],['fphone','טלפון האב'],
  ['mother','שם האם'],['mphone','טלפון האם'],['notes','הערות'],['extra','שדה נוסף (נשמר בכרטיס)'],['skip','לא לייבא']];
function impNorm(h){return String(h==null?'':h).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').replace(/[״"׳'.:_\-\/\\()]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();}
function guessTarget(h){
  const n=impNorm(h);if(!n)return 'skip';
  const toks=n.split(' '),has=(...w)=>w.some(x=>n.indexOf(x)>-1),tok=(...w)=>w.some(x=>toks.indexOf(x)>-1);
  const phone=has('טל','נייד','פלאפון','סלולר','phone','mobile','cell');
  const dad=tok('אב','האב','father','dad')||has('אבא');
  const mom=tok('אם','האם','mother','mom')||has('אמא');
  if(phone&&dad&&!mom)return 'fphone';
  if(phone&&mom&&!dad)return 'mphone';
  if(has('פרטי')||n==='first name'||n==='first')return 'first';
  if(has('משפחה')||n==='last name'||n==='surname'||n==='last')return 'last';
  if(dad&&!mom&&!phone)return 'father';
  if(mom&&!dad&&!phone)return 'mother';
  if(has('כיתה','כתה','שיעור','class'))return 'cls';
  if(n==='שם'||has('שם מלא','שם התלמיד','שם תלמיד','שם הילד','student','name'))return 'full';
  if(has('הערה','הערות','notes','remark'))return 'notes';
  if(phone)return 'phone';
  if(['מס','#','מספר','מס סידורי','מספר סידורי','no'].indexOf(n)>-1)return 'skip';
  return 'extra';
}
function detectHeaderRow(m){
  const lim=Math.min(m.length,12);
  for(let r=0;r<lim;r++){
    const cells=(m[r]||[]).filter(c=>String(c==null?'':c).trim()!=='');
    if(cells.length<2)continue;
    const g=(m[r]||[]).map(guessTarget);
    if(g.some(t=>t==='first'||t==='last'||t==='full'))return r;
  }
  for(let r=0;r<lim;r++){if((m[r]||[]).filter(c=>String(c==null?'':c).trim()!=='').length>=2)return r;}
  return 0;
}
function buildPreview(matrix){
  matrix=(matrix||[]).filter(r=>Array.isArray(r));
  if(!matrix.length)return {error:'הקובץ ריק'};
  const hr=detectHeaderRow(matrix);
  const width=Math.max.apply(null,matrix.map(r=>r.length));
  const head=[];for(let i=0;i<width;i++)head.push(String(matrix[hr][i]==null?'':matrix[hr][i]).replace(/[\u200e\u200f]/g,'').trim());
  const used={},map=head.map(function(h){
    let t=guessTarget(h);
    if(t!=='extra'&&t!=='skip'&&t!=='phone'){if(used[t])t='extra';else used[t]=1;}
    return t;
  });
  map.forEach(function(t,i){if(t==='phone'){if(!used.fphone){map[i]='fphone';used.fphone=1;}else if(!used.mphone){map[i]='mphone';used.mphone=1;}else map[i]='extra';}});
  // columns with header but no data at all -> skip
  const p={matrix:matrix,hr:hr,head:head,map:map};
  head.forEach(function(h,i){
    if(!h){map[i]=matrix.slice(hr+1).some(r=>String(r[i]==null?'':r[i]).trim())?'extra':'skip';}
  });
  return computeImport(p);
}
function computeImport(p){
  const m=p.matrix,map=p.map,head=p.head;
  const col=t=>map.indexOf(t);
  const rows=[],classes={};let noPhone=0;
  for(let r=p.hr+1;r<m.length;r++){
    const row=m[r]||[];
    const v=i=>i<0?'':String(row[i]==null?'':row[i]).replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,'').trim();
    const full=v(col('full')),fl=(v(col('first'))+' '+v(col('last'))).trim();
    const name=(col('first')>-1||col('last')>-1)?(fl||full):full;
    if(!name)continue;
    let cls=v(col('cls'));
    {const bare=cls.replace(/['׳"״]/g,'').replace(/^כי?תה\s*/,'').trim();if(bare&&bare.length<=2&&!/\d/.test(bare))cls='כיתה '+bare+GER;}
    const extra={};
    map.forEach(function(t,i){if(t==='extra'){const x=v(i);if(x)extra[head[i]||('עמודה '+(i+1))]=x;}});
    const o={id:uid(),name:name,cls:cls,father:v(col('father')),fatherPhone:cleanPhone(v(col('fphone'))),
      mother:v(col('mother')),motherPhone:cleanPhone(v(col('mphone'))),notes:v(col('notes')),extra:extra};
    if(!Object.keys(extra).length)delete o.extra;
    if(!o.fatherPhone&&!o.motherPhone)noPhone++;
    if(cls)classes[cls]=1;
    rows.push(o);
  }
  p.rows=rows;p.classes=Object.keys(classes).sort();p.noPhone=noPhone;
  p.error=(col('full')<0&&col('first')<0&&col('last')<0)?'nomap':(rows.length?null:'norows');
  return p;
}
function loadSheetJS(){
  return new Promise(function(res,rej){
    if(window.XLSX)return res(window.XLSX);
    const sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload=()=>res(window.XLSX);sc.onerror=()=>rej(new Error('cdn'));
    document.head.appendChild(sc);
  });
}
async function handleImportFile(file){
  try{
    if(file.name.toLowerCase().slice(-4)==='.csv'){
      S.importPreview=buildPreview(parseCSV(await file.text()));
    }else{
      let X;
      try{X=await loadSheetJS();}
      catch(e){S.importPreview={error:'לקריאת קובץ אקסל צריך חיבור לאינטרנט בפעם הראשונה. אפשר גם לשמור באקסל כ־CSV UTF-8 ולייבא — זה עובד גם בלי אינטרנט.'};return render();}
      const wb=X.read(await file.arrayBuffer(),{type:'array'});
      const mz=parseMazevet(wb,X);
      if(mz){const p={mz:true,rows:mz.rows,labels:mz.labels,cmap:{}};Object.keys(mz.labels).forEach(l=>p.cmap[l]=mzSuggest(l));S.importPreview=computeMz(p);return render();}
      let best=null;
      wb.SheetNames.forEach(function(n){const mtx=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).filter(r=>r.some(c=>String(c).trim()));if(!best||mtx.length>best.length)best=mtx;});
      S.importPreview=buildPreview(best||[]);
    }
  }catch(e){S.importPreview={error:'לא הצלחתי לקרוא את הקובץ: '+e.message};}
  render();
}

function loadRevDraft(){
  const s=S.revList[S.revIdx];
  if(!s){S.revDraft=null;return;}
  const ex=S.reviews.find(r=>r.studentId===s.id&&r.date===S.revDate);
  S.revDraft=ex?{light:ex.light,scores:Object.assign({},ex.scores),note:ex.note}:{light:'',scores:{},note:''};
}
function saveRev(){
  const s=S.revList[S.revIdx],d=S.revDraft;
  if(!s||!d)return false;
  if(!d.light&&!d.note&&!Object.keys(d.scores).length)return false;
  const rec={id:uid(),studentId:s.id,date:S.revDate,light:d.light||'yellow',scores:d.scores,note:d.note,by:S.me.teacher||S.me.user,ts:Date.now()};
  const i=S.reviews.findIndex(r=>r.studentId===s.id&&r.date===S.revDate);
  if(i>-1){rec.id=S.reviews[i].id;S.reviews[i]=rec;}else{S.reviews.push(rec);S.revDone++;}
  save(K.reviews,S.reviews);
  return true;
}

    if(S.importPreview&&S.importPreview.mz){S.config.clsMap=Object.assign({},S.config.clsMap||{},S.importPreview.cmap);S.importPreview.rows.forEach(r=>delete r.src);}
    if(a==='import-replace'&&S.students.length&&!confirm('החלפה מלאה מוחקת את כל התלמידים הקיימים, וגם את הנוכחות ותמונות המצב שלהם. להמשיך?'))return;
    const p=S.importPreview;
    p.classes.forEach(function(c){if(S.config.classes.indexOf(c)<0)S.config.classes.push(c);});
    S.students=a==='import-replace'?p.rows:S.students.concat(p.rows);
    if(a==='import-replace'){S.att={};S.reviews=[];save(K.att,S.att);save(K.reviews,S.reviews);}
    save(K.students,S.students);save(K.config,S.config);
    logAct('ייבוא תלמידים',p.rows.length+' תלמידים'+(a==='import-replace'?' (החלפה)':' (הוספה)'));S.importPreview=null;S.tab='students';toast(p.rows.length+' תלמידים יובאו');return render();

  if(a==='pick-logo')return document.getElementById('logoFile').click();
  if(a==='del-logo'){S.config.logo='';save(K.config,S.config);toast('הלוגו הוסר');return render();}

  }
  if(a==='del-dom'){
    S.config.domains=domains().filter(d=>d.id!==id);

  if(a==='user-edit'){S.editUser=Object.assign({},S.config.users.find(u=>u.id===id));return render();}
  if(a==='user-cancel'){S.editUser=null;return render();}

    if(role==='teacher'&&!tch)return toast('למורה צריך לבחור את השם שלו ממערכת השעות');
    if(!S.editUser.id&&!pass)return toast('צריך סיסמה');
    if(pass&&pass.length<6)return toast('סיסמה של 6 תווים לפחות');
    if(S.editUser.id===S.me.id&&role!=='admin')return toast('אי אפשר להוריד לעצמך את הרשאת המנהל');
    const base='insts/'+S.inst,data={user:name,role:role,cls:'',teacher:tch||'',active:true};
    toast('שומר…');
    try{
      if(!S.editUser.id){
        const r=await createAuthUser(S.inst,name,pass);
        const b=FS.batch();

        b.set(FS.doc('logins/'+S.inst+'_'+ukey(name)),{email:r.email,inst:S.inst,key:ukey(name)});

      }else{

        const lref=FS.doc('logins/'+S.inst+'_'+ukey(old.user));
        let email=null;try{const l=await lref.get();if(l.exists)email=l.data().email;}catch(e){}

        }

        if(email)b.set(FS.doc('logins/'+S.inst+'_'+ukey(name)),{email:email,inst:S.inst,key:ukey(name)});

    }catch(e){return toast(fbErr(e));}

    const u=S.config.users.find(x=>x.id===id);if(!u)return;
    try{
      const b=FS.batch();b.delete(FS.doc('insts/'+S.inst+'/members/'+id));b.delete(FS.doc('logins/'+S.inst+'_'+ukey(u.user)));await b.commit();
      await reloadMembers();logAct('מחיקת משתמש',u.user);toast('המשתמש נמחק');return render();

  if(a==='inst-open'){

      await createInst(code,name,r.uid,au,r.email,[]);

    }catch(e){return toast(fbErr(e));}
  }

  if(a==='add-cls'){
    const v=document.getElementById('newCls').value.trim();
    if(!v||S.config.classes.indexOf(v)>-1)return;

  if(a==='backup'){

    S.students=[];S.staff=[];S.att={};S.reviews=[];S.tasks=[];S.events=[];S.draft={};

document.getElementById('main').addEventListener('change',function(e){

  if(el.dataset&&el.dataset.scn!==undefined)return;
  if(el.dataset&&el.dataset.evf!==undefined){if(el.dataset.evf==='q')return;S.evf[el.dataset.evf]=el.value;return render();}
  if(el.id==='ev-time'&&S.evc){evCapture();const pn=perOfTime(S.evc.time);if(pn!==''){S.evc.period=pn;const sp=document.getElementById('ev-per');if(sp)sp.value=pn;}return;}

  if(el.id==='asFiles'&&el.files&&el.files.length){const fs=Array.from(el.files);el.value='';return asFilesChosen(fs);}
  if(el.dataset&&el.dataset.asf!==undefined&&S.as&&S.as.pending){document.querySelectorAll('#main [data-asn]').forEach(i=>S.as.pending[+i.dataset.asn].newName=i.value);S.as.pending[+el.dataset.asf].target=el.value;return render();}
  if(el.dataset&&el.dataset.asday&&S.as){S.as.day=el.value;S.as.page=0;return render();}
  if(el.dataset&&el.dataset.rc&&S.rc){S.rc[el.dataset.rc]=el.value;return render();}
  if(el.id==='ttFile'&&el.files&&el.files[0]){const f=el.files[0];el.value='';return handleTtFile(f);}
  if(el.dataset&&el.dataset.bk!==undefined&&S.bulk){document.querySelectorAll('#main [data-bku]').forEach(inp=>{S.bulk.list[+inp.dataset.bku].user=inp.value.trim();});S.bulk.list[+el.dataset.bk].on=el.checked;return render();}
  if(el.dataset&&el.dataset.bku!==undefined)return;
  if(el.dataset&&el.dataset.ttf){ttCapture();if(el.dataset.ttstu||(el.tagName==='INPUT'&&el.type!=='checkbox'))return;return render();}
  if(el.dataset&&el.dataset.per!==undefined)return;
  if(el.dataset&&el.dataset.hr!==undefined){S.config.homeroom=Object.assign({},S.config.homeroom||{});if(el.value)S.config.homeroom[el.dataset.hr]=el.value;else delete S.config.homeroom[el.dataset.hr];save(K.config,S.config);toast('המחנך עודכן');return render();}
  if(el.dataset&&el.dataset.cmap!==undefined&&S.importPreview&&S.importPreview.mz){S.importPreview.cmap[el.dataset.cmap]=el.value;computeMz(S.importPreview);return render();}
  if(el.dataset&&el.dataset.map!==undefined&&S.importPreview&&S.importPreview.map){
    const i=+el.dataset.map,t=el.value,p=S.importPreview;
    if(['extra','skip'].indexOf(t)<0)p.map.forEach(function(x,j){if(j!==i&&x===t)p.map[j]='extra';});
    p.map[i]=t;computeImport(p);return render();
  }
  if(el.id==='logoFile'&&el.files&&el.files[0]){
    const r=new FileReader();
    r.onload=function(){
      const img=new Image();
      img.onload=function(){
        let w=img.width,h=img.height;
        const sc=Math.min(260/w,110/h,1);w=Math.round(w*sc);h=Math.round(h*sc);
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        S.config.logo=cv.toDataURL('image/png');
        save(K.config,S.config);toast('הלוגו נשמר');render();
      };
      img.onerror=function(){toast('לא הצלחתי לקרוא את התמונה');};
      img.src=r.result;
    };
    r.readAsDataURL(el.files[0]);return;
  }
  if(el.id==='restoreFile'&&el.files&&el.files[0]){
    const r=new FileReader();
    r.onload=function(){try{
      const d=JSON.parse(r.result);
      const keepUsers=S.config.users;S.config=Object.assign({},d.config||S.config,{users:keepUsers});S.students=d.students||[];S.staff=d.staff||[];

    r.readAsText(el.files[0]);return;
  }
  const k=el.dataset.ch;if(!k)return;
  if(k==='dlDate'){dlCapture();saveDaylog();}
  S[k]=el.value;
  if(k==='lgCls')S.lgStu='';
  if(k==='markDate'){S.draft=Object.assign({},S.att[S.markDate]||{});S.dirty=false;S.markLesson=null;S.ldirty=false;}
  if(k==='revDate'&&S.revIdx!==null)loadRevDraft();
  render();

(async function(){
  const boot=document.getElementById('boot');
  let inst='';try{inst=localStorage.getItem('tt:inst')||'';}catch(e){}
  document.getElementById('li').value=inst;
  paintLogin();
  if(!window.firebase){
    boot.innerHTML='<div style="text-align:center;padding:20px;max-width:340px">לא הצלחתי לטעון את רכיבי ההתחברות.<br>בדקו את החיבור לאינטרנט, או שהכתובת gstatic.com חסומה בסינון.</div>';
    return;
  }
  firebase.initializeApp(FB_CONFIG);
  FS=firebase.firestore();AUTH=firebase.auth();
  try{FS.settings({experimentalForceLongPolling:true,merge:true});}catch(e){}
  // שמירת נתונים במכשיר רק כשבחרו "להישאר מחובר" (מכשיר אישי). במחשב משותף שום נתון לא נשאר על הדיסק
  let rem=false;try{rem=localStorage.getItem('tt:remember')==='1';}catch(e){}
  const jt=new URLSearchParams(location.search).get('join');
  if(jt){try{await AUTH.signOut();}catch(e){}return showJoin(jt);}
  const user=await new Promise(r=>{const un=AUTH.onAuthStateChanged(x=>{un();r(x);});});
  // מכשיר שהתחבר עם "להישאר מחובר" לפני שהסימון נשמר: החיבור נשמר בזיכרון הקבוע (לא בזיכרון הלשונית) — מסמנים אותו כמכשיר אישי
  if(user&&!rem){let inSession=false;try{inSession=Object.keys(sessionStorage).some(k=>k.indexOf('firebase:authUser:')===0);}catch(e){}
    if(!inSession){rem=true;try{localStorage.setItem('tt:remember','1');}catch(e){}}}
  if(rem){try{await FS.enablePersistence({synchronizeTabs:true});}catch(e){}}
  let ok=false;
  if(user&&inst){try{ok=await enterInst(inst,user,null);}catch(e){}}
  boot.style.display='none';
  if(!ok){
    document.getElementById('login').style.display='flex';
    document.getElementById(inst?'lu':'li').focus();
  }
})();

const side=document.getElementById('side'),backdrop=document.getElementById('backdrop');
function drawerOpen(){return side.classList.contains('open');}
function openDrawer(){
  if(drawerOpen())return;
  side.classList.add('open');backdrop.classList.add('on');
  try{history.pushState({tab:S.tab,cardId:S.cardId,menu:1},'','#'+S.tab);}catch(e){}
}
function closeDrawer(silent){
  if(!drawerOpen())return;
  side.classList.remove('open');backdrop.classList.remove('on');
  if(!silent&&history.state&&history.state.menu){try{history.back();}catch(e){}}
}
document.getElementById('menuBtn').addEventListener('click',openDrawer);
backdrop.addEventListener('click',()=>closeDrawer(false));

/* כפתור "חזרה" של אנדרואיד */
let histReady=false,fromPop=false;
function syncHistory(){
  if(fromPop)return;
  const st=history.state||{};
  const want={tab:S.tab,cardId:S.cardId};
  try{
    if(!histReady){history.replaceState(want,'','#'+S.tab);histReady=true;return;}
    if(st.menu){history.replaceState(want,'','#'+S.tab);return;}
    if(st.tab!==S.tab||(S.tab==='card'&&st.cardId!==S.cardId))history.pushState(want,'','#'+S.tab);
  }catch(e){}
}
window.addEventListener('popstate',function(e){
  if(drawerOpen()){closeDrawer(true);return;}
  if(!S.me)return;
  const st=e.state;
  if(!st||!st.tab)return;
  if(S.tab==='mark'&&S.dirty&&!confirm('יש שינויים בנוכחות שלא נשמרו. לצאת בכל זאת?')){try{history.pushState({tab:S.tab},'','#'+S.tab);}catch(x){}return;}
  fromPop=true;
  if(st.tab==='card'){if(st.cardId&&studentById(st.cardId)){S.cardId=st.cardId;S.tab='card';render();}else goTab('dash');}
  else goTab(st.tab);
  fromPop=false;window.scrollTo(0,0);
});

/* החלקות: פתיחת תפריט מהקצה, סגירה, ומעבר בין תלמידים בתמונת מצב */
let tStart=null;
document.addEventListener('touchstart',function(e){
  if(e.touches.length!==1){tStart=null;return;}
  const t=e.touches[0];
  tStart={x:t.clientX,y:t.clientY,time:Date.now(),edge:t.clientX>window.innerWidth-28,inSide:!!e.target.closest('#side'),
    field:!!e.target.closest('input,textarea,select,.scroll,table')};
},{passive:true});
document.addEventListener('touchend',function(e){
  if(!tStart||!S.me)return;
  const t=e.changedTouches[0],dx=t.clientX-tStart.x,dy=t.clientY-tStart.y,dt=Date.now()-tStart.time;
  const s=tStart;tStart=null;
  if(dt>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2)return;
  const mobile=matchMedia('(max-width:820px)').matches;
  if(mobile&&s.edge&&dx<0&&!drawerOpen())return openDrawer();
  if(mobile&&drawerOpen()&&dx>0)return closeDrawer(false);
  if(s.field||s.inSide||drawerOpen())return;
  if(S.tab==='review'&&S.revIdx!=null&&S.revList[S.revIdx]){
    const btn=document.querySelector('#main [data-act="'+(dx<0?'rev-next':'rev-back')+'"]');
    if(btn&&!btn.disabled){btn.click();window.scrollTo(0,0);}
  }
},{passive:true});

/* התקנה כאפליקציה (כשהקובץ רץ מאתר) */
let installEvt=null;
if(/^https?:$/.test(location.protocol)&&!window.claude){
  if(!document.querySelector('link[rel="manifest"]')){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);}
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();installEvt=e;showInstall();});
window.addEventListener('appinstalled',function(){installEvt=null;toast('האפליקציה הותקנה');const b=document.getElementById('installBtn');if(b)b.remove();});
function showInstall(){
  if(!installEvt||document.getElementById('installBtn'))return;
  const b=document.createElement('button');b.className='btn full';b.dataset.v='primary';b.id='installBtn';b.textContent='התקנה כאפליקציה';b.style.marginBottom='10px';
  b.addEventListener('click',async function(){if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice;}catch(x){}installEvt=null;b.remove();});
  const who=document.getElementById('who');who.parentNode.insertBefore(b,who);
}
</script>
